<script>
// ---- 04-mode.js ----
// @requires: 00-core.js
// 运行模式：HTTP / file:// 与「退休后只读」的唯一判断处。
// 退休开关是构建常量 WB.FLAGS.retired（在 00-core.js），11-04 凭报告改 true 后重建。
(function(WB){
  "use strict";

  const HTTP = location.protocol === "http:" || location.protocol === "https:";
  const FLAGS = WB.FLAGS || (WB.FLAGS = {retired:false});

  const mode = {
    HTTP: HTTP,
    retired: !!FLAGS.retired,
    // file:// 是旧入口；退休后只读。HTTP 模式永远可写。
    readOnly: !!FLAGS.retired && !HTTP,
    // syncPaper 读取服务端进度期间，4 个同步字段先别让改。
    hydrating: false,

    ensureWritable: function(what){
      if(!mode.readOnly) return true;
      const label = what ? "（" + what + "）" : "";
      if(WB.status) WB.status("只读模式" + label + "：请从学习工作台打开后再修改。");
      return false;
    },

    banner: function(text){
      if(!text) return;
      const show = function(){
        let el = document.getElementById("modeBanner");
        if(!el){
          el = document.createElement("div");
          el.id = "modeBanner";
          el.className = "mode-banner";
          el.setAttribute("role", "status");
          const wrap = document.querySelector(".wrap") || document.body;
          wrap.insertBefore(el, wrap.firstChild);
        }
        el.textContent = text;
        el.classList.remove("hidden");
      };
      if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", show);
      else show();
    }
  };

  if(mode.readOnly){
    mode.banner("只读模式 · 进度以学习系统为准 · 可以查看和导出，不能修改。");
  }
  WB.cet6Mode = mode;
})(window.WB = window.WB || {});

</script>
<script>
// ---- 05-bridge.js ----
// @requires: 00-core.js, 04-mode.js
// 迁移桥：旧 file:// 工作台 → 学习系统后台；HTTP 首开 → 从后台恢复。
// 退休后（WB.FLAGS.retired=true）file:// 只读，不再推送；HTTP 的恢复交给 90-boot/58-sync。
// 只碰 localStorage 与网络，不参与渲染；放在 10-storage 之前，保证恢复/导入
// 在试卷层读取状态之前就已经安排好（HTTP 恢复会 reload 一次）。
(function(WB){
  "use strict";

  const PREFIX = "listening_";
  const STATE_PREFIX = "listening_splitter_v1_";
  const LEARNING_KEYS = [
    "listening_workbench_vocab_v1",
    "listening_workbench_history_v1"
  ];
  const MARK_IMPORTED = "listening_bridge_imported_v1";
  const MARK_BACKUP = "listening_bridge_backup_v1";
  const MARK_RESTORED = "listening_bridge_restored_v1";
  const REDIRECT_GUARD = "listening_bridge_redirect_v1";
  const SERVER = "http://127.0.0.1:8765";
  const SERVERS = [SERVER, "http://127.0.0.1:8766"];

  function isFile(){ return location.protocol === "file:"; }
  function isHttp(){ return location.protocol === "http:" || location.protocol === "https:"; }

  function collectAll(){
    const store = {};
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || k.indexOf(PREFIX) !== 0) continue;
      if(k === MARK_IMPORTED || k === MARK_RESTORED || k === MARK_BACKUP) continue;
      store[k] = localStorage.getItem(k);
    }
    return store;
  }

  function hasLearningData(){
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i) || "";
      const v = localStorage.getItem(k);
      if(!v) continue;
      if(k.indexOf(STATE_PREFIX) === 0 && v !== "{}" && v !== "null") return true;
      if(LEARNING_KEYS.indexOf(k) >= 0 && v !== "[]") return true;
    }
    return false;
  }

  function backup(store){
    try{
      const payload = {
        version: 1,
        exportedAt: new Date().toISOString(),
        note: "六级精听迁移到学习系统前的自动备份；可在工作台「导入数据」恢复。",
        store: store
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)],
        {type: "application/json;charset=utf-8"});
      const stamp = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "六级精听-迁移备份-" + stamp + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
      return true;
    }catch(e){
      console.warn("六级迁移备份下载失败：", e);
      return false;
    }
  }

  function ensureBackup(store){
    if(localStorage.getItem(MARK_BACKUP)) return;
    if(backup(store)){
      try{ localStorage.setItem(MARK_BACKUP, new Date().toISOString()); }catch(e){}
    }
  }

  async function importFileData(store, base){
    const server = base || SERVER;
    const keys = Object.keys(store);
    if(!keys.length){
      try{ localStorage.setItem(MARK_IMPORTED, new Date().toISOString()); }catch(e){}
      return;
    }
    ensureBackup(store);              // 迁移前先留一份可「导入数据」恢复的 JSON
    try{
      const res = await fetch(server + "/api/cet6/import", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({items: store})
      });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      try{ localStorage.setItem(MARK_IMPORTED, new Date().toISOString()); }catch(e){}
      console.info("六级进度已迁移到学习系统：" + (data.count || 0) + " 项");
    }catch(e){
      // 服务没开 / 端口变了：不写标记，下次打开 file:// 工作台会重试
      console.warn("六级进度迁移失败（下次打开会重试）：", e);
    }
  }

  // ---- 合并两份进度（file:// 推上来的 与 当前浏览器里的）----
  // 规则：done/标签取并集；笔记/分析/位置以本地为准，本地没有才用后台；统计取大。
  // 只有后台那份「上次合并后变过」才重新合并（用指纹判断），避免每次刷新都把
  // 「取消完成」的句子又翻出来。
  const MERGE_SIG_KEY = "learnsys_cet6_merge_sig_v1";

  function union(a, b){
    const out = [];
    (Array.isArray(a) ? a : []).forEach(function(x){ if(out.indexOf(x) < 0) out.push(x); });
    (Array.isArray(b) ? b : []).forEach(function(x){ if(out.indexOf(x) < 0) out.push(x); });
    return out;
  }

  function mergeState(localRaw, serverRaw){
    let L, S;
    try{ L = JSON.parse(localRaw); }catch(e){ return serverRaw; }
    try{ S = JSON.parse(serverRaw); }catch(e){ return localRaw; }
    if(!L || typeof L !== "object" || Array.isArray(L)) return serverRaw;
    if(!S || typeof S !== "object" || Array.isArray(S)) return localRaw;
    const out = JSON.parse(JSON.stringify(L));
    out.done = out.done || {};
    Object.keys(S.done || {}).forEach(function(item){
      const src = S.done[item] || {};
      const dst = out.done[item] || (out.done[item] = {});
      Object.keys(src).forEach(function(s){ if(src[s]) dst[s] = true; });
    });
    out.errors = out.errors || {};
    Object.keys(S.errors || {}).forEach(function(item){
      const src = S.errors[item] || {};
      const dst = out.errors[item] || (out.errors[item] = {});
      Object.keys(src).forEach(function(s){ dst[s] = union(dst[s], src[s]); });
    });
    function fillMissing(dst, src){
      Object.keys(src || {}).forEach(function(item){
        if(dst[item] == null){ dst[item] = src[item]; return; }
        const a = dst[item], b = src[item];
        if(!a || typeof a !== "object" || Array.isArray(a)) return;
        if(!b || typeof b !== "object" || Array.isArray(b)) return;
        Object.keys(b).forEach(function(s){
          if(a[s] == null) a[s] = b[s];
        });
      });
    }
    ["notes", "starts", "ab", "loopCfg"].forEach(function(f){
      out[f] = out[f] || {};
      fillMissing(out[f], S[f]);
    });
    out.analysis = out.analysis || {};
    Object.keys(S.analysis || {}).forEach(function(item){
      if(out.analysis[item] == null) out.analysis[item] = S.analysis[item];
    });
    out.loopStats = out.loopStats || {};
    Object.keys(S.loopStats || {}).forEach(function(item){
      const src = S.loopStats[item] || {};
      const dst = out.loopStats[item] || (out.loopStats[item] = {});
      Object.keys(src).forEach(function(s){
        const a = dst[s] || {}, b = src[s] || {};
        dst[s] = {plays: Math.max(Number(a.plays) || 0, Number(b.plays) || 0),
                  loops: Math.max(Number(a.loops) || 0, Number(b.loops) || 0)};
      });
    });
    out.translation = out.translation || {};
    Object.keys(S.translation || {}).forEach(function(item){
      const src = S.translation[item] || {};
      const dst = out.translation[item] || (out.translation[item] = {});
      Object.keys(src).forEach(function(s){
        const a = dst[s] || {}, b = src[s] || {};
        if(!a.translation && b.translation) dst[s] = b;
      });
    });
    out.daily = out.daily || {};
    Object.keys(S.daily || {}).forEach(function(day){
      out.daily[day] = Math.max(Number(out.daily[day]) || 0, Number(S.daily[day]) || 0);
    });
    if(!out.pos && S.pos) out.pos = S.pos;
    out.cet6ConversationId = Math.max(Number(out.cet6ConversationId) || 0,
                                      Number(S.cet6ConversationId) || 0);
    return JSON.stringify(out);
  }

  function mergeVocab(localRaw, serverRaw){
    let L, S;
    try{ L = JSON.parse(localRaw); }catch(e){ return localRaw; }
    try{ S = JSON.parse(serverRaw); }catch(e){ return localRaw; }
    if(!Array.isArray(L) || !Array.isArray(S)) return localRaw;
    const have = {};
    L.forEach(function(v){ have[String((v && v.word) || "").toLowerCase()] = true; });
    const out = L.slice();
    S.forEach(function(v){
      const key = String((v && v.word) || "").toLowerCase();
      if(key && !have[key]){ out.push(v); have[key] = true; }
    });
    return JSON.stringify(out);
  }

  function mergeHistory(localRaw, serverRaw){
    let L, S;
    try{ L = JSON.parse(localRaw); }catch(e){ return localRaw; }
    try{ S = JSON.parse(serverRaw); }catch(e){ return localRaw; }
    if(!Array.isArray(L) || !Array.isArray(S)) return localRaw;
    const map = {};
    L.concat(S).forEach(function(v){
      if(!v || !v.dir) return;
      const old = map[v.dir];
      if(!old || Number(v.at) > Number(old.at)) map[v.dir] = v;
    });
    const out = Object.keys(map).map(function(k){ return map[k]; })
      .sort(function(a, b){ return Number(b.at) - Number(a.at); }).slice(0, 12);
    return JSON.stringify(out);
  }

  function mergeValue(key, localRaw, serverRaw){
    if(key.indexOf(STATE_PREFIX) === 0) return mergeState(localRaw, serverRaw);
    if(key === "listening_workbench_vocab_v1") return mergeVocab(localRaw, serverRaw);
    if(key === "listening_workbench_history_v1") return mergeHistory(localRaw, serverRaw);
    return localRaw;                       // 倍速 / 上次试卷：本地说了算
  }

  function signature(items){
    // 只求「后台这份变没变」，不需要加密哈希
    const text = JSON.stringify(items);
    let h = 2166136261;
    for(let i = 0; i < text.length; i++){
      h ^= text.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return text.length + ":" + h.toString(16);
  }

  async function restoreHttpData(){
    // 不用 sessionStorage 做一次性闸门：同一标签页里以后还要再合并（靠下面指纹防循环）
    try{
      const res = await fetch("/api/cet6/import", {cache: "no-store"});
      if(!res.ok) return;
      const data = await res.json();
      const items = (data && data.items) || {};
      const keys = Object.keys(items).filter(function(k){ return k.indexOf(PREFIX) === 0; });
      let changed = 0;
      if(keys.length){
        const sig = signature(items);
        let seen = "";
        try{ seen = localStorage.getItem(MERGE_SIG_KEY) || ""; }catch(e){}
        if(sig !== seen){
          keys.forEach(function(k){
            try{
              const localRaw = localStorage.getItem(k);
              if(localRaw == null){
                localStorage.setItem(k, items[k]);
                changed += 1;
                return;
              }
              if(localRaw === items[k]) return;
              const merged = mergeValue(k, localRaw, items[k]);
              if(merged !== localRaw){
                localStorage.setItem(k, merged);
                changed += 1;
              }
            }catch(e){}
          });
          try{ localStorage.setItem(MERGE_SIG_KEY, sig); }catch(e){}
        }
      }
      try{
        if(changed) localStorage.setItem(MARK_RESTORED, new Date().toISOString());
      }catch(e){}
      // 合并后 reload 一次：试卷层/启动器在同步执行，等不了 fetch 回来
      if(changed) location.reload();
    }catch(e){
      console.warn("从学习系统恢复六级进度失败：", e);
    }
  }

  function retired(){
    return !!(WB.FLAGS && WB.FLAGS.retired);
  }

  function updateFooter(){
    const node = document.querySelector("footer");
    if(!node) return;
    if(retired() && isFile()){
      node.textContent = "只读模式 · 进度以学习系统为准 · 可以查看和导出，不能修改";
      return;
    }
    if(isHttp()){
      node.textContent = "已接入学习系统 · 从文件夹打开也会跳到这一份 · AI 分析走统一后台";
    }
  }

  // 后台开着时，双击文件夹里的 HTML 也跳到同一个 HTTP 工作台 ——
  // 一份 localStorage、一个地址，file:// 和 /cet6/ 才不会各记各的进度。
  function probeServer(base, timeoutMs){
    return new Promise(function(resolve){
      let settled = false;
      const ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      const finish = function(ok){
        if(settled) return;
        settled = true;
        resolve(ok);
      };
      const timer = setTimeout(function(){
        if(ctrl) { try{ ctrl.abort(); }catch(e){} }
        finish(false);
      }, timeoutMs);
      const options = {mode:"no-cors", cache:"no-store"};
      if(ctrl) options.signal = ctrl.signal;
      fetch(base + "/cet6/", options).then(function(){
        clearTimeout(timer);
        finish(true);
      }).catch(function(){
        clearTimeout(timer);
        finish(false);
      });
    });
  }

  async function jumpToServer(){
    if(!isFile()) return false;
    if(sessionStorage.getItem(REDIRECT_GUARD) === "1") return false;   // 跳过一次还失败就别循环
    for(let i = 0; i < SERVERS.length; i++){
      if(!(await probeServer(SERVERS[i], 800))) continue;
      // 跳之前先把本地这份推上去：离线期间在文件夹里记的进度，后台一开就能补进同一份。
      // 退休后 file:// 不再作为写入口，只跳转、不推送。
      if(!retired()) await importFileData(collectAll(), SERVERS[i]);
      try{ sessionStorage.setItem(REDIRECT_GUARD, "1"); }catch(e){}
      location.replace(SERVERS[i] + "/cet6/" + (location.hash || ""));
      return true;
    }
    return false;
  }

  updateFooter();
  if(isFile()){
    jumpToServer().then(function(jumped){
      // 后台没开：退休前照旧把本地数据推上去；退休后只读，不推送。
      if(!jumped && !retired()) importFileData(collectAll());
    });
  }else if(isHttp() && !retired()){
    // 退休后由 58-sync 在 boot 时按试卷从 cet6_progress 恢复，不再合并 legacy 快照。
    restoreHttpData();
  }
})(window.WB = window.WB || {});

</script>
<script>
// ---- 10-storage.js ----
// @requires: 00-core.js
// 数据层：所有 localStorage 键的唯一来源，负责学习状态、历史、最近、生词与导出。
(function(WB){
  "use strict";

  const KEYS = {
    statePrefix: "listening_splitter_v1_",
    rate: "listening_workbench_rate_v1",
    vocab: "listening_workbench_vocab_v1",
    history: "listening_workbench_history_v1",
    last: "listening_workbench_last_paper_v1",
    ai: "listening_workbench_ai_v1"
  };
  const HISTORY_MAX = 12;

  let currentKey = "";
  let lastTouchAt = 0;
  let onSaved = null;

  function obj(v){
    return (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
  }

  function stateKey(paper){
    return KEYS.statePrefix + ((paper && (paper.paper_id || paper.title)) || "unknown");
  }

  function emptyState(){
    return {
      done:{}, errors:{}, starts:{}, notes:{}, analysis:{}, daily:{},
      pos:null, loopCfg:{}, loopStats:{}, ab:{}, translation:{},
      cet6ConversationId:0, transcriptFixSig:""
    };
  }

  function sanitizeState(s){
    const out = emptyState();
    out.done = obj(s.done);
    out.errors = obj(s.errors);
    out.starts = obj(s.starts);
    out.notes = obj(s.notes);
    out.analysis = obj(s.analysis);
    out.daily = obj(s.daily);
    out.pos = s.pos || null;
    out.loopCfg = obj(s.loopCfg);
    out.loopStats = obj(s.loopStats);
    out.ab = obj(s.ab);
    out.translation = obj(s.translation);
    out.cet6ConversationId = Number(s.cet6ConversationId) || 0;
    out.transcriptFixSig = String(s.transcriptFixSig || "");
    Object.keys(out.ab).forEach(function(id){
      const m = out.ab[id];
      if(!m || typeof m !== "object" || Array.isArray(m)){ delete out.ab[id]; return; }
      Object.keys(m).forEach(function(si){
        const v = m[si];
        if(!v || typeof v !== "object" || Array.isArray(v)) delete m[si];
      });
    });
    return out;
  }

  function setPaper(paper){
    currentKey = stateKey(paper);
    lastTouchAt = 0;
  }

  function loadState(paper){
    try{
      const raw = localStorage.getItem(stateKey(paper));
      if(!raw) return emptyState();
      return sanitizeState(JSON.parse(raw));
    }catch(e){
      return emptyState();
    }
  }

  function saveState(){
    if(!currentKey || !WB.state) return;
    try{
      localStorage.setItem(currentKey, JSON.stringify(WB.state));
    }catch(e){}
    if(onSaved) onSaved();
  }

  function setOnSaved(fn){
    onSaved = typeof fn === "function" ? fn : null;
  }

  function paperDoneCount(paper){
    try{
      const raw = localStorage.getItem(stateKey(paper));
      if(!raw) return 0;
      const st = JSON.parse(raw);
      const done = obj(st.done);
      let n = 0;
      Object.keys(done).forEach(function(k){
        const d = obj(done[k]);
        Object.keys(d).forEach(function(s){ if(d[s]) n += 1; });
      });
      return n;
    }catch(e){ return 0; }
  }

  function loadRate(){
    try{
      const r = Number(localStorage.getItem(KEYS.rate));
      return r > 0 ? r : 1;
    }catch(e){ return 1; }
  }

  function saveRate(r){
    try{ localStorage.setItem(KEYS.rate, String(r)); }catch(e){}
  }

  function loadVocab(){
    try{
      const a = JSON.parse(localStorage.getItem(KEYS.vocab) || "[]");
      return Array.isArray(a) ? a : [];
    }catch(e){ return []; }
  }

  function saveVocab(arr){
    if(WB.cet6Mode && WB.cet6Mode.readOnly) return;
    try{ localStorage.setItem(KEYS.vocab, JSON.stringify(arr)); }catch(e){}
  }

  // AI 助手的全局当前会话：跨试卷共用一段对话，历史列表仍按服务端 module=cet6 取。
  function loadAi(){
    try{
      const raw = JSON.parse(localStorage.getItem(KEYS.ai) || "{}");
      const top = Number(raw.fabTop);
      return {
        conversationId: Number(raw.conversationId) || 0,
        fabTop: isFinite(top) && top >= 0 ? top : null
      };
    }catch(e){ return {conversationId: 0, fabTop: null}; }
  }

  function saveAi(obj){
    try{
      const cur = loadAi();
      const next = Object.assign({}, cur, obj || {});
      localStorage.setItem(KEYS.ai, JSON.stringify(next));
    }catch(e){}
  }

  function getLast(){
    try{ return localStorage.getItem(KEYS.last) || ""; }catch(e){ return ""; }
  }

  function setLast(dir){
    try{ localStorage.setItem(KEYS.last, dir); }catch(e){}
  }

  function readHistory(){
    try{
      const a = JSON.parse(localStorage.getItem(KEYS.history) || "[]");
      return Array.isArray(a) ? a : [];
    }catch(e){ return []; }
  }

  function writeHistory(arr){
    try{
      localStorage.setItem(KEYS.history, JSON.stringify(arr.slice(0, HISTORY_MAX)));
    }catch(e){}
  }

  // 把当前试卷进度写进「最近」；默认 2 秒节流，force=true 立即写。
  function recordHistory(info, force){
    if(!info || !info.dir) return;
    const now = Date.now();
    if(!force && now - lastTouchAt < 2000) return;
    lastTouchAt = now;
    const arr = readHistory().filter(function(x){ return x.dir !== info.dir; });
    arr.unshift({
      dir: info.dir,
      title: info.title || info.dir,
      at: now,
      done: info.done || 0,
      total: info.total || 0,
      posLabel: info.posLabel || ""
    });
    writeHistory(arr);
  }

  function collectAllData(){
    const store = {};
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf("listening_") === 0){
        store[k] = localStorage.getItem(k);
      }
    }
    return {version: 1, exportedAt: new Date().toISOString(), store: store};
  }

  function importData(data){
    if(WB.cet6Mode && WB.cet6Mode.readOnly){
      throw new Error("只读模式：请从学习工作台打开后再导入数据");
    }
    if(!data || !data.store || typeof data.store !== "object"){
      throw new Error("不是本工作台导出的数据文件");
    }
    const keys = Object.keys(data.store);
    if(!keys.length) throw new Error("文件里没有学习数据");
    keys.forEach(function(k){ localStorage.setItem(k, data.store[k]); });
    return keys.length;
  }

  WB.store = {
    KEYS: KEYS,
    stateKey: stateKey,
    setPaper: setPaper,
    loadState: loadState,
    saveState: saveState,
    setOnSaved: setOnSaved,
    paperDoneCount: paperDoneCount,
    loadRate: loadRate,
    saveRate: saveRate,
    loadVocab: loadVocab,
    saveVocab: saveVocab,
    loadAi: loadAi,
    saveAi: saveAi,
    getLast: getLast,
    setLast: setLast,
    readHistory: readHistory,
    writeHistory: writeHistory,
    recordHistory: recordHistory,
    collectAllData: collectAllData,
    importData: importData
  };
})(window.WB = window.WB || {});

</script>
<script>
// ---- 20-paper.js ----
// @requires: 00-core.js, 10-storage.js
// 试卷模型层：当前 Section/题型、句子范围、逐句学习状态（完成/断点/笔记/起点/循环/A-B）。
(function(WB){
  "use strict";

  const U = WB.util;

  function paper(){ return WB.session.paper; }
  function state(){ return WB.state; }

  function currentSection(){
    return paper().sections[WB.session.currentSi];
  }

  function currentItem(){
    return currentSection().items[WB.session.currentIi];
  }

  function itemId(sec, item){
    return sec.letter + "-" + item.index;
  }

  function currentItemId(){
    return itemId(currentSection(), currentItem());
  }

  function mapOf(name){
    const id = currentItemId();
    const group = state()[name] || {};
    return group[id] || {};
  }

  function doneMap(){ return mapOf("done"); }
  function errorMap(){ return mapOf("errors"); }
  function startMap(){ return mapOf("starts"); }
  function noteMap(){ return mapOf("notes"); }
  function loopCfgMap(){ return mapOf("loopCfg"); }
  function loopStatMap(){ return mapOf("loopStats"); }
  function abMap(){ return mapOf("ab"); }

  function loopCfgFor(i){
    const c = loopCfgMap()[i] || {};
    return {on: !!c.on, times: Math.max(1, Number(c.times) || 1)};
  }

  function loopStatText(st){
    const loops = Number(st && st.loops) || 0;
    if(!loops) return "";
    return "已循环 " + loops + " 次 · 共播放 " + (Number(st.plays) || 0) + " 次";
  }

  // 结构补句用独立 i（如 1001）避免和旧句号冲突；display 只负责界面显示。
  function sentenceLabel(s){
    if(!s) return "";
    return s.display != null ? String(s.display) : String(s.i).padStart(2, "0");
  }

  function effectiveStart(s){
    const m = startMap();
    return (m[s.i] != null) ? m[s.i] : s.start;
  }

  function baseRange(s, idx){
    const item = currentItem();
    const next = item.sentences[idx + 1];
    const start = Math.max(0, effectiveStart(s) - 0.15);
    let end = next ? effectiveStart(next) - 0.02 : s.end + 0.3;
    if(end <= start) end = start + 1.5;
    return [start, end];
  }

  function findSentence(i){
    const item = currentItem();
    return item.sentences.find(function(s){ return s.i === i; }) || null;
  }

  function findIndex(i){
    const item = currentItem();
    return item.sentences.findIndex(function(s){ return s.i === i; });
  }

  function baseRangeByIndex(i){
    const idx = findIndex(i);
    if(idx < 0) return null;
    return baseRange(currentItem().sentences[idx], idx);
  }

  // 读取某句的 A-B，并按当前句范围夹取。
  function resolveAB(i){
    const raw = abMap()[i];
    const r = baseRangeByIndex(i);
    if(!raw || !r) return {a:null, b:null, mode:null};
    let a = null, b = null;
    if(raw.a != null) a = U.round1(U.clamp(Number(raw.a), r[0], Math.max(r[0], r[1] - 0.2)));
    if(raw.b != null) b = U.round1(U.clamp(Number(raw.b), r[0], r[1]));
    if(raw.a != null && raw.b != null){
      if(a != null && b != null && b > a + 0.2) return {a:a, b:b, mode:"ab"};
      return {a:null, b:null, mode:null}; // A-B 无效时按整句播放，保留数据供用户修正
    }
    if(a != null) return {a:a, b:null, mode:"a"};
    return {a:null, b:b, mode:null};
  }

  function abView(i){
    const raw = abMap()[i];
    if(!raw || (raw.a == null && raw.b == null)) return {text:"", invalid:false};
    const r = resolveAB(i);
    if(r.mode === "ab") {
      return {text:"A " + U.fmtPrecise(r.a) + " / B " + U.fmtPrecise(r.b), invalid:false};
    }
    if(raw.a != null && raw.b != null) {
      return {text:"A-B 无效（B 需晚于 A 0.2 秒）", invalid:true};
    }
    if(r.a != null) return {text:"A " + U.fmtPrecise(r.a) + " / B —", invalid:false};
    return {text:"A — / B " + U.fmtPrecise(r.b), invalid:false};
  }

  function totalSentences(){
    let n = 0;
    paper().sections.forEach(function(sec){
      sec.items.forEach(function(item){ n += item.sentences.length; });
    });
    return n;
  }

  function totalDone(){
    let n = 0;
    paper().sections.forEach(function(sec){
      sec.items.forEach(function(item){
        const d = state().done[itemId(sec, item)] || {};
        n += Object.keys(d).filter(function(k){ return d[k]; }).length;
      });
    });
    return n;
  }

  function historyInfo(){
    const sec = currentSection();
    const item = currentItem();
    return {
      dir: WB.session.paperDir || paper().title,
      title: paper().title,
      done: totalDone(),
      total: totalSentences(),
      posLabel: sec && item ? sec.name + " / " + item.title : ""
    };
  }

  function currentId(){
    return currentItemId();
  }

  function toggleDone(i){
    if(WB.cet6Mode && !WB.cet6Mode.ensureWritable("标记完成")){
      const m = state().done[currentId()] || {};
      return !!m[i];
    }
    const id = currentId();
    state().done[id] = state().done[id] || {};
    const wasDone = !!state().done[id][i];
    if(wasDone) delete state().done[id][i];
    else state().done[id][i] = true;
    const today = new Date().toISOString().slice(0, 10);
    state().daily = state().daily || {};
    const n = state().daily[today] || 0;
    state().daily[today] = wasDone ? Math.max(0, n - 1) : n + 1;
    WB.store.saveState();
    return !wasDone;
  }

  function toggleError(i, t){
    if(WB.cet6Mode && !WB.cet6Mode.ensureWritable("断点标签")){
      return ((state().errors[currentId()] || {})[i] || []).slice();
    }
    const id = currentId();
    state().errors[id] = state().errors[id] || {};
    const arr = state().errors[id][i] || [];
    const at = arr.indexOf(t);
    if(at >= 0) arr.splice(at, 1);
    else arr.push(t);
    if(arr.length) state().errors[id][i] = arr;
    else delete state().errors[id][i];
    WB.store.saveState();
    return arr;
  }

  function setNote(i, text){
    if(WB.cet6Mode && !WB.cet6Mode.ensureWritable("笔记")) return;
    const id = currentId();
    state().notes[id] = state().notes[id] || {};
    if(String(text).trim()) state().notes[id][i] = text;
    else delete state().notes[id][i];
    if(!Object.keys(state().notes[id]).length) delete state().notes[id];
    WB.store.saveState();
  }

  function setStart(i, t){
    const id = currentId();
    state().starts[id] = state().starts[id] || {};
    state().starts[id][i] = U.round1(t);
    WB.store.saveState();
    return state().starts[id][i];
  }

  // 单句恢复自动起点：只删这一句的手动起点，其它句不动。
  function resetStart(i){
    const id = currentId();
    const map = state().starts[id];
    if(!map || map[i] == null) return false;
    delete map[i];
    if(!Object.keys(map).length) delete state().starts[id];
    WB.store.saveState();
    return true;
  }

  function resetStarts(){
    const id = currentId();
    if(!state().starts[id] || !Object.keys(state().starts[id]).length) return false;
    delete state().starts[id];
    WB.store.saveState();
    return true;
  }

  function setLoopCfg(i, patch){
    const id = currentId();
    state().loopCfg[id] = state().loopCfg[id] || {};
    const cur = state().loopCfg[id][i] || {};
    cur.on = (patch.on != null) ? !!patch.on : !!cur.on;
    cur.times = Math.max(1, Number(patch.times != null ? patch.times : cur.times) || 1);
    state().loopCfg[id][i] = cur;
    WB.store.saveState();
    return cur;
  }

  function bumpLoopStat(i, key){
    if(i == null || i < 0) return null;
    if(WB.cet6Mode && !WB.cet6Mode.ensureWritable("循环统计")) return null;
    const id = currentId();
    state().loopStats[id] = state().loopStats[id] || {};
    const st = state().loopStats[id][i] || {plays:0, loops:0};
    st[key] = (Number(st[key]) || 0) + 1;
    if(key === "loops") st.plays = (Number(st.plays) || 0) + 1;
    state().loopStats[id][i] = st;
    WB.store.saveState();
    if(WB.cet6Sync && WB.cet6Sync.schedule) WB.cet6Sync.schedule();
    return st;
  }

  function setABPoint(i, which, t){
    const r = baseRangeByIndex(i);
    if(!r) return {ok:false, message:"找不到这一句。"};
    const id = currentId();
    const raw = (state().ab[id] && state().ab[id][i]) || {};
    let a = (raw.a != null) ? Number(raw.a) : null;
    let b = (raw.b != null) ? Number(raw.b) : null;
    if(which === "A"){
      a = U.round1(U.clamp(t, r[0], Math.max(r[0], r[1] - 0.2)));
      if(b != null && b <= a + 0.2) b = null;
    }else{
      const nb = U.round1(U.clamp(t, r[0], Math.max(r[0], r[1] - 0.1)));
      if(a != null && nb <= a + 0.2){
        return {ok:false, message:"B 点必须晚于 A 点 0.2 秒以上。"};
      }
      b = nb;
    }
    state().ab[id] = state().ab[id] || {};
    state().ab[id][i] = {a:a, b:b};
    WB.store.saveState();
    return {ok:true, message:""};
  }

  function clearAB(i){
    const id = currentId();
    if(!state().ab[id]) return;
    delete state().ab[id][i];
    if(!Object.keys(state().ab[id]).length) delete state().ab[id];
    WB.store.saveState();
  }

  WB.paper = {
    currentSection: currentSection,
    currentItem: currentItem,
    itemId: itemId,
    currentItemId: currentItemId,
    doneMap: doneMap,
    errorMap: errorMap,
    startMap: startMap,
    noteMap: noteMap,
    loopCfgMap: loopCfgMap,
    loopStatMap: loopStatMap,
    abMap: abMap,
    loopCfgFor: loopCfgFor,
    loopStatText: loopStatText,
    sentenceLabel: sentenceLabel,
    effectiveStart: effectiveStart,
    baseRange: baseRange,
    baseRangeByIndex: baseRangeByIndex,
    findSentence: findSentence,
    findIndex: findIndex,
    resolveAB: resolveAB,
    abView: abView,
    totalSentences: totalSentences,
    totalDone: totalDone,
    historyInfo: historyInfo,
    toggleDone: toggleDone,
    toggleError: toggleError,
    setNote: setNote,
    setStart: setStart,
    resetStart: resetStart,
    resetStarts: resetStarts,
    setLoopCfg: setLoopCfg,
    bumpLoopStat: bumpLoopStat,
    setABPoint: setABPoint,
    clearAB: clearAB
  };
})(window.WB = window.WB || {});

</script>
<script>
// ---- 25-ranges.js ----
// @requires: 00-core.js
// 纯函数层：整段/整篇播放区间 + 「直接问」的结构化上下文。
// 不碰 DOM，方便用 node --test 直接测。
(function(WB){
  "use strict";

  function num(value, fallback){
    const n = Number(value);
    return isFinite(n) ? n : (fallback || 0);
  }

  function itemRange(item){
    if(!item) return {start:0, end:0};
    const content = item.content || {};
    const questions = item.questions || {};
    const start = Math.max(0, num(content.start) - 0.2);
    const contentEnd = Math.max(start + 0.2, num(content.end, start));
    const hasQuestions = num(questions.end) > num(questions.start) + 0.5;
    const end = hasQuestions ? num(questions.end) : contentEnd;
    return {start:start, end:Math.max(start + 0.2, end + 0.5)};
  }

  function sectionRange(sec){
    if(!sec) return {start:0, end:0};
    const start = Math.max(0, num(sec.start));
    const end = Math.max(start + 0.2, num(sec.end, start));
    return {start:start, end:end};
  }

  // 把当前学习现场压成一个 ContextSnapshot；服务端还会再做白名单和截断。
  // 除了当前句，还带前后句、本段原文、题目范围和进度，AI 才能回答
  // 「这段在讲什么」「为什么这句听不出来」而不只是看孤立一句。
  function contextPayload(input){
    input = input || {};
    const sentence = Number(input.sentence);
    const hasSentence = isFinite(sentence) && sentence >= 0;
    const errors = input.errors || {};
    const notes = input.notes || {};
    const stats = input.loopStats || {};
    const loop = hasSentence ? (stats[sentence] || {}) : {};
    const en = String(input.en || "").slice(0, 1000);
    const surrounding = {};
    if(hasSentence && en) surrounding.en = en;
    if(input.before) surrounding["前一句"] = String(input.before).slice(0, 1000);
    if(input.after) surrounding["后一句"] = String(input.after).slice(0, 1000);
    if(input.section) surrounding["Section"] = String(input.section).slice(0, 200);
    if(input.item) surrounding["题型单元"] = String(input.item).slice(0, 200);
    if(input.itemText) surrounding["本段原文"] = String(input.itemText).slice(0, 2000);
    if(input.questionText) surrounding["题目文本"] = String(input.questionText).slice(0, 1500);
    const learning = {
      sentence: hasSentence ? sentence : -1,
      display: input.display != null ? String(input.display).slice(0, 12) : "",
      en: en,
      tags: hasSentence ? (errors[sentence] || []) : [],
      note: hasSentence ? String(notes[sentence] || "").slice(0, 500) : "",
      loops: num(loop.loops),
      plays: num(loop.plays)
    };
    if(input.section) learning.section = String(input.section).slice(0, 200);
    if(input.item) learning.item = String(input.item).slice(0, 200);
    if(input.done != null) learning.done = !!input.done;
    if(input.paperDone != null) learning.paper_done = num(input.paperDone);
    if(input.paperTotal != null) learning.paper_total = num(input.paperTotal);
    return {
      surface: "cet6",
      object_type: "item",
      object_id: String(input.itemId || ""),
      title: String(input.title || "").slice(0, 200),
      selection: String(input.selection || "").slice(0, 2000),
      surrounding: surrounding,
      learning_state: learning,
      recent_actions: Array.isArray(input.recentActions)
        ? input.recentActions.slice(0, 20) : [],
      provenance: {
        source: "cet6",
        captured_at: new Date().toISOString(),
        ttl: 300
      }
    };
  }

  // 整卷句子时间轴：把每句的有效起点（含手动「设起点」）和下一句起点压平，
  // 供整段/整篇播放时查找「此刻在播哪一句」。纯函数，方便测试。
  function itemIdOf(sec, item){
    return (sec && sec.letter ? sec.letter : "?") + "-" + (item && item.index != null ? item.index : "?");
  }

  function sentenceTimeline(paper, startsByItem){
    const out = [];
    if(!paper || !Array.isArray(paper.sections)) return out;
    paper.sections.forEach(function(sec, si){
      (sec.items || []).forEach(function(item, ii){
        const map = (startsByItem || {})[itemIdOf(sec, item)] || {};
        const sents = item.sentences || [];
        sents.forEach(function(s, k){
          const manualStart = map[s.i];
          const start = manualStart != null ? num(manualStart) : num(s.start);
          const next = sents[k + 1];
          const nextManual = next && map[next.i] != null ? num(map[next.i]) : null;
          const nextStart = next ? (nextManual != null ? nextManual : num(next.start))
                                 : num(s.end) + 0.3;
          out.push({
            si: si, ii: ii, i: s.i,
            start: start,
            end: Math.max(start + 0.2, nextStart - 0.02),
            en: String(s.en || "")
          });
        });
      });
    });
    out.sort(function(a, b){ return a.start - b.start; });
    return out;
  }

  // 播放时间 t 落在哪一句；容忍首尾 0.35 秒，句间空隙不会来回闪。
  function sentenceAt(timeline, t){
    if(!Array.isArray(timeline) || !timeline.length) return null;
    const time = num(t);
    let lo = 0, hi = timeline.length - 1, best = -1;
    while(lo <= hi){
      const mid = (lo + hi) >> 1;
      if(timeline[mid].start <= time + 0.25){ best = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    if(best < 0) best = 0;
    // 先看「已经开始了的下一句」，避免句间 0.3 秒空隙还停在上句；
    // 下一句还没到起点时，再看上一句的尾巴。
    for(let k = Math.min(best, timeline.length - 1); k >= Math.max(0, best - 1); k--){
      const s = timeline[k];
      const startSlack = k === best ? 0.1 : 0.35;
      if(time >= s.start - startSlack && time <= s.end + 0.35) return s;
    }
    return null;
  }

  WB.ranges = {
    itemRange: itemRange,
    sectionRange: sectionRange,
    itemIdOf: itemIdOf,
    sentenceTimeline: sentenceTimeline,
    sentenceAt: sentenceAt
  };
  WB.contextPayload = contextPayload;
})(window.WB = window.WB || {});

</script>
<script>
// ---- 30-audio.js ----
// @requires: 00-core.js, 10-storage.js, 20-paper.js
// 服务层：音频播放状态机。这里集中管理 audio 元素、边界定时器、循环/连播和 A-B 窗口。
(function(WB){
  "use strict";

  const U = WB.util;
  let audio = null;
  let inited = false;
  let timelineCache = null;
  let seeking = false;

  function S(){ return WB.session; }

  function notifyTick(){
    if(audio){
      updateFollow();
      updatePlayerUI();
    }
    if(WB.audio.onTick) WB.audio.onTick();
  }
  function notifyWindow(){ if(WB.audio.onWindowChange) WB.audio.onWindowChange(); }
  function notifyRate(){ if(WB.audio.onRateChange) WB.audio.onRateChange(); }
  function notifyLoop(i, st){ if(WB.audio.onLoopStat) WB.audio.onLoopStat(i, st); }

  function safePlay(){
    const p = audio.play();
    if(p && p.catch) p.catch(function(){});
  }

  function url(path){
    if(/^(https?:|file:|data:|\/)/i.test(path)) return path;
    return S().audioBase + path;
  }

  // 把某句解析成实际播放窗口：A-B 优先，其次只有 A，最后整句。
  function resolveWindow(i){
    const base = WB.paper.baseRangeByIndex(i);
    if(!base) return null;
    const ab = WB.paper.resolveAB(i);
    if(ab.mode === "ab"){
      return {start:ab.a, end:ab.b, mode:"ab", baseStart:base[0], baseEnd:base[1]};
    }
    if(ab.mode === "a"){
      return {start:ab.a, end:base[1], mode:"a", baseStart:base[0], baseEnd:base[1]};
    }
    return {start:base[0], end:base[1], mode:"normal", baseStart:base[0], baseEnd:base[1]};
  }

  function bumpLoops(i){
    const st = WB.paper.bumpLoopStat(i, "loops");
    notifyLoop(i, st);
  }

  // ---- 整段/整篇播放跟随：按时间找当前句 ----
  function timeline(){
    if(!timelineCache){
      timelineCache = WB.ranges.sentenceTimeline(S().paper, (WB.state && WB.state.starts) || {});
    }
    return timelineCache;
  }

  function invalidateTimeline(){
    timelineCache = null;
  }

  function clearFollowHighlight(){
    document.querySelectorAll(".card.follow").forEach(function(c){
      c.classList.remove("follow");
    });
    S().followIndex = -1;
  }

  function followScopeHit(hit){
    if(!hit) return false;
    if(S().followScope === "item"){
      return hit.si === S().currentSi && hit.ii === S().currentIi;
    }
    if(S().followScope === "section"){
      return hit.si === S().followSectionSi;
    }
    return true;
  }

  function updateFollow(){
    if(!S().followActive) return;
    const hit = WB.ranges.sentenceAt(timeline(), audio.currentTime);
    if(!hit || !followScopeHit(hit)){
      // 句间空隙 / 题目段：保留上一个高亮，不要一秒一闪。
      return;
    }
    if(hit.si !== S().currentSi || hit.ii !== S().currentIi){
      if(WB.audio.onFollowItem){
        WB.audio.onFollowItem(hit.si, hit.ii, hit.i);
      }
    }
    if(hit.i === S().followIndex) return;
    clearFollowHighlight();
    S().followIndex = hit.i;
    const card = document.querySelector('.card[data-i="' + hit.i + '"]');
    if(card){
      card.classList.add("follow");
      if(!S().followPaused){
        card.scrollIntoView({block:"center", behavior:"smooth"});
      }
    }
    if(WB.render && WB.render.sentenceBar) WB.render.sentenceBar();
  }

  function setFollowPaused(paused){
    S().followPaused = !!paused;
    if(!S().followPaused && S().followIndex >= 0){
      const card = document.querySelector('.card[data-i="' + S().followIndex + '"]');
      if(card) card.scrollIntoView({block:"center", behavior:"smooth"});
    }
    if(WB.render && WB.render.sentenceBar) WB.render.sentenceBar();
  }

  function seekBy(delta){
    if(!audio) return;
    const dur = Number(audio.duration);
    const max = isFinite(dur) && dur > 0 ? dur : 1e9;
    audio.currentTime = U.clamp(audio.currentTime + Number(delta || 0), 0, max);
    if(S().followActive) S().followPaused = false;
    updateFollow();
    notifyTick();
  }

  // 自绘播放条：原生 controls 的左右键会按整段音频比例跳（28 分钟能跳 17 秒），
  // 精听不能用，所以只保留 audio 元素，控件全部自己做。
  function updatePlayerUI(){
    if(!audio) return;
    const dur = Number(audio.duration);
    const total = isFinite(dur) && dur > 0 ? dur : 0;
    const cur = Math.max(0, Number(audio.currentTime) || 0);
    if(WB.dom.playerCur) WB.dom.playerCur.textContent = U.fmtMini(cur);
    if(WB.dom.playerDur) WB.dom.playerDur.textContent = total ? U.fmtMini(total) : "0:00";
    if(WB.dom.playerSeek && !seeking){
      WB.dom.playerSeek.value = total
        ? String(Math.round(U.clamp(cur / total, 0, 1) * 1000))
        : "0";
    }
    if(WB.dom.playPauseBtn){
      WB.dom.playPauseBtn.textContent = audio.paused ? "▶" : "❚❚";
      WB.dom.playPauseBtn.setAttribute("aria-label", audio.paused ? "播放" : "暂停");
    }
  }

  function seekToFraction(frac){
    if(!audio) return;
    const dur = Number(audio.duration);
    if(!isFinite(dur) || dur <= 0) return;
    audio.currentTime = U.clamp(Number(frac) || 0, 0, 1) * dur;
    if(S().followActive) S().followPaused = false;
    updateFollow();
    notifyTick();
  }

  function togglePlayPause(){
    if(!audio) return;
    if(audio.paused){
      if(S().activeSentence >= 0) toggleSentence(S().activeSentence);
      else safePlay();
    }else{
      audio.pause();
    }
  }

  function playRange(start, end, sentenceIndex, scope){
    let win = null;
    if(sentenceIndex != null){
      win = resolveWindow(sentenceIndex);
      if(!win) return;
      start = win.start;
      end = win.end;
    }
    S().rangeStart = Math.max(0, start);
    S().rangeEnd = Math.max(S().rangeStart + 0.2, end);
    S().activeSentence = (sentenceIndex == null) ? -1 : sentenceIndex;

    if(sentenceIndex != null){
      S().activeLoopCfg = WB.paper.loopCfgFor(sentenceIndex);
      S().repeatLeft = S().activeLoopCfg.on
        ? 0
        : Math.max(0, S().activeLoopCfg.times - 1);
      S().ab = (win.mode === "ab")
        ? {a:S().rangeStart, b:S().rangeEnd}
        : null;
      const st = WB.paper.bumpLoopStat(sentenceIndex, "plays");
      notifyLoop(sentenceIndex, st);
      S().followActive = false;
      S().followPaused = false;
      clearFollowHighlight();
    }else{
      S().activeLoopCfg = {on:false, times:1};
      S().repeatLeft = 0;
      S().ab = null;
      document.querySelectorAll(".card.playing, .card.active").forEach(function(c){
        c.classList.remove("playing");
        c.classList.remove("active");
      });
      // 无单句的区间播放（整段/正文/整篇）= 开启跟随；题目段由调用方关掉。
      if(!scope || scope.kind !== "questions"){
        S().followActive = true;
        S().followScope = (scope && scope.kind) || "item";
        S().followSectionSi = (scope && scope.si != null) ? scope.si : S().currentSi;
        S().followPaused = false;
        clearFollowHighlight();
      }else{
        S().followActive = false;
        clearFollowHighlight();
      }
    }
    notifyWindow();

    const go = function(){
      audio.currentTime = S().rangeStart;
      safePlay();
      startBoundaryTimer();
      updateFollow();
      notifyTick();
    };
    if(audio.readyState >= 1) go();
    else audio.addEventListener("loadedmetadata", go, {once:true});
  }

  function checkBoundary(){
    if(!S().rangeEnd) return;
    const ab = S().ab;
    const boundary = ab ? ab.b : S().rangeEnd;
    if(audio.currentTime >= boundary){
      if(ab){
        audio.currentTime = ab.a;
        safePlay();
        bumpLoops(S().activeSentence);
      }else if(S().activeLoopCfg.on){
        audio.currentTime = S().rangeStart;
        safePlay();
        bumpLoops(S().activeSentence);
      }else if(S().repeatLeft > 0){
        S().repeatLeft -= 1;
        audio.currentTime = S().rangeStart;
        safePlay();
        bumpLoops(S().activeSentence);
      }else{
        audio.pause();
        stopBoundaryTimer();
      }
      notifyTick();
    }else{
      notifyTick();
    }
  }

  function startBoundaryTimer(){
    if(S().boundaryTimer) return;
    S().boundaryTimer = setInterval(checkBoundary, 50);
  }

  function stopBoundaryTimer(){
    if(S().boundaryTimer){
      clearInterval(S().boundaryTimer);
      S().boundaryTimer = null;
    }
  }

  function playSentence(i){
    const win = resolveWindow(i);
    if(!win) return;
    document.querySelectorAll(".card").forEach(function(c){
      c.classList.toggle("playing", c.dataset.i === String(i));
    });
    playRange(win.start, win.end, i);
  }

  function toggleSentence(i){
    const win = resolveWindow(i);
    if(!win) return;
    if(S().activeSentence === i && !audio.paused){
      audio.pause();
      notifyTick();
      return;
    }
    if(S().activeSentence === i && audio.paused &&
       audio.currentTime >= win.start && audio.currentTime < win.end - 0.05){
      safePlay();
      startBoundaryTimer();
      notifyTick();
      return;
    }
    playSentence(i);
  }

  function seekFraction(i, value){
    const activeHere = (i === S().activeSentence);
    const win = (activeHere && S().rangeEnd > S().rangeStart)
      ? {start:S().rangeStart, end:S().rangeEnd, mode:(S().ab ? "ab" : "normal")}
      : resolveWindow(i);
    if(!win) return;
    S().activeSentence = i;
    S().rangeStart = win.start;
    S().rangeEnd = win.end;
    S().ab = (win.mode === "ab") ? {a:win.start, b:win.end} : null;
    audio.currentTime = win.start + (Number(value) / 1000) * (win.end - win.start);
    notifyWindow();
    notifyTick();
  }

  function focusSentence(i){
    const win = resolveWindow(i);
    if(!win) return;
    S().followActive = false;
    S().followPaused = false;
    clearFollowHighlight();
    S().activeSentence = i;
    S().rangeStart = win.start;
    S().rangeEnd = win.end;
    S().ab = (win.mode === "ab") ? {a:win.start, b:win.end} : null;
    audio.pause();
    stopBoundaryTimer();
    audio.currentTime = win.start;
    document.querySelectorAll(".card").forEach(function(c){
      c.classList.toggle("active", c.dataset.i === String(i));
    });
    const card = document.querySelector('.card[data-i="' + i + '"]');
    if(card) card.scrollIntoView({block:"center", behavior:"smooth"});
    notifyWindow();
    notifyTick();
  }

  function moveSentence(delta){
    const item = WB.paper.currentItem();
    if(!item || !item.sentences.length) return;
    let idx = item.sentences.findIndex(function(s){ return s.i === S().activeSentence; });
    if(idx < 0) idx = 0;
    else idx = Math.max(0, Math.min(item.sentences.length - 1, idx + delta));
    focusSentence(item.sentences[idx].i);
  }

  function replayActive(){
    let i = S().activeSentence;
    if(i < 0){
      const card = document.querySelector(".card");
      i = card ? Number(card.dataset.i) : -1;
    }
    if(i >= 0) playSentence(i);
  }

  function jumpToStart(){
    const item = WB.paper.currentItem();
    audio.pause();
    stopBoundaryTimer();
    S().activeSentence = -1;
    S().rangeEnd = 0;
    S().ab = null;
    S().followActive = false;
    S().followPaused = false;
    clearFollowHighlight();
    document.querySelectorAll(".card.playing, .card.active").forEach(function(c){
      c.classList.remove("playing");
      c.classList.remove("active");
    });
    audio.currentTime = Math.max(0, item.content.start - 0.2);
    notifyWindow();
    notifyTick();
  }

  function playContent(){
    const item = WB.paper.currentItem();
    playRange(Math.max(0, item.content.start - 0.2), item.content.end + 0.2, null,
      {kind:"item", si:S().currentSi, ii:S().currentIi});
  }

  // 整段 = 正文 + 题目；整篇 = 当前 Section。都不绑定单句，但会跟随当前句。
  function playItem(){
    const item = WB.paper.currentItem();
    if(!item) return;
    const r = WB.ranges.itemRange(item);
    playRange(r.start, r.end, null, {kind:"item", si:S().currentSi, ii:S().currentIi});
    WB.status("正在播放整段：正文 + 题目（界面会跟着当前句滚动）");
  }

  function playSection(){
    const sec = WB.paper.currentSection();
    if(!sec) return;
    const r = WB.ranges.sectionRange(sec);
    playRange(r.start, r.end, null, {kind:"section", si:S().currentSi});
    WB.status("正在播放整个 " + sec.name + "（界面会跟着当前句滚动）");
  }

  function stopPlayback(){
    audio.pause();
    stopBoundaryTimer();
    S().activeSentence = -1;
    S().rangeEnd = 0;
    S().followActive = false;
    S().followPaused = false;
    clearFollowHighlight();
    notifyWindow();
    notifyTick();
  }

  function playQuestions(){
    const item = WB.paper.currentItem();
    if(item.questions.end > item.questions.start + 0.5){
      playRange(item.questions.start, item.questions.end, null, {kind:"questions"});
    }
  }

  function applyLoopCfg(i){
    if(i !== S().activeSentence) return;
    S().activeLoopCfg = WB.paper.loopCfgFor(i);
    S().repeatLeft = S().activeLoopCfg.on
      ? 0
      : Math.max(0, S().activeLoopCfg.times - 1);
  }

  function refreshWindow(i, autoPlayWhenAB){
    if(i !== S().activeSentence) return;
    const win = resolveWindow(i);
    if(!win) return;
    S().rangeStart = win.start;
    S().rangeEnd = win.end;
    S().ab = (win.mode === "ab") ? {a:win.start, b:win.end} : null;
    if(autoPlayWhenAB && win.mode === "ab"){
      document.querySelectorAll(".card").forEach(function(c){
        c.classList.toggle("playing", c.dataset.i === String(i));
      });
      audio.currentTime = win.start;
      const st = WB.paper.bumpLoopStat(i, "plays");
      notifyLoop(i, st);
      safePlay();
      startBoundaryTimer();
    }
    notifyWindow();
    notifyTick();
  }

  function setABPoint(i, which){
    if(i !== S().activeSentence) return {ok:false, message:"先选中这一句。"};
    const base = WB.paper.baseRangeByIndex(i);
    if(!base) return {ok:false, message:"找不到这一句。"};
    const t = U.clamp(audio.currentTime, base[0], Math.max(base[0], base[1] - 0.2));
    const res = WB.paper.setABPoint(i, which, t);
    if(!res.ok) return res;
    refreshWindow(i, which === "B");
    return res;
  }

  function clearAB(i){
    WB.paper.clearAB(i);
    if(i === S().activeSentence) refreshWindow(i, false);
  }

  function refreshActiveWindow(){
    const i = S().activeSentence;
    if(i >= 0) refreshWindow(i, false);
  }

  function init(){
    if(inited) return;
    inited = true;
    audio = WB.dom.audio;

    audio.addEventListener("loadedmetadata", function(){
      applyRate();
      updatePlayerUI();
      WB.status("音频就绪");
    });
    audio.addEventListener("durationchange", updatePlayerUI);
    audio.addEventListener("timeupdate", updatePlayerUI);
    audio.addEventListener("ended", updatePlayerUI);
    audio.addEventListener("play", function(){
      applyRate();
      // 直接点底部原生播放器（没有走 playRange）时，也按整卷跟随当前句。
      if(S().activeSentence < 0 && !S().rangeEnd){
        S().followActive = true;
        S().followScope = "paper";
        S().followSectionSi = S().currentSi;
        S().followPaused = false;
      }
      updateFollow();
      notifyTick();
    });
    audio.addEventListener("pause", function(){
      stopBoundaryTimer();
      notifyTick();
    });
    audio.addEventListener("ended", function(){
      stopBoundaryTimer();
      notifyTick();
    });
    audio.addEventListener("error", function(){
      WB.status("音频加载失败：请确认试卷目录里有 audio.mp3。");
    });

    if(WB.dom.playPauseBtn){
      WB.dom.playPauseBtn.addEventListener("click", togglePlayPause);
    }
    if(WB.dom.playerSeek){
      WB.dom.playerSeek.addEventListener("pointerdown", function(){ seeking = true; });
      WB.dom.playerSeek.addEventListener("input", function(){
        seeking = true;
        seekToFraction(Number(WB.dom.playerSeek.value) / 1000);
      });
      WB.dom.playerSeek.addEventListener("change", function(){
        seekToFraction(Number(WB.dom.playerSeek.value) / 1000);
        seeking = false;
      });
      WB.dom.playerSeek.addEventListener("pointerup", function(){ seeking = false; });
      WB.dom.playerSeek.addEventListener("keydown", function(e){
        if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        e.preventDefault();
        const step = e.shiftKey ? 5 : 1;
        seekBy(e.key === "ArrowRight" ? step : -step);
      });
    }
    window.addEventListener("pointerup", function(){ seeking = false; });
  }

  function loadRate(){
    S().playRate = WB.store.loadRate();
  }

  function applyRate(){
    if(audio) audio.playbackRate = S().playRate;
    if(WB.dom.playerRateBadge){
      WB.dom.playerRateBadge.textContent = (Math.round(S().playRate * 100) / 100) + "×";
    }
  }

  function setRate(r){
    S().playRate = Number(r) || 1;
    WB.store.saveRate(S().playRate);
    applyRate();
    notifyRate();
  }

  WB.audio = {
    init: init,
    url: url,
    safePlay: safePlay,
    resolveWindow: resolveWindow,
    playRange: playRange,
    playSentence: playSentence,
    toggleSentence: toggleSentence,
    seekFraction: seekFraction,
    focusSentence: focusSentence,
    moveSentence: moveSentence,
    replayActive: replayActive,
    jumpToStart: jumpToStart,
    playContent: playContent,
    playQuestions: playQuestions,
    playItem: playItem,
    playSection: playSection,
    stopPlayback: stopPlayback,
    applyLoopCfg: applyLoopCfg,
    setABPoint: setABPoint,
    clearAB: clearAB,
    refreshActiveWindow: refreshActiveWindow,
    startBoundaryTimer: startBoundaryTimer,
    stopBoundaryTimer: stopBoundaryTimer,
    invalidateTimeline: invalidateTimeline,
    setFollowPaused: setFollowPaused,
    seekBy: seekBy,
    seekToFraction: seekToFraction,
    togglePlayPause: togglePlayPause,
    updatePlayerUI: updatePlayerUI,
    updateFollow: updateFollow,
    loadRate: loadRate,
    applyRate: applyRate,
    setRate: setRate,
    isPaused: function(){ return !audio || audio.paused; },
    now: function(){ return audio ? audio.currentTime : 0; },
    hasSource: function(){ return !!(audio && audio.src); },
    onTick: null,
    onWindowChange: null,
    onRateChange: null,
    onLoopStat: null
  };
})(window.WB = window.WB || {});

</script>
<script>
// ---- 40-render.js ----
// @requires: 00-core.js, 10-storage.js, 20-paper.js, 30-audio.js
// 渲染层：只读状态并输出 DOM，不修改学习数据。
(function(WB){
  "use strict";

  const U = WB.util;
  const TAGS = ["生词","听不出","连读","句法","走神"];

  function nav(){
    const box = WB.dom.nav;
    box.innerHTML = "";
    WB.session.paper.sections.forEach(function(sec, si){
      const h = document.createElement("div");
      h.className = "nav-section";
      h.innerHTML = "<span>" + U.escapeHtml(sec.name) + "</span>" +
        '<button type="button" class="sec-play" data-sec-play="' + si +
        '" title="连续播放整个 Section">整篇</button>';
      box.appendChild(h);
      sec.items.forEach(function(item, ii){
        const b = document.createElement("button");
        b.className = "nav-item";
        b.textContent = item.title + " · " + item.sentences.length + " 句";
        b.dataset.si = String(si);
        b.dataset.ii = String(ii);
        box.appendChild(b);
      });
    });
  }

  function item(){
    const sec = WB.paper.currentSection();
    const cur = WB.paper.currentItem();
    const c = cur.content;
    const q = cur.questions;
    const reviewN = cur.sentences.filter(function(s){ return s.review; }).length;
    WB.dom.itemHeader.innerHTML =
      "<h2>" + U.escapeHtml(cur.title) + "</h2>" +
      '<p class="meta">' + U.escapeHtml(sec.name) +
      " · 正文 " + U.fmt(c.start) + "–" + U.fmt(c.end) +
      " · " + cur.sentences.length + " 句" +
      " · 题目 " + cur.question_items.length + " 题" +
      " · 待校对 " + reviewN + " 句</p>";

    warnings();
    sentences();
    questions();

    const hasQuestions = q.end > q.start + 0.5 && cur.question_items.length > 0;
    WB.dom.playQuestionsBtn.disabled = !hasQuestions;
    progress();
  }

  function warnings(){
    const box = WB.dom.warnings;
    const ws = WB.session.paper.warnings || [];
    if(!ws.length){ box.innerHTML = ""; return; }
    box.innerHTML = '<div class="warnings"><b>识别提示</b><ul>' +
      ws.map(function(w){ return "<li>" + U.escapeHtml(w) + "</li>"; }).join("") +
      "</ul></div>";
  }

  function cardLoopRow(s, lc, statText){
    const loopOn = !!lc.on;
    const repeatTimes = Math.max(1, Number(lc.times) || 1);
    return '<div class="card-loop">' +
      '<label title="勾选后本句不限次数循环，直到你暂停">' +
        '<input type="checkbox" name="loop-on-' + s.i + '" data-loop-on="' + s.i + '"' +
        (loopOn ? " checked" : "") + "> 循环</label>" +
      '<select name="loop-times-' + s.i + '" data-loop-times="' + s.i + '"' + (loopOn ? " disabled" : "") +
        ' title="本句连播几次后自动暂停；勾选「循环」时不限次数">' +
        [1,2,3,5].map(function(n){
          return '<option value="' + n + '"' +
            (repeatTimes === n ? " selected" : "") + ">连播 " + n + " 次</option>";
        }).join("") +
      "</select>" +
      '<span class="loop-stat" data-loop-stat="' + s.i + '">' +
        U.escapeHtml(statText) + "</span>" +
    "</div>";
  }

  function cardABRow(s){
    const raw = WB.paper.abMap()[s.i] || {};
    const hasAB = (raw.a != null || raw.b != null);
    const view = WB.paper.abView(s.i);
    return '<div class="card-ab">' +
      '<button data-ab="A" data-ab-i="' + s.i + '" ' +
        'title="选中本句并播放到短语开头，再点设 A">设 A</button>' +
      '<button data-ab="B" data-ab-i="' + s.i + '" ' +
        'title="继续播放到短语结尾，再点设 B">设 B</button>' +
      '<button data-ab="clear" data-ab-i="' + s.i + '"' +
        (hasAB ? "" : " disabled") + ">清除 A-B</button>" +
      '<span class="ab-badge' + (view.invalid ? " invalid" : "") +
        '" data-ab-badge="' + s.i + '">' + U.escapeHtml(view.text) + "</span>" +
    "</div>";
  }

  function sentences(){
    const cur = WB.paper.currentItem();
    const done = WB.paper.doneMap();
    const errors = WB.paper.errorMap();
    const starts = WB.paper.startMap();
    const notes = WB.paper.noteMap();
    const loopCfg = WB.paper.loopCfgMap();
    const loopStats = WB.paper.loopStatMap();
    const rows = [];

    cur.sentences.forEach(function(s, si){
      const isDone = !!done[s.i];
      const errs = errors[s.i] || [];
      const manual = starts[s.i] != null;
      const st = manual ? starts[s.i] : s.start;
      const note = notes[s.i] || "";
      const lc = loopCfg[s.i] || {};
      const range = WB.paper.baseRange(s, si);
      const reviewBadge = s.review
        ? '<span class="review" title="' +
            U.escapeHtml((s.review_reasons || []).join("、") || "自动标记") +
          '">待校对</span>'
        : "";
      rows.push(
        '<article class="card' + (isDone ? " done" : "") + '" data-i="' + s.i + '">' +
          '<div class="card-head">' +
            '<span class="num">' + U.escapeHtml(WB.paper.sentenceLabel(s)) + "</span>" +
            '<span class="time' + (manual ? " manual" : "") + '">' +
              U.fmtPrecise(st) + "–" + U.fmtPrecise(s.end) +
              (manual ? "（手动）" : "") +
            "</span>" +
            reviewBadge +
            '<span class="badge">' + (isDone ? "已完成" : "未完成") + "</span>" +
          "</div>" +
          '<p class="en hidden">' + U.escapeHtml(s.en) + "</p>" +
          '<div class="zh hidden" data-zh="' + s.i + '"></div>' +
          '<div class="mini">' +
            '<button class="mini-btn" data-act="toggle">▶</button>' +
            '<input class="mini-range" name="range-' + s.i + '" data-range="' + s.i + '" type="range" ' +
              'min="0" max="1000" value="0">' +
            '<span class="mini-time" data-cur="' + s.i + '">0:00 / ' +
              U.fmtMini(range[1] - range[0]) + "</span>" +
          "</div>" +
          cardLoopRow(s, lc, WB.paper.loopStatText(loopStats[s.i])) +
          cardABRow(s) +
          '<textarea class="note" name="note-' + s.i + '" data-note="' + s.i + '" maxlength="1000" ' +
            'placeholder="我的原因：比如语速太快 / 从句太长 / 这个词没反应过来…">' +
            U.escapeHtml(note) + "</textarea>" +
          '<div class="controls">' +
            '<button data-act="text">显示原文</button>' +
            '<button data-act="ask" title="带着这一句问 AI">问 AI</button>' +
            '<button data-act="start" title="先把音频播到这句开头，暂停，再点这里">设起点</button>' +
            (manual
              ? '<button data-act="resetStart" class="on" title="删除这一句的手动起点，恢复自动时间">恢复自动</button>'
              : "") +
            '<button data-act="done" class="' + (isDone ? "done" : "") + '">' +
              (isDone ? "取消完成" : "标记完成") + "</button>" +
          "</div>" +
          '<div class="errors"><span>断点：</span>' +
            TAGS.map(function(t){
              return '<button data-err="' + t + '" class="' +
                (errs.indexOf(t) >= 0 ? "on" : "") + '">' + t + "</button>";
            }).join("") +
          "</div>" +
        "</article>"
      );
    });

    WB.dom.sentences.innerHTML = rows.join("");
    if(WB.dom.empty) WB.dom.empty.style.display = "none";
    if(WB.session.activeSentence >= 0){
      const curCard = document.querySelector('.card[data-i="' + WB.session.activeSentence + '"]');
      if(curCard) curCard.classList.add("active");
    }
    if(WB.session.followActive && WB.session.followIndex >= 0){
      const followCard = document.querySelector('.card[data-i="' + WB.session.followIndex + '"]');
      if(followCard) followCard.classList.add("follow");
    }
    if(WB.translate && WB.translate.applyZh) WB.translate.applyZh();
    if(WB.translate && WB.translate.autoCurrent) WB.translate.autoCurrent();
    miniPlayer();
  }

  function questions(){
    const cur = WB.paper.currentItem();
    if(!cur.question_items.length){
      WB.dom.questions.innerHTML = '<p class="status">本段没有识别到题目文本。</p>';
      return;
    }
    WB.dom.questions.innerHTML = cur.question_items.map(function(q){
      return '<div class="q-row">' +
        '<div class="q-head">' +
          '<button data-q="' + q.i + '">播放</button>' +
          "<span>Q" + (q.number || q.i) + " · " + U.fmtPrecise(q.start) + "</span>" +
        "</div>" +
        "<p>" + U.escapeHtml(q.en || "（未识别到题目文本）") + "</p>" +
      "</div>";
    }).join("");
  }

  function progress(){
    const cur = WB.paper.currentItem();
    const done = WB.paper.doneMap();
    const itemTotal = cur.sentences.length;
    const itemDone = cur.sentences.filter(function(s){ return !!done[s.i]; }).length;
    WB.dom.progressText.textContent =
      "本段 " + itemDone + " / " + itemTotal +
      "（总 " + WB.paper.totalDone() + " / " + WB.paper.totalSentences() + "）";
    WB.dom.progressBar.style.width =
      itemTotal ? (itemDone / itemTotal * 100) + "%" : "0%";
  }

  function miniPlayer(){
    const cur = WB.paper.currentItem();
    if(!cur) return;
    document.querySelectorAll(".mini-range").forEach(function(r){
      const i = Number(r.dataset.range);
      const idx = WB.paper.findIndex(i);
      if(idx < 0) return;
      const s = cur.sentences[idx];
      const base = WB.paper.baseRange(s, idx);
      const curEl = document.querySelector('[data-cur="' + i + '"]');
      if(i === WB.session.activeSentence && WB.session.rangeEnd > WB.session.rangeStart){
        const len = WB.session.rangeEnd - WB.session.rangeStart;
        const p = U.clamp((WB.dom.audio.currentTime - WB.session.rangeStart) / len, 0, 1);
        r.value = String(Math.round(p * 1000));
        if(curEl){
          curEl.textContent =
            U.fmtMini(Math.max(0, WB.dom.audio.currentTime - WB.session.rangeStart)) +
            " / " + U.fmtMini(len);
        }
      }else{
        r.value = "0";
        if(curEl) curEl.textContent = "0:00 / " + U.fmtMini(base[1] - base[0]);
      }
    });
    document.querySelectorAll(".card").forEach(function(card){
      const i = Number(card.dataset.i);
      const btn = card.querySelector('[data-act="toggle"]');
      if(!btn) return;
      const playing = (i === WB.session.activeSentence && !WB.dom.audio.paused);
      btn.textContent = playing ? "❚❚" : "▶";
      btn.classList.toggle("on", playing);
    });
  }

  function sentenceBar(){
    const el = WB.dom.sentenceBarText;
    if(!el) return;
    if(WB.dom.followResume){
      WB.dom.followResume.classList.toggle("hidden", !WB.session.followPaused);
    }
    if(WB.session.followActive && WB.session.followIndex >= 0){
      const fs = WB.paper.findSentence(WB.session.followIndex);
      const fr = WB.paper.baseRangeByIndex(WB.session.followIndex);
      const label = fs ? WB.paper.sentenceLabel(fs)
        : String(WB.session.followIndex).padStart(2, "0");
      el.textContent = "正在播放第 " + label + " 句" +
        (fr ? " · " + U.fmtPrecise(fr[0] + 0.15) + "–" + U.fmtPrecise(fs ? fs.end : fr[1]) : "") +
        (WB.session.followPaused ? " · 跟随已暂停" : " · 自动跟随");
      return;
    }
    const i = WB.session.activeSentence;
    if(i < 0){
      el.textContent = "当前句：未选中（点 ▶ 或按 ↑ ↓）";
      return;
    }
    const s = WB.paper.findSentence(i);
    const r = WB.paper.baseRangeByIndex(i);
    if(s && r){
      el.textContent = "当前句 " + WB.paper.sentenceLabel(s) +
        " · " + U.fmtPrecise(r[0] + 0.15) + "–" + U.fmtPrecise(s.end);
    }
  }

  function loopStat(i, st){
    const el = document.querySelector('[data-loop-stat="' + i + '"]');
    if(el) el.textContent = WB.paper.loopStatText(st);
  }

  function cardAB(i){
    const badge = document.querySelector('[data-ab-badge="' + i + '"]');
    const view = WB.paper.abView(i);
    if(badge){
      badge.textContent = view.text;
      badge.classList.toggle("invalid", view.invalid);
    }
    const clearBtn = document.querySelector('[data-ab="clear"][data-ab-i="' + i + '"]');
    if(clearBtn){
      const raw = WB.paper.abMap()[i] || {};
      clearBtn.disabled = !(raw.a != null || raw.b != null);
    }
  }

  function rateButtons(){
    document.querySelectorAll("[data-rate]").forEach(function(b){
      b.classList.toggle("on", Math.abs(Number(b.dataset.rate) - WB.session.playRate) < 0.001);
    });
  }

  WB.render = {
    nav: nav,
    item: item,
    warnings: warnings,
    sentences: sentences,
    questions: questions,
    progress: progress,
    miniPlayer: miniPlayer,
    sentenceBar: sentenceBar,
    loopStat: loopStat,
    cardAB: cardAB,
    rateButtons: rateButtons,
    TAGS: TAGS
  };
})(window.WB = window.WB || {});

<script>
// ---- 50-actions.js ----
// @requires: 00-core.js, 10-storage.js, 20-paper.js, 30-audio.js, 40-render.js
// 操作层：把用户操作翻译成对 paper / audio 的调用，并触发渲染。
(function(WB){
  "use strict";

  const U = WB.util;
  let bound = false;

  function S(){ return WB.session; }

  function selectItem(si, ii){
    WB.dom.audio.pause();
    WB.audio.stopBoundaryTimer();
    S().activeSentence = -1;
    S().rangeEnd = 0;
    S().ab = null;
    S().currentSi = si;
    S().currentIi = ii;
    S().analysisHidden = false;
    WB.state.pos = {si:si, ii:ii};
    WB.store.saveState();
    document.querySelectorAll(".nav-item").forEach(function(b){
      b.classList.toggle("on",
        Number(b.dataset.si) === si && Number(b.dataset.ii) === ii);
    });
    WB.render.item();
    WB.insights.restoreLatest();
    if(WB.translate && WB.translate.applyZh) WB.translate.applyZh();
    WB.render.sentenceBar();
  }

  function setCardText(card, btn){
    const en = card.querySelector(".en");
    const show = en.classList.contains("hidden");
    en.classList.toggle("hidden", !show);
    // 原文和译文一起露：没有单独的「显示译文」开关了
    const zh = card.querySelector(".zh");
    if(zh) zh.classList.toggle("hidden", !show || !zh.textContent.trim());
    btn.textContent = show ? "隐藏原文" : "显示原文";
    btn.classList.toggle("on", show);
    if(show && WB.translate && WB.translate.autoCurrent) WB.translate.autoCurrent();
  }

  function setABFromCard(i, which){
    if(i !== S().activeSentence){
      WB.audio.focusSentence(i);
      WB.status("已选中第 " + i + " 句；播放到短语位置后再点「设 A/设 B」。");
      return;
    }
    const res = WB.audio.setABPoint(i, which);
    if(!res.ok){
      WB.status(res.message);
      return;
    }
    WB.render.cardAB(i);
    const view = WB.paper.abView(i);
    WB.status("第 " + i + " 句：" + (view.text || "A-B 已更新") +
      (view.invalid ? "（A-B 未生效，请重新设置）" : ""));
  }

  function clearABFromCard(i){
    WB.audio.clearAB(i);
    WB.render.cardAB(i);
    WB.status("第 " + i + " 句的 A-B 已清除。");
  }

  function onCardClick(e){
    const btn = e.target.closest("button");
    if(!btn) return;
    const card = btn.closest(".card");
    if(!card) return;
    const i = Number(card.dataset.i);

    if(btn.dataset.act === "text") setCardText(card, btn);
    if(btn.dataset.act === "toggle") WB.audio.toggleSentence(i);
    if(btn.dataset.act === "ask"){
      const s = WB.paper.findSentence(i);
      if(WB.ask && WB.ask.openFor) WB.ask.openFor({
        sentence: i,
        text: s ? s.en : "",
        prefill: "这一句为什么听不出来？"
      });
    }
    if(btn.dataset.act === "start"){
      if(!WB.audio.hasSource()){
        alert("请先加载音频。");
        return;
      }
      const t = WB.paper.setStart(i, WB.audio.now());
      WB.audio.invalidateTimeline();
      WB.render.sentences();
      WB.audio.refreshActiveWindow();
      WB.status("已把第 " + i + " 句起点设为 " + U.fmtPrecise(t) +
        "；点句子前的 ▶ 验证。");
    }
    if(btn.dataset.act === "resetStart"){
      if(WB.paper.resetStart(i)){
        WB.audio.invalidateTimeline();
        WB.render.sentences();
        WB.audio.refreshActiveWindow();
        WB.status("已恢复第 " + i + " 句的自动起点。");
      }
    }
    if(btn.dataset.act === "done"){
      if(WB.cet6Mode && !WB.cet6Mode.ensureWritable("标记完成")) return;
      const nowDone = WB.paper.toggleDone(i);
      WB.noteAction((nowDone ? "标记完成" : "取消完成") + "第 " + i + " 句");
      WB.render.sentences();
      WB.render.progress();
      WB.cet6Sync.schedule();
    }
    if(btn.dataset.err){
      if(WB.cet6Mode && !WB.cet6Mode.ensureWritable("断点标签")) return;
      WB.paper.toggleError(i, btn.dataset.err);
      WB.noteAction("第 " + i + " 句断点：" + btn.dataset.err);
      WB.render.sentences();
      WB.cet6Sync.schedule();
    }
    if(btn.dataset.ab === "A" || btn.dataset.ab === "B"){
      setABFromCard(i, btn.dataset.ab);
    }
    if(btn.dataset.ab === "clear") clearABFromCard(i);
  }

  function onCardInput(e){
    if(e.target.matches(".mini-range")){
      WB.audio.seekFraction(Number(e.target.dataset.range), e.target.value);
      return;
    }
    const ta = e.target.closest("textarea[data-note]");
    if(!ta) return;
    if(WB.cet6Mode && !WB.cet6Mode.ensureWritable("笔记")) return;
    WB.paper.setNote(Number(ta.dataset.note), ta.value);
    WB.cet6Sync.schedule();
  }

  function onCardChange(e){
    const onBox = e.target.closest("input[data-loop-on]");
    const timesSel = e.target.closest("select[data-loop-times]");
    if(!onBox && !timesSel) return;
    if(WB.cet6Mode && !WB.cet6Mode.ensureWritable("循环设置")) return;
    const i = Number(onBox ? onBox.dataset.loopOn : timesSel.dataset.loopTimes);
    const patch = {};
    if(onBox) patch.on = onBox.checked;
    if(timesSel) patch.times = Number(timesSel.value) || 1;
    const cur = WB.paper.setLoopCfg(i, patch);
    if(onBox){
      const sel = onBox.closest(".card-loop").querySelector("select[data-loop-times]");
      if(sel) sel.disabled = cur.on;
    }
    WB.audio.applyLoopCfg(i);
    WB.noteAction("第 " + i + " 句循环设置：" +
      (cur.on ? "不限次数" : "连播 " + cur.times + " 次"));
    WB.cet6Sync.schedule();
    WB.status(cur.on
      ? "第 " + i + " 句：不限次数循环。"
      : "第 " + i + " 句：连播 " + cur.times + " 次后自动暂停。");
  }

  function jumpToSentence(i){
    WB.render.sentences();
    let card = WB.dom.sentences.querySelector('.card[data-i="' + i + '"]');
    if(!card){
      outer:
      for(let si = 0; si < S().paper.sections.length; si++){
        const sec = S().paper.sections[si];
        for(let ii = 0; ii < sec.items.length; ii++){
          if(sec.items[ii].sentences.some(function(s){ return s.i === i; })){
            selectItem(si, ii);
            break outer;
          }
        }
      }
      card = WB.dom.sentences.querySelector('.card[data-i="' + i + '"]');
    }
    if(card){
      card.scrollIntoView({behavior:"smooth", block:"center"});
      WB.audio.playSentence(i);
    }
  }

  // 整篇/整卷播放跨到下一个题型单元：只换视图，不暂停、不清空播放区间。
  function followSwitch(si, ii){
    if(S().currentSi === si && S().currentIi === ii) return;
    const sec = S().paper.sections[si];
    const item = sec && sec.items[ii];
    if(!item) return;
    S().currentSi = si;
    S().currentIi = ii;
    WB.state.pos = {si:si, ii:ii};
    WB.store.saveState();
    document.querySelectorAll(".nav-item").forEach(function(b){
      b.classList.toggle("on",
        Number(b.dataset.si) === si && Number(b.dataset.ii) === ii);
    });
    WB.render.item();
    WB.render.sentenceBar();
    WB.noteAction("跟随播放切到：" + sec.name + " / " + item.title);
  }

  function exportItemRecord(){
    const sec = WB.paper.currentSection();
    const cur = WB.paper.currentItem();
    const id = WB.paper.currentItemId();
    const errors = WB.state.errors[id] || {};
    const notes = WB.state.notes[id] || {};
    const lines = [
      "错因清单 · " + S().paper.title,
      sec.name + " / " + cur.title,
      "生成时间：" + new Date().toLocaleString("zh-CN"),
      ""
    ];
    cur.sentences.forEach(function(s){
      const tags = errors[s.i] || [];
      const note = (notes[s.i] || "").trim();
      if(tags.length || note){
        lines.push("第 " + s.i + " 句" + (tags.length ? " [" + tags.join("、") + "]" : ""));
        lines.push("  " + s.en);
        lines.push("  时间：" + U.fmtPrecise(s.start));
        if(note) lines.push("  我的原因：" + note);
        lines.push("");
      }
    });
    if(lines.length <= 4) lines.push("本段还没有标记任何断点。");
    const blob = new Blob([lines.join("\n")], {type:"text/plain;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "错因清单-" + U.safeName(S().paper.title) + "-" +
      U.safeName(sec.name) + "-" + U.safeName(cur.title) + ".txt";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function toggleDoneActive(){
    if(S().activeSentence < 0) return;
    const card = WB.dom.sentences.querySelector('.card[data-i="' + S().activeSentence + '"]');
    const btn = card && card.querySelector('[data-act="done"]');
    if(btn) btn.click();
  }

  function toggleTagActive(n){
    if(S().activeSentence < 0) return;
    const card = WB.dom.sentences.querySelector('.card[data-i="' + S().activeSentence + '"]');
    const btn = card && card.querySelector('[data-err="' + WB.render.TAGS[n] + '"]');
    if(btn) btn.click();
  }

  function toggleLoopActive(){
    let i = S().activeSentence;
    if(i < 0){
      const card = document.querySelector(".card");
      if(!card) return;
      i = Number(card.dataset.i);
    }
    const cfg = WB.paper.loopCfgFor(i);
    const cur = WB.paper.setLoopCfg(i, {on:!cfg.on});
    const box = document.querySelector('[data-loop-on="' + i + '"]');
    if(box) box.checked = cur.on;
    const sel = document.querySelector('select[data-loop-times="' + i + '"]');
    if(sel) sel.disabled = cur.on;
    WB.audio.applyLoopCfg(i);
    WB.noteAction("第 " + i + " 句" + (cur.on ? "开启循环" : "关闭循环"));
    WB.cet6Sync.schedule();
    WB.status(cur.on
      ? "第 " + i + " 句已开启循环；再按 L 关闭。"
      : "第 " + i + " 句已关闭循环。");
  }

  function init(){
    if(bound) return;
    bound = true;

    WB.dom.nav.addEventListener("click", function(e){
      const secBtn = e.target.closest("button[data-sec-play]");
      if(secBtn){
        const si = Number(secBtn.dataset.secPlay);
        const sec = S().paper.sections[si];
        if(!sec) return;
        const r = WB.ranges.sectionRange(sec);
        WB.audio.playRange(r.start, r.end, null, {kind:"section", si:si});
        WB.status("正在播放整个 " + sec.name + "（界面会跟着当前句滚动）");
        WB.noteAction("整篇播放：" + sec.name);
        return;
      }
      const b = e.target.closest("button.nav-item");
      if(!b) return;
      selectItem(Number(b.dataset.si), Number(b.dataset.ii));
    });

    WB.dom.sentences.addEventListener("click", onCardClick);
    WB.dom.sentences.addEventListener("input", onCardInput);
    WB.dom.sentences.addEventListener("change", onCardChange);

    WB.dom.questions.addEventListener("click", function(e){
      const btn = e.target.closest("button[data-q]");
      if(!btn) return;
      const cur = WB.paper.currentItem();
      const q = cur.question_items.find(function(x){ return x.i === Number(btn.dataset.q); });
      if(!q) return;
      WB.audio.playRange(Math.max(0, q.start - 0.1), q.end + 0.1, null, {kind:"questions"});
    });

    WB.audio.onFollowItem = followSwitch;

    document.getElementById("playQuestions").addEventListener("click", WB.audio.playQuestions);
    document.getElementById("playItem").addEventListener("click", WB.audio.playItem);
    document.getElementById("exportBtn").addEventListener("click", exportItemRecord);

    if(WB.dom.followResume){
      WB.dom.followResume.addEventListener("click", function(){
        WB.audio.setFollowPaused(false);
      });
    }

    // 用户主动滚轮/触摸滚动时，先暂停跟随，避免把页面硬拽回去。
    window.addEventListener("wheel", function(){
      if(S().followActive && !S().followPaused) WB.audio.setFollowPaused(true);
    }, {passive:true});
    window.addEventListener("touchmove", function(){
      if(S().followActive && !S().followPaused) WB.audio.setFollowPaused(true);
    }, {passive:true});

    document.querySelectorAll("[data-rate]").forEach(function(b){
      b.addEventListener("click", function(){
        WB.audio.setRate(Number(b.dataset.rate) || 1);
      });
    });
  }

  WB.actions = {
    init: init,
    selectItem: selectItem,
    jumpToSentence: jumpToSentence,
    followSwitch: followSwitch,
    toggleDoneActive: toggleDoneActive,
    toggleTagActive: toggleTagActive,
    toggleLoopActive: toggleLoopActive
  };
})(window.WB = window.WB || {});

</script>
<script>
// ---- 55-api.js ----
// @requires: 00-core.js
// 网络层：HTTP 模式下唯一的后台出口。令牌从 /api/health 取，SSE 自己解析。
// file:// 模式 ready=false，需要后台的功能显示「请从学习工作台打开」。
(function(WB){
  "use strict";

  const HTTP = location.protocol === "http:" || location.protocol === "https:";
  let token = "";

  const api = {
    ready: false,
    HTTP: HTTP,
    init: init,
    get: get,
    post: post,
    patch: patch,
    del: del,
    download: download,
    stream: stream,
    errorText: errorText
  };

  async function init(){
    if(!HTTP){
      api.ready = false;
      return false;
    }
    try{
      const res = await fetch("/api/health", {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      token = String((data && data.token) || "");
      api.ready = !!token;
    }catch(e){
      token = "";
      api.ready = false;
    }
    return api.ready;
  }

  function headers(){
    const h = {"Content-Type":"application/json"};
    if(token) h["X-Learnsys-Token"] = token;
    return h;
  }

  function ensure(){
    if(!api.ready) throw new Error("请从学习工作台打开（HTTP /cet6/）后再用这个功能。");
  }

  async function parseError(res){
    let detail = "";
    try{
      const text = await res.text();
      if(text){
        try{
          const data = JSON.parse(text);
          detail = String(data.detail || data.error || "");
        }catch(e){ detail = text.slice(0, 200); }
      }
    }catch(e){}
    const err = new Error(detail || ("HTTP " + res.status));
    err.status = res.status;
    return err;
  }

  async function get(path){
    ensure();
    const res = await fetch(path, {cache:"no-store", headers:headers()});
    if(!res.ok) throw await parseError(res);
    return res.json();
  }

  async function post(path, body){
    ensure();
    const res = await fetch(path, {
      method:"POST", headers:headers(),
      body:JSON.stringify(body || {})
    });
    if(!res.ok) throw await parseError(res);
    return res.json();
  }

  async function patch(path, body){
    ensure();
    const res = await fetch(path, {
      method:"PATCH", headers:headers(),
      body:JSON.stringify(body || {})
    });
    if(!res.ok) throw await parseError(res);
    return res.json();
  }

  async function del(path){
    ensure();
    const res = await fetch(path, {method:"DELETE", headers:headers()});
    if(!res.ok) throw await parseError(res);
    return res.json();
  }

  async function download(path, filename){
    ensure();
    const res = await fetch(path, {cache:"no-store", headers:headers()});
    if(!res.ok) throw await parseError(res);
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename || "下载.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // 逐行解析 SSE：只认 data: 行，空行分隔事件。
  async function stream(path, body, onEvent, signal){
    ensure();

<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>听力精听工作台</title>
<style>
/* ---- base.css ---- */
/* 基础层：设计变量、页面骨架、头部、侧栏、工具栏、通用按钮与进度。 */
:root{
  --paper:#f7f4ee;
  --card:#fffdf8;
  --ink:#1f2a2e;
  --muted:#6b7778;
  --line:#e3ddd2;
  --accent:#0f766e;
  --accent-soft:#dff3ef;
  --warn:#b45309;
  --warn-soft:#fdf0dc;
  --danger:#9f1239;
  --danger-soft:#fde8ee;
  --radius:14px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at 12% 0%, #e9f4f1 0, transparent 38%),
    radial-gradient(circle at 92% 8%, #f6ead8 0, transparent 34%),
    var(--paper);
  color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  line-height:1.65;
}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 70px}

/* 头部：标题 / 试卷选择 / 播放器，三层，避免一排挤满 */
header{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px 20px 14px;box-shadow:0 1px 0 rgba(0,0,0,.02);
}
.topbar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.topbar-title{min-width:0}
.eyebrow{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.16em;
  color:var(--accent);margin-bottom:2px;
}
header h1{font-size:22px;line-height:1.35;margin:0;letter-spacing:.01em;overflow-wrap:anywhere}
.topbar-sub{font-size:12.5px;color:var(--muted);margin:3px 0 0}
.topbar-recent{
  flex:none;font:inherit;font-size:13px;color:var(--ink);background:#fffefb;
  border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;
}
.topbar-recent:hover{border-color:var(--accent);color:var(--accent)}
.topbar-recent.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.paper-picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0;font-size:13px;color:var(--muted)}
.picker-label{flex:none;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.paper-picker select{flex:1;min-width:220px;font:inherit;font-size:14px;color:var(--ink);background:#fffefb;border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.paper-picker select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.paper-picker input[type=search]{flex:none;width:150px;font:inherit;font-size:13px;color:var(--ink);background:#fbf8f1;border:1px solid #ece6da;border-radius:9px;padding:6px 10px}
.paper-picker input[type=search]::placeholder{color:#9aa3a3}
.paper-picker input[type=search]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.index-time{font-size:11px;color:var(--muted);opacity:.75;white-space:nowrap;margin-left:auto}
.recent-panel{margin:8px 0 0;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fffefb;max-width:680px}
.recent-panel .recent-empty{font-size:13px;color:var(--muted);padding:6px 8px;margin:0}
.recent-item{display:flex;justify-content:space-between;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;cursor:pointer;font:inherit;color:var(--ink)}
.recent-item:hover{background:var(--accent-soft)}
.recent-item .t{font-size:13px;line-height:1.5}
.recent-item .m{font-size:12px;color:var(--muted);white-space:nowrap}
.speed-group{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fffefb}
.speed-group button{border:0;border-radius:0;padding:5px 8px;background:transparent;font-size:12px}
.speed-group button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.launch-msg{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--danger-soft);border:1px solid #f3b6c6;color:var(--danger);font-size:13px;white-space:pre-wrap}
.mode-banner{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-soft);border:1px solid #f0d3a6;color:#7c4a03;font-size:13px;font-weight:600}
/* 播放条钉在窗口底部：听整段时页面往下翻，暂停永远在手边，不用滚回顶上 */
.player-bar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:14px;
  width:min(1180px,calc(100vw - 40px));z-index:45;
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;
  align-items:center;margin:0;padding:10px 14px;
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.14);
}
.player-bar audio{display:none}
.player-main{display:flex;align-items:center;gap:10px;min-width:0}
.player-btn{
  flex:none;width:38px;height:38px;border-radius:50%;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;color:#fff;background:var(--accent);border-color:var(--accent);
}
.player-btn:hover{background:#0b5f59;border-color:#0b5f59}
.player-time{
  flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
  min-width:42px;text-align:center;
}
.player-seek{flex:1;min-width:80px;accent-color:var(--accent);height:5px;cursor:pointer}
.player-rate{
  flex:none;font-size:11px;color:var(--accent);background:var(--accent-soft);
  border:1px solid #9fd4cc;border-radius:999px;padding:1px 7px;min-width:36px;text-align:center;
}
.player-bar .status{margin:0;font-size:12px;color:var(--muted);text-align:right;max-width:280px}
body{padding-bottom:24px}
.meta{color:var(--muted);font-size:13px;margin:0 0 10px}
audio{width:100%;margin:8px 0 4px}
.status{font-size:13px;color:var(--muted);margin:4px 0 0}

@media (max-width:760px){
  .paper-picker select{flex-basis:100%;order:2}
  .paper-picker input[type=search]{flex:1;order:3;width:auto}
  .picker-label{order:1}
  .index-time{order:4;margin-left:0}
  .player-bar{grid-template-columns:1fr;width:calc(100vw - 24px);bottom:8px}
  .player-bar .status{text-align:left;max-width:none}
}

/* 主布局与侧栏 */
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start;margin-top:16px}
.sidebar{
  position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 12px;
}
.side-title{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 4px 8px}
.nav-section{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  font-size:12px;font-weight:700;color:#5b5142;margin:14px 4px 4px;
  padding-top:10px;border-top:1px dashed var(--line);
}
.nav-section:first-of-type{border-top:0;padding-top:0;margin-top:0}
.sec-play{
  font:inherit;font-size:11px;font-weight:400;color:var(--accent);
  background:#fffefb;border:1px solid var(--line);border-radius:999px;
  padding:2px 8px;cursor:pointer;white-space:nowrap;
}
.sec-play:hover{border-color:var(--accent);background:var(--accent-soft)}
.nav-item{
  display:block;width:100%;text-align:left;font:inherit;font-size:13px;
  border:1px solid transparent;background:transparent;color:var(--ink);
  border-radius:9px;padding:6px 9px;cursor:pointer;margin:2px 0;
}
.nav-item:hover{background:#f5f1e8}
.nav-item.on{background:var(--accent-soft);border-color:#9fd4cc;color:#0b5f59;font-weight:600}
main{min-width:0}
#itemHeader h2{font-size:20px;margin:0 0 4px}
#itemHeader .meta{margin:0}

/* 工具栏与当前句栏 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 8px}
.tool-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:11px;background:#fffefb}
.tool-label{font-size:11px;font-weight:600;color:var(--muted);margin-right:2px;letter-spacing:.04em}
.tool-group button{font-size:12px;padding:4px 9px}
.sentence-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:6px;z-index:6;margin:10px 0;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fffefb;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.sentence-bar .sb-text{font-size:13px;font-weight:600;color:var(--accent);min-width:220px}
.sentence-bar button{font-size:12px;padding:4px 9px}
.sb-hint{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.sb-sep{width:1px;height:20px;background:var(--line);margin:0 2px}

/* 通用按钮 */
button{
  font:inherit;font-size:13px;border:1px solid var(--line);background:#fffefb;
  color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;
  transition:background .15s,border-color .15s,transform .05s;
}
button:hover{background:#f5f1e8;border-color:#cfc6b6}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{background:var(--accent-soft);border-color:#9fd4cc;color:#0b5f59}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#0b5f59}
button.primary:disabled{opacity:.6;cursor:wait}
button.done{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}

/* 进度与提示 */
.progress-label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
.progress{height:8px;background:#eae4d8;border-radius:999px;overflow:hidden;margin:6px 0 12px}
.progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0f766e,#2dd4bf);transition:width .25s}
.warnings{
  background:var(--warn-soft);border:1px solid #f0d3a6;color:#7c4a03;
  border-radius:12px;padding:10px 14px;margin:8px 0 12px;font-size:13px;
}
.warnings ul{margin:4px 0 0;padding-left:18px}
.hidden{display:none !important}

@media (max-width:820px){
  .wrap{padding:16px 12px 60px}
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;max-height:none}
}


/* ---- cards.css ---- */
/* 句子卡片：卡片骨架、mini 播放器、循环、A-B、笔记、断点、原文。 */
.card{
  background:var(--card);border:1px solid var(--line);border-left:5px solid #c9c2b4;
  border-radius:var(--radius);padding:13px 15px;margin:10px 0;
}
.card.playing{border-left-color:var(--accent);box-shadow:0 0 0 2px #dff3ef}
.card.done{background:#f3f8f4;border-color:#cfe3d3}
.card.active{outline:2px solid var(--accent);outline-offset:2px}
.card.follow{
  border-left-color:var(--accent);
  background:linear-gradient(90deg,var(--accent-soft),var(--card) 42%);
  box-shadow:0 0 0 2px #dff3ef,0 6px 18px rgba(15,118,110,.10);
}
.card.hit{animation:hitflash 2s ease-out}
@keyframes hitflash{0%{background:var(--accent-soft)}100%{background:transparent}}
.card-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.time{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.badge{font-size:12px;color:var(--muted);margin-left:auto}
.review{
  font-size:11px;background:var(--warn-soft);color:var(--warn);
  border:1px solid #f0d3a6;border-radius:999px;padding:1px 8px;
}
.time.manual{color:var(--warn)}
.note{
  width:100%;min-height:44px;margin:7px 0 2px;padding:7px 9px;
  border:1px solid var(--line);border-radius:9px;background:#fffefb;
  font:inherit;font-size:13px;color:var(--ink);resize:vertical;
}
.note:focus{outline:2px solid #9fd4cc;border-color:#9fd4cc}
.mini{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
.mini-btn{
  width:30px;height:30px;padding:0;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1;
}
.mini-btn.on{background:var(--accent-soft);border-color:#9fd4cc;color:#0b5f59}
.mini-range{flex:1;min-width:80px;accent-color:var(--accent);height:4px;cursor:pointer}
.mini-time{
  font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
  min-width:76px;text-align:right;
}

/* 每句循环与连播 */
.card-loop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin:4px 0 2px}
.card-loop label{display:flex;gap:4px;align-items:center;cursor:pointer}
.card-loop select{font:inherit;font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:8px;background:#fffefb;color:var(--ink)}
.loop-stat{margin-left:auto;color:var(--warn);font-variant-numeric:tabular-nums}
.loop-stat:empty{display:none}

/* 每句 A-B 区间 */
.card-ab{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin:2px 0}
.card-ab button{font-size:12px;padding:2px 9px}
.ab-badge{margin-left:auto;font-size:11px;color:var(--accent);white-space:nowrap}
.ab-badge:empty{display:none}
.ab-badge.invalid{color:var(--warn)}

/* 原文、操作、断点、空态 */
.en{font-size:16px;line-height:1.75;margin:9px 0}
.en.hidden{display:none}
/* 逐句译文：灰色小字，跟随原文显示/隐藏 */
.zh{
  font-size:13px;line-height:1.7;color:var(--muted);background:#f6f2e9;
  border-left:3px solid #d8cdb8;border-radius:6px;padding:5px 9px;margin:-3px 0 9px;
}
.zh.hidden{display:none}
.zh:empty{display:none}
.controls{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
.errors{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
.errors button{font-size:12px;padding:3px 9px}
.errors button.on{background:var(--danger-soft);border-color:#f3b6c6;color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:26px 0;display:none}


/* ---- panels.css ---- */
/* 面板层：搜索、AI 分析、统计、生词本、题目、页脚与划词浮钮。 */
.side-search{width:100%;box-sizing:border-box;font:inherit;font-size:13px;color:var(--ink);background:#fffefb;border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin:0 0 8px}
.side-search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.search-results{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fffefb;margin:0 0 8px}
.search-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 9px;cursor:pointer;font:inherit;color:var(--ink)}
.search-item:last-child{border-bottom:0}
.search-item:hover{background:var(--accent-soft)}
.search-item .m{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.search-item .t{font-size:12px;line-height:1.4}
.search-empty{font-size:12px;color:var(--muted);padding:8px 9px;margin:0}
.sel-vocab{position:fixed;z-index:50;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--accent);background:#fffefb;color:var(--accent);cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)}

.analysis{border-left:5px solid var(--accent)}
.analysis-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.head-actions{display:flex;gap:6px;flex-wrap:wrap}
.stats table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0 12px}
.stats th,.stats td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.stats th{color:var(--muted);font-weight:600}
.stats td.n{text-align:right;font-variant-numeric:tabular-nums}
.vocab-row{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line);padding:8px 0}
.vocab-row .w{font-weight:700;min-width:90px}
.vocab-row input{flex:1;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:4px 7px;background:#fffefb;color:var(--ink)}
.vocab-row .ctx{font-size:12px;color:var(--muted);flex:2}
.vocab-row button{font-size:12px;padding:3px 8px}
.analysis h3{font-size:15px;margin:12px 0 6px}
.analysis p{margin:6px 0}
.pattern{border-top:1px dashed var(--line);padding:8px 0}
.pattern:first-of-type{border-top:0}
.pattern b{color:#0b5f59}
.priority{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.priority button{font-size:12px;padding:3px 9px}
.plan{margin:6px 0 0;padding-left:20px}
.plan li{margin:4px 0}

.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 16px;margin:14px 0;
}
.panel summary{cursor:pointer;font-weight:600;color:var(--accent)}
.q-row{border-top:1px dashed var(--line);padding:10px 0}
.q-row:first-of-type{border-top:0}
.q-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.q-row p{margin:6px 0 0;font-size:14px;line-height:1.7}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}

/* ---- P12：分析状态机 / 直接问 / 划词翻译 ---- */
.analysis-hint{
  margin:6px 0;font:inherit;font-size:12px;color:var(--accent);
  background:var(--accent-soft);border:1px solid #9fd4cc;
  border-radius:999px;padding:4px 12px;cursor:pointer;
}
.analysis-hint:hover{background:#cdeee8}
.analysis-status p{margin:4px 0;color:var(--muted)}
.analysis-actions{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.analysis-actions button{font-size:12px;padding:3px 10px}

.ask-panel{border-left:5px solid #5b46b8}
.ask-body{
  max-height:380px;overflow:auto;padding:6px 8px;
  background:#fffefb;border:1px solid var(--line);border-radius:10px;margin:8px 0;
}
.ask-msg{display:flex;margin:8px 0}
.ask-msg.user{justify-content:flex-end}
.ask-bubble{
  max-width:88%;font-size:14px;line-height:1.65;padding:8px 11px;
  border-radius:12px;background:#f2eee4;color:var(--ink);
  word-break:break-word;overflow-wrap:anywhere;
}
.ask-msg.user .ask-bubble{background:var(--accent);color:#fff}
.ask-msg.assistant .ask-bubble{background:#fffdf8;border:1px solid var(--line)}
.ask-msg.error .ask-bubble{background:var(--danger-soft);color:var(--danger);border:1px solid #f3b6c6}
.ask-bubble code{background:#efe9dc;border-radius:4px;padding:0 3px;font-size:13px}
.ask-meta{font-size:11px;color:var(--muted);margin:0 0 4px}
.ask-thinking{font-size:12px;color:var(--muted);margin-bottom:6px}
.ask-thinking summary{cursor:pointer;color:var(--accent)}
.ask-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;font-size:11px;color:var(--accent)}
.ask-tools span{background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.ask-input-row{display:flex;gap:8px;align-items:flex-end}
.ask-input-row textarea{
  flex:1;font:inherit;font-size:14px;line-height:1.5;padding:8px 10px;
  border:1px solid var(--line);border-radius:10px;background:#fffefb;
  color:var(--ink);resize:vertical;min-height:48px;
}
.ask-input-row textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

.translation-pop{
  position:fixed;z-index:60;width:320px;background:#fffdf8;
  border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.16);padding:10px 12px;
  font-size:13px;line-height:1.55;color:var(--ink);
}
.trans-word{font-size:16px;font-weight:700;color:var(--accent)}
.trans-phonetic{font-size:12px;color:var(--muted);margin:1px 0 4px}
.trans-result{font-size:15px;font-weight:600;margin:4px 0}
.trans-meaning{color:var(--muted);margin:4px 0}
.trans-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.trans-actions button{font-size:12px;padding:3px 10px}
.sel-translate{color:#5b46b8;border-color:#5b46b8}

(function(WB){

      if(d < 86400000) return Math.floor(d / 3600000) + " 小时前";

    const res = await fetch(path, {
      method:"POST", headers:headers(),
      body:JSON.stringify(body || {}), signal:signal
    });
    if(!res.ok) throw await parseError(res);
    if(!res.body || !res.body.getReader){
      throw new Error("当前浏览器不支持流式响应。");
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    const handle = function(chunk){
      chunk.split(/\r?\n/).forEach(function(line){
        if(line.indexOf("data:") !== 0) return;
        const raw = line.slice(5).trim();
        if(!raw) return;
        try{ onEvent(JSON.parse(raw)); }catch(e){}
      });
    };
    while(true){
      const step = await reader.read();
      if(step.done) break;
      buffer += decoder.decode(step.value, {stream:true});
      let at;
      while((at = buffer.indexOf("\n\n")) >= 0){
        handle(buffer.slice(0, at));
        buffer = buffer.slice(at + 2);
      }
    }
    if(buffer.trim()) handle(buffer);
  }

  function errorText(err){
    if(!err) return "未知错误";
    if(err.name === "AbortError") return "已停止";
    if(err.status === 403) return "后台令牌失效，请刷新页面。";
    if(err.status === 413) return "上下文太大，先少选一点内容。";
    if(err.status === 404) return "后台没有这条记录。";
    return err.message || "请求失败";
  }

  WB.api = api;
})(window.WB = window.WB || {});

</script>
<script>
// ---- 56-dualwrite.js ----
// @requires: 00-core.js, 04-mode.js
// 双写审计的纯函数：服务端行 → 本地状态、整卷快照、结构指纹、空快照判断。
// 不碰网络、不碰 DOM，node --test 可直接加载。
(function(WB){
  "use strict";

  function normText(text){
    return String(text || "").toLowerCase()
      .replace(/\s+/g, "")
      .replace(/[·:：,，.。;；!！?？'"“”‘’()（）\[\]【】]/g, "");
  }

  function sectionLetter(name){
    const m = String(name || "").match(/Section\s*([A-Za-z])/i);
    return m ? m[1].toUpperCase() : "";
  }

  function tailNumber(text){
    const m = String(text || "").match(/(\d+)\s*$/);
    return m ? Number(m[1]) : null;
  }

  function pickSection(sections, name){
    const list = sections || [];
    const exact = list.filter(function(sec){ return sec.name === name; });
    if(exact.length === 1) return exact[0];
    if(exact.length > 1) return null;
    const letter = sectionLetter(name);
    if(!letter) return null;
    const byLetter = list.filter(function(sec){ return sec.letter === letter; });
    return byLetter.length === 1 ? byLetter[0] : null;
  }

  function pickItem(section, title){
    const items = (section && section.items) || [];
    const exact = items.filter(function(it){ return it.title === title; });
    if(exact.length === 1) return exact[0];
    if(exact.length > 1) return null;
    const num = tailNumber(title);
    if(num != null){
      const byNum = items.filter(function(it){ return Number(it.index) === num; });
      if(byNum.length === 1) return byNum[0];
    }
    const norm = normText(title);
    const byNorm = items.filter(function(it){ return normText(it.title) === norm; });
    return byNorm.length === 1 ? byNorm[0] : null;
  }

  function emptyMaps(){
    return {done:{}, errors:{}, notes:{}, loopStats:{}};
  }

  function put(map, id, sentence, value){
    if(!map[id]) map[id] = {};
    map[id][sentence] = value;
  }

  // 服务端整卷行 → 本地 state 形状；歧义/结构对不上一律不猜。
  // 返回的 skipped 会随 /api/cet6/sync-paper 回传，服务端据此保留旧行。
  function mapServerState(paper, serverItems){
    const state = emptyMaps();
    const skipped = [];
    let meaningful = 0, matched = 0, partial = 0, unmatched = 0;
    const sections = (paper && paper.sections) || [];

    (serverItems || []).forEach(function(group){
      const sec = pickSection(sections, group && group.section);
      const item = sec ? pickItem(sec, group && group.item) : null;
      if(!sec || !item){
        unmatched += 1;
        skipped.push({section: String((group && group.section) || ""),
                      item: String((group && group.item) || ""),
                      reason: "结构未匹配"});
        return;
      }
      const id = sec.letter + "-" + item.index;
      const valid = {};
      (item.sentences || []).forEach(function(sent){ valid[sent.i] = true; });
      let bad = false;
      (group.sentences || []).forEach(function(row){
        if(!valid[row.sentence]){ bad = true; return; }
        if(row.done) put(state.done, id, row.sentence, true);
        if(row.tags && row.tags.length){
          put(state.errors, id, row.sentence, row.tags.slice());
        }
        if(row.note) put(state.notes, id, row.sentence, String(row.note));
        const loops = Number(row.loops) || 0;
        const plays = Number(row.plays) || 0;
        if(loops || plays) put(state.loopStats, id, row.sentence, {loops:loops, plays:plays});
        if(row.done || (row.tags && row.tags.length) || row.note || loops) meaningful += 1;
      });
      if(bad){
        partial += 1;
        skipped.push({section: group.section, item: group.item, reason: "句子结构不一致"});
      }else{
        matched += 1;
      }
    });
    return {state:state, skipped:skipped, meaningful:meaningful,
            matched:matched, partial:partial, unmatched:unmatched};
  }

  function mergeMaps(dst, src, mode){
    Object.keys(src || {}).forEach(function(id){
      const source = src[id] || {};
      const target = dst[id] || (dst[id] = {});
      Object.keys(source).forEach(function(key){
        if(mode === "union"){
          if(mode === "union" && Array.isArray(source[key])){
            const arr = target[key] || [];
            source[key].forEach(function(v){ if(arr.indexOf(v) < 0) arr.push(v); });
            if(arr.length) target[key] = arr;
          }else if(target[key] == null || source[key] === true){
            target[key] = source[key];
          }
        }else if(mode === "missing"){
          if(target[key] == null) target[key] = source[key];
        }else{
          target[key] = source[key];
        }
      });
    });
  }

  // 把服务端状态并进本地 state。
  // serverFirst=false：本地优先，只补缺口（双写阶段）。
  // serverFirst=true ：服务端优先（退休后），但 done/errors 仍取并集，防止误删。
  function mergeIntoState(state, mapped, serverFirst){
    if(!state || !mapped || !mapped.state) return false;
    state.done = state.done || {};
    state.errors = state.errors || {};
    state.notes = state.notes || {};
    state.loopStats = state.loopStats || {};
    const before = JSON.stringify({done:state.done, errors:state.errors,
                                   notes:state.notes, loopStats:state.loopStats});
    mergeMaps(state.done, mapped.state.done, "union");
    mergeMaps(state.errors, mapped.state.errors, "union");
    mergeMaps(state.notes, mapped.state.notes, serverFirst ? "override" : "missing");
    const statsDst = state.loopStats;
    Object.keys(mapped.state.loopStats || {}).forEach(function(id){
      const src = mapped.state.loopStats[id] || {};
      const dst = statsDst[id] || (statsDst[id] = {});
      Object.keys(src).forEach(function(sentence){
        const a = dst[sentence] || {};
        const b = src[sentence] || {};
        dst[sentence] = {loops:Math.max(Number(a.loops) || 0, Number(b.loops) || 0),
                         plays:Math.max(Number(a.plays) || 0, Number(b.plays) || 0)};
      });
    });
    const after = JSON.stringify({done:state.done, errors:state.errors,
                                  notes:state.notes, loopStats:state.loopStats});
    return before !== after;
  }

  function canonicalRows(paper, state, skipped){
    const skip = {};
    (skipped || []).forEach(function(item){
      skip[String(item.section) + "\u0000" + String(item.item)] = true;
    });
    const items = [];
    const sections = (paper && paper.sections) || [];
    sections.forEach(function(sec){
      (sec.items || []).forEach(function(item){
        if(skip[String(sec.name) + "\u0000" + String(item.title)]) return;
        const id = sec.letter + "-" + item.index;
        const doneMap = (state && state.done && state.done[id]) || {};
        const errors = (state && state.errors && state.errors[id]) || {};
        const notes = (state && state.notes && state.notes[id]) || {};
        const stats = (state && state.loopStats && state.loopStats[id]) || {};
        const done = [];
        const sentences = (item.sentences || []).map(function(sent){
          if(doneMap[sent.i]) done.push(sent.i);
          const st = stats[sent.i] || {};
          return {
            sentence: sent.i,
            en: sent.en || "",
            tags: (errors[sent.i] || []).slice(),
            note: notes[sent.i] || "",
            loops: Number(st.loops) || 0,
            plays: Number(st.plays) || 0
          };
        });
        items.push({section: sec.name, item: item.title,
                    sentences: sentences, done: done});
      });
    });
    return {items: items};
  }

  function anyMap(map){
    return Object.keys(map || {}).some(function(id){
      const inner = map[id];
      return inner && typeof inner === "object" && Object.keys(inner).length > 0;
    });
  }

  function anyLoop(stats){
    return Object.keys(stats || {}).some(function(id){
      const inner = stats[id] || {};
      return Object.keys(inner).some(function(sentence){
        const st = inner[sentence] || {};
        return (Number(st.loops) || 0) > 0 || (Number(st.plays) || 0) > 0;
      });
    });
  }

  // 只看 4 个同步字段；starts / ab / pos / 翻译缓存不算「有进度」。
  function snapshotIsEmpty(state){
    if(!state) return true;
    return !(anyMap(state.done) || anyMap(state.errors) ||
             anyMap(state.notes) || anyLoop(state.loopStats));
  }

  function paperSig(paper){
    const text = ((paper && paper.sections) || []).map(function(sec){
      return String(sec.letter) + "|" + String(sec.name) + "|" +
        (sec.items || []).map(function(item){
          return String(item.index) + "|" + String(item.title) + "|" +
            (item.sentences || []).map(function(s){ return s.i; }).join(",");
        }).join(";");
    }).join("||");
    let h = 2166136261;
    for(let i = 0; i < text.length; i++){
      h ^= text.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return text.length + ":" + h.toString(16);
  }

  function clientDay(){
    const d = new Date();
    const pad = function(n){ return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  WB.dualwrite = {
    normText: normText,
    sectionLetter: sectionLetter,
    tailNumber: tailNumber,
    pickSection: pickSection,
    pickItem: pickItem,
    mapServerState: mapServerState,
    mergeIntoState: mergeIntoState,
    canonicalRows: canonicalRows,
    snapshotIsEmpty: snapshotIsEmpty,
    paperSig: paperSig,
    clientDay: clientDay
  };
})(window.WB = window.WB || {});

</script>
<script>
// ---- 58-sync.js ----
// @requires: 00-core.js, 04-mode.js, 10-storage.js, 20-paper.js, 55-api.js, 56-dualwrite.js
// 同步层：增量编辑走 /api/cet6/sync；打开试卷时做一次整卷审计
// （写前比对 → 写入 → 写后校验），结果进 cet6_dualwrite_runs。
(function(WB){
  "use strict";

  const LEGACY_SERVER = "http://127.0.0.1:8765";
  let timer = null;
  let failedPushes = 0;

  function paperId(){
    return WB.session.paperDir ||
      (WB.session.paper && WB.session.paper.title) || "";
  }

  function buildFor(sec, cur, analysis){
    const id = WB.paper.itemId(sec, cur);
    const errors = WB.state.errors[id] || {};
    const notes = WB.state.notes[id] || {};
    const stats = WB.state.loopStats[id] || {};
    const doneMap = WB.state.done[id] || {};
    const done = [];
    const sentences = cur.sentences.map(function(s){
      if(doneMap[s.i]) done.push(s.i);
      const st = stats[s.i] || {};
      return {
        sentence: s.i,
        en: s.en,
        tags: errors[s.i] || [],
        note: notes[s.i] || "",
        loops: Number(st.loops) || 0,
        plays: Number(st.plays) || 0
      };
    });
    return {
      paper: WB.session.paper.title,
      paper_id: WB.session.paperDir || WB.session.paper.title,
      section: sec.name,
      item: cur.title,
      sentences: sentences,
      done: done,
      analysis: analysis || null
    };
  }

  function build(analysis){
    return buildFor(WB.paper.currentSection(), WB.paper.currentItem(), analysis);
  }

  async function send(payload){
    try{
      if(WB.api && WB.api.ready){
        await WB.api.post("/api/cet6/sync", payload);
        return true;
      }
      if(location.protocol === "file:"){
        const res = await fetch(LEGACY_SERVER + "/api/cet6/sync", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload)
        });
        return res.ok;
      }
    }catch(e){
      // 后台没开 / 端口变了：工作台照常用，下次改动会再试
    }
    failedPushes += 1;
    return false;
  }

  async function push(analysis){
    if(!WB.state || !WB.session.paper) return false;
    if(WB.cet6Mode && WB.cet6Mode.readOnly) return false;
    return send(build(analysis));
  }

  function renderAll(){
    try{
      if(WB.render && WB.render.sentences) WB.render.sentences();
      if(WB.render && WB.render.progress) WB.render.progress();
      if(WB.render && WB.render.nav) WB.render.nav();
    }catch(e){}
  }

  async function fetchServerState(){
    const data = await WB.api.get(
      "/api/cet6/state?paper_id=" + encodeURIComponent(paperId()));
    return WB.dualwrite.mapServerState(WB.session.paper, (data && data.items) || []);
  }

  // 服务端 → 本地：服务端优先（退休后），done/errors 仍取并集。
  async function hydrateServer(){
    const mapped = await fetchServerState();
    const changed = WB.dualwrite.mergeIntoState(WB.state, mapped, true);
    if(changed){
      WB.store.saveState();
      renderAll();
    }
    return mapped;
  }

  // 审计成功后，只补本地缺口（不覆盖用户现有值），避免服务端多出的行丢掉。
  async function adoptMissing(){
    try{
      const mapped = await fetchServerState();
      if(WB.dualwrite.mergeIntoState(WB.state, mapped, false)){
        WB.store.saveState();
        renderAll();
      }
    }catch(e){}
  }

  function payloadFor(items, hydration, skipped){
    return {
      paper: WB.session.paper.title,
      paper_id: paperId(),
      items: items,
      hydration: hydration,
      mode: (WB.cet6Mode && WB.cet6Mode.HTTP) ? "http" : "file",
      paper_sig: WB.dualwrite.paperSig(WB.session.paper),
      client_ts: new Date().toISOString(),
      client_day: WB.dualwrite.clientDay(),
      push_failed: failedPushes,
      skipped_items: skipped || []
    };
  }

  // 打开试卷时的一次整卷审计。force=true 可重跑（例如 409 恢复后）。
  let syncedPaper = "";
  async function syncPaper(force){
    if(!WB.state || !WB.session.paper) return false;
    if(!WB.api || !WB.api.ready) return false;
    if(WB.cet6Mode && WB.cet6Mode.readOnly) return false;
    if(!force && syncedPaper === paperId()) return false;
    syncedPaper = paperId();
    if(WB.cet6Mode) WB.cet6Mode.hydrating = true;
    try{
      // 第一次用打开时的本地快照，先留证据：不先合并服务端，否则差异会被掩盖。
      const built = WB.dualwrite.canonicalRows(WB.session.paper, WB.state, []);
      try{
        const res = await WB.api.post(
          "/api/cet6/sync-paper", payloadFor(built.items, "local", []));
        failedPushes = 0;
        await adoptMissing();
        return !!res;
      }catch(err){
        if(!err || err.status !== 409) throw err;
        // 本地为空 / 服务端有进度：先从服务端恢复，再带 hydration=state 重试一次。
        const mapped = await hydrateServer();
        const built2 = WB.dualwrite.canonicalRows(
          WB.session.paper, WB.state, mapped.skipped);
        const res2 = await WB.api.post(
          "/api/cet6/sync-paper", payloadFor(built2.items, "state", mapped.skipped));
        failedPushes = 0;
        return !!res2;
      }
    }catch(e){
      // 审计失败不拦使用；下次打开会重试。
      return false;
    }finally{
      if(WB.cet6Mode) WB.cet6Mode.hydrating = false;
    }
  }

  // 防抖期间可能切换段落：按「段落 + 条」记住改过的单元。
  // 以前到点只推「当前」那一条，切走后前一条的播放次数要等下次整卷审计才补上，
  // 10-23 的 plays 差异（本地 8 / 服务端 4）最可能就是这样漏掉的。
  const pending = new Map();

  function pendingKey(sec, cur){
    return JSON.stringify([sec && sec.name || "", cur && cur.title || ""]);
  }

  function remember(){
    try{
      if(!WB.paper) return;
      const sec = WB.paper.currentSection();
      const cur = WB.paper.currentItem();
      if(sec && cur) pending.set(pendingKey(sec, cur), {sec: sec, cur: cur});
    }catch(e){}
  }

  function schedule(){
    if(WB.cet6Mode && WB.cet6Mode.readOnly) return;
    remember();
    if(timer) clearTimeout(timer);
    timer = setTimeout(flush, 1200);
  }

  // 关窗/切后台时把防抖中的最后一笔推掉，避免下次打开审计出现缺口。
  async function flush(){
    if(timer){ clearTimeout(timer); timer = null; }
    if(!pending.size) return;
    const batch = Array.from(pending.values());
    pending.clear();
    for(const entry of batch){
      await send(buildFor(entry.sec, entry.cur, null));
    }
  }
  window.addEventListener("pagehide", flush);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") flush();
  });

  WB.cet6Sync = {build: build, buildFor: buildFor, push: push, schedule: schedule,
                 syncPaper: syncPaper, flush: flush};
})(window.WB = window.WB || {});

</script>
<script>
// ---- 60-insights.js ----
// @requires: 00-core.js, 10-storage.js, 20-paper.js, 30-audio.js, 40-render.js, 50-actions.js, 55-api.js, 58-sync.js
// 功能层：分析任务状态机、自由提问的上下文、学习统计。
// 收起分析只隐藏面板，结果留在 state.analysis；刷新后从后台恢复最近一条。
(function(WB){
  "use strict";

  const U = WB.util;
  const HTTP = location.protocol === "http:" || location.protocol === "https:";
  const LEGACY_ANALYZE = "http://127.0.0.1:8765/analyze";
  const PAPER_KEY = "__paper__";

  let bound = false;
  let seq = 0;
  let pollTimer = null;
  let statusTimer = null;
  let busy = false;

  function S(){ return WB.session; }
  function currentKey(){ return WB.paper.currentItemId(); }
  function isPaperKey(key){ return key === PAPER_KEY; }
  function hasAnalysis(key){ return !!(WB.state.analysis[key]); }

  function paperInfo(){
    return {
      paper: WB.session.paper.title,
      paper_id: WB.session.paperDir || WB.session.paper.title
    };
  }

  function collectRecord(){
    const sec = WB.paper.currentSection();
    const cur = WB.paper.currentItem();
    const id = WB.paper.currentItemId();
    const errors = WB.state.errors[id] || {};
    const notes = WB.state.notes[id] || {};
    const stats = WB.state.loopStats[id] || {};
    const rows = [];
    cur.sentences.forEach(function(s){
      const tags = errors[s.i] || [];
      const note = (notes[s.i] || "").trim();
      const st = stats[s.i] || {};
      const loops = Number(st.loops) || 0;
      const plays = Number(st.plays) || 0;
      if(tags.length || note || loops > 0){
        rows.push({
          sentence: s.i, en: s.en, tags: tags, note: note,
          start: s.start, loops: loops, plays: plays
        });
      }
    });
    return {
      paper: WB.session.paper.title,
      paper_id: WB.session.paperDir || WB.session.paper.title,
      section: sec.name,
      item: cur.title,
      sentences: rows
    };
  }

  function collectPaperRows(){
    const rows = [];
    WB.session.paper.sections.forEach(function(sec){
      sec.items.forEach(function(cur){
        const id = WB.paper.itemId(sec, cur);
        const errs = WB.state.errors[id] || {};
        const notes = WB.state.notes[id] || {};
        const stats = WB.state.loopStats[id] || {};
        cur.sentences.forEach(function(s){
          const tags = errs[s.i] || [];
          const note = (notes[s.i] || "").trim();
          const st = stats[s.i] || {};
          const loops = Number(st.loops) || 0;
          const plays = Number(st.plays) || 0;
          if(tags.length || note || loops > 0){
            rows.push({
              sentence: s.i, en: s.en, tags: tags, note: note, start: s.start,
              loops: loops, plays: plays,
              section: sec.name, item: cur.title
            });
          }
        });
      });
    });
    return rows;
  }

  function downloadRecord(record){
    const blob = new Blob([JSON.stringify(record, null, 2)],
      {type:"application/json;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "学习记录-" + U.safeName(record.paper) + "-" +
      U.safeName(record.section || "") + "-" + U.safeName(record.item || "") + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function analysisViewActive(){
    return !!(WB.dom.askAnalysisView &&
      !WB.dom.askAnalysisView.classList.contains("hidden"));
  }

  function showDot(on){
    if(WB.dom.analysisDot) WB.dom.analysisDot.classList.toggle("hidden", !on);
  }

  function showPanel(){
    WB.dom.analysisPanel.classList.remove("hidden");
    if(WB.dom.analysisEmpty) WB.dom.analysisEmpty.classList.add("hidden");
    showDot(false);
  }

  function hidePanel(showHint, forceKey){
    const key = forceKey || S().panelKey || currentKey();
    if(analysisViewActive()){
      // 正停在「分析」页：把上次结果留在眼前，不因为换段/收起而突然空白。
      if(hasAnalysis(key)){
        WB.dom.analysisPanel.classList.remove("hidden");
        if(WB.dom.analysisEmpty) WB.dom.analysisEmpty.classList.add("hidden");
      }else{
        WB.dom.analysisPanel.classList.add("hidden");
        if(WB.dom.analysisEmpty) WB.dom.analysisEmpty.classList.remove("hidden");
      }
      showDot(false);
      return;
    }
    WB.dom.analysisPanel.classList.add("hidden");
    showDot(!!(showHint && hasAnalysis(key)));
  }

  function actionsHtml(items){
    if(!items || !items.length) return "";
    const fallback = {cancel:"取消", retry:"重试", old:"打开上次",
                      "rerun-item":"重新分析", "rerun-paper":"重新分析"};
    return '<div class="analysis-actions">' + items.map(function(x){
      return '<button type="button" data-analysis-act="' + x.act + '"' +
        (x.id != null ? ' data-id="' + Number(x.id) + '"' : "") + ">" +
        U.escapeHtml(x.label || fallback[x.act] || "操作") + "</button>";
    }).join("") + "</div>";
  }

  function stopStatusTimer(){
    if(statusTimer){ clearInterval(statusTimer); statusTimer = null; }
  }

  function setStatus(key, text, actions, startedAt){
    S().panelKey = key;
    S().analysisHidden = false;
    showPanel();
    WB.dom.analysisBody.innerHTML =
      '<div class="analysis-status"><p>' + U.escapeHtml(text) + "</p>" +
      actionsHtml(actions) + "</div>";
    stopStatusTimer();
    if(startedAt){
      statusTimer = setInterval(function(){
        const p = WB.dom.analysisBody.querySelector(".analysis-status p");
        if(!p){ stopStatusTimer(); return; }
        p.textContent = "分析中 · 已用 " +
          Math.round((Date.now() - startedAt) / 1000) + " 秒";
      }, 1000);
    }
  }

  function renderAnalysis(forceKey, keepHidden){
    const key = forceKey || currentKey();
    S().panelKey = key;
    const a = WB.state.analysis[key];
    const panel = WB.dom.analysisPanel;
    const body = WB.dom.analysisBody;
    if(!a){
      panel.classList.add("hidden");
      showDot(false);
      body.innerHTML = "";
      if(WB.dom.analysisEmpty) WB.dom.analysisEmpty.classList.remove("hidden");
      return;
    }
    if(WB.dom.analysisEmpty) WB.dom.analysisEmpty.classList.add("hidden");
    const parts = [actionsHtml([
      {act: isPaperKey(key) ? "rerun-paper" : "rerun-item", label:"重新分析"}
    ])];
    if(a.summary) parts.push("<p>" + U.escapeHtml(a.summary) + "</p>");
    if(Array.isArray(a.patterns) && a.patterns.length){
      parts.push("<h3>主要问题</h3>");
      a.patterns.forEach(function(p){
        parts.push(
          '<div class="pattern"><b>' + U.escapeHtml(p.name || "") + "</b>" +
          (p.evidence ? "<p>证据：" + U.escapeHtml(p.evidence) + "</p>" : "") +
          (p.advice ? "<p>建议：" + U.escapeHtml(p.advice) + "</p>" : "") +
          "</div>"
        );
      });
    }
    if(Array.isArray(a.priority) && a.priority.length){
      parts.push("<h3>优先回听</h3><div class='priority'>");
      a.priority.forEach(function(p){
        parts.push('<button data-priority="' + Number(p.sentence) + '" title="' +
          U.escapeHtml(p.reason || "") + '">第 ' + Number(p.sentence) + " 句</button>");
      });
      parts.push("</div>");
      a.priority.forEach(function(p){
        if(p.reason){
          parts.push('<p class="status">第 ' + Number(p.sentence) + " 句：" +
            U.escapeHtml(p.reason) + "</p>");
        }
      });
    }
    if(Array.isArray(a.plan) && a.plan.length){
      parts.push("<h3>练习计划</h3><ol class='plan'>");
      a.plan.forEach(function(x){ parts.push("<li>" + U.escapeHtml(x) + "</li>"); });
      parts.push("</ol>");
    }
    if(a.model) parts.push('<p class="status">分析模型：' + U.escapeHtml(a.model) + "</p>");
    body.innerHTML = parts.join("");
    if(keepHidden || S().analysisHidden) hidePanel(true);
    else showPanel();
  }

  function stopPoll(){
    if(pollTimer){ clearTimeout(pollTimer); pollTimer = null; }
    stopStatusTimer();
  }

  function poll(id, key, my, started){
    pollTimer = setTimeout(function(){
      if(my !== seq) return;
      WB.api.get("/api/cet6/analysis/" + id).then(function(row){
        if(my !== seq) return;
        if(row.status === "done"){
          WB.state.analysis[key] = row.content;
          WB.store.saveState();
          WB.cet6Sync.push(row.content);
          S().analysisHidden = false;
          renderAnalysis(key);
        }else if(row.status === "pending" || row.status === "running"){
          setStatus(key, "分析中 · 已用 " + Math.round((Date.now() - started) / 1000) +
            " 秒", [{act:"cancel", id:id, label:"取消"}], started);
          poll(id, key, my, started);
        }else if(row.status === "error"){
          setStatus(key, "分析失败：" + (row.error || "未知原因"),
            [{act:"retry", label:"重试"}, {act:"old", label:"打开上次"}]);
        }else if(row.status === "canceled"){
          setStatus(key, "已取消。", [{act:"retry", label:"重试"}, {act:"old", label:"打开上次"}]);
        }else{
          poll(id, key, my, started);
        }
      }).catch(function(err){
        if(my !== seq) return;
        setStatus(key, "查询分析结果失败：" + WB.api.errorText(err),
          [{act:"retry", label:"重试"}]);
      });
    }, 800);
  }

  function restoreLatest(){
    const key = currentKey();
    const my = ++seq;
    stopPoll();
    const local = hasAnalysis(key);
    if(local){
      S().analysisHidden = false;
      renderAnalysis(key, true);
    }else{
      S().analysisHidden = false;
      hidePanel(false, key);
    }
    if(!(HTTP && WB.api.ready)) return;
    const sec = WB.paper.currentSection();
    const cur = WB.paper.currentItem();
    const info = paperInfo();
    const query = "?paper_id=" + encodeURIComponent(info.paper_id) +
      "&section=" + encodeURIComponent(sec.name) +
      "&item=" + encodeURIComponent(cur.title) + "&scope=item";
    WB.api.get("/api/cet6/analysis" + query).then(function(row){
      if(my !== seq) return;
      if(!row || row.status === "none"){
        if(!local) hidePanel(false, key);
        return;
      }
      if(row.status === "done" && row.content){
        WB.state.analysis[key] = row.content;
        WB.store.saveState();
        S().analysisHidden = false;
        renderAnalysis(key);
      }else if(row.status === "pending" || row.status === "running"){
        const started = Date.now();
        setStatus(key, "分析中 · 已用 0 秒", [{act:"cancel", id:row.id, label:"取消"}], started);
        poll(row.id, key, my, started);
      }else if(row.status === "error"){
        setStatus(key, "上次分析失败：" + (row.error || "未知原因"),
          [{act:"retry", label:"重试"}, {act:"old", label:"打开上次"}]);
      }else if(row.status === "canceled"){
        setStatus(key, "上次分析已取消。", [{act:"retry", label:"重试"}, {act:"old", label:"打开上次"}]);
      }
    }).catch(function(){});
  }

  function setButtonBusy(on){
    const itemBtn = document.getElementById("aiAnalyzeItem");
    const paperBtn = document.getElementById("aiAnalyzePaper");
    if(itemBtn) itemBtn.disabled = !!on;
    if(paperBtn) paperBtn.disabled = !!on;
  }

  async function submitLegacy(record, key, paperScope){
    if(WB.cet6Mode && WB.cet6Mode.readOnly){
      WB.status("只读模式：请从学习工作台打开后再分析。");
      return;
    }
    busy = true;
    setButtonBusy(true);
    const my = ++seq;
    stopPoll();
    setStatus(key, "分析中…请稍候（最长 3 分钟）", []);
    try{
      const body = paperScope ? Object.assign({}, record, {scope:"paper"}) : record;
      const res = await fetch(LEGACY_ANALYZE, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      if(my !== seq) return;
      const analysis = data.analysis || data;
      WB.state.analysis[key] = analysis;
      WB.store.saveState();
      WB.cet6Sync.push(analysis);
      S().analysisHidden = false;
      renderAnalysis(key);
    }catch(err){
      if(my !== seq) return;
      downloadRecord(record);
      setStatus(key, "分析服务调用失败。学习记录已导出；请确认学习工作台后台已启动，" +
        "再点「重试」。（" + err.message + "）", [{act:"retry", label:"重试"}]);
    }finally{
      busy = false;
      setButtonBusy(false);
    }
  }

  async function submitRecord(record, key, paperScope, force){
    if(WB.cet6Mode && WB.cet6Mode.readOnly){
      WB.status("只读模式：请从学习工作台打开后再分析。");
      return;
    }
    if(!(HTTP && WB.api.ready)){
      if(HTTP){
        setStatus(key, "后台令牌还没取到，请稍等一下再点「重试」。",
          [{act:"retry", label:"重试"}]);
        return;
      }
      return submitLegacy(record, key, paperScope);
    }
    if(busy) return;
    busy = true;
    setButtonBusy(true);
    const my = ++seq;
    stopPoll();
    setStatus(key, "正在提交分析…", []);
    const info = paperInfo();
    try{
      const submitted = await WB.api.post("/api/cet6/analysis", {
        paper_id: info.paper_id,
        paper: info.paper,
        section: record.section,
        item: record.item,
        scope: paperScope ? "paper" : "item",
        sentences: record.sentences,
        force: !!force
      });
      if(my !== seq) return;
      if(submitted.status === "done"){
        const row = await WB.api.get("/api/cet6/analysis/" + submitted.id);
        if(my !== seq) return;
        WB.state.analysis[key] = row.content;
        WB.store.saveState();
        WB.cet6Sync.push(row.content);
        S().analysisHidden = false;
        renderAnalysis(key);
      }else{
        const started = Date.now();
        setStatus(key, "分析中 · 已用 0 秒",
          [{act:"cancel", id:submitted.id, label:"取消"}], started);
        poll(submitted.id, key, my, started);
      }
    }catch(err){
      if(my !== seq) return;
      setStatus(key, "提交分析失败：" + WB.api.errorText(err),
        [{act:"retry", label:"重试"}]);
    }finally{
      busy = false;
      setButtonBusy(false);
    }
  }

  function submitItem(force){
    const record = collectRecord();
    if(!record.sentences.length){
      alert("先勾选断点、写一句原因，或者把某句反复循环几次，再让模型分析。" +
        "也可以直接在「对话」里自由提问。");
      return;
    }
    submitRecord(record, currentKey(), false, force);
  }

  function analyzePaper(force){
    const rows = collectPaperRows();
    if(!rows.length){
      alert("本卷还没有任何断点、笔记或循环记录，先听几段再来。");
      return;
    }
    const info = paperInfo();
    const record = {
      paper: info.paper, paper_id: info.paper_id,
      section: "整卷", item: "全部", scope: "paper",
      sentences: rows.slice(0, 120)
    };
    submitRecord(record, PAPER_KEY, true, force);
  }

  async function cancelAnalysis(id, key){
    if(!id) return;
    try{ await WB.api.post("/api/cet6/analysis/" + id + "/cancel", {}); }catch(e){}
    stopPoll();
    seq += 1;
    setStatus(key, "已取消。上次结果还在。", [{act:"retry", label:"重试"}, {act:"old", label:"打开上次"}]);
  }

  function renderStats(){
    const body = WB.dom.statsBody;
    const total = WB.paper.totalSentences();
    const done = WB.paper.totalDone();
    const today = new Date().toISOString().slice(0, 10);
    const todayDone = (WB.state.daily || {})[today] || 0;
    let reviewN = 0, noteN = 0, loopTotal = 0;
    const tagCount = {};
    const rows = [];
    WB.session.paper.sections.forEach(function(sec){
      sec.items.forEach(function(cur){
        const id = WB.paper.itemId(sec, cur);
        const d = WB.state.done[id] || {};
        const doneN = Object.keys(d).filter(function(k){ return d[k]; }).length;
        const revN = cur.sentences.filter(function(s){ return s.review; }).length;
        reviewN += revN;
        const errs = WB.state.errors[id] || {};
        Object.keys(errs).forEach(function(si){
          (errs[si] || []).forEach(function(t){ tagCount[t] = (tagCount[t] || 0) + 1; });
        });
        const notes = WB.state.notes[id] || {};
        noteN += Object.keys(notes).filter(function(k){ return (notes[k] || "").trim(); }).length;
        const stats = WB.state.loopStats[id] || {};
        let loops = 0;
        Object.keys(stats).forEach(function(si){ loops += Number(stats[si].loops) || 0; });
        loopTotal += loops;
        rows.push({sec:sec.name, item:cur.title, done:doneN,
                   total:cur.sentences.length, review:revN, loops:loops});
      });
    });
    const tagKeys = Object.keys(tagCount).sort(function(a, b){ return tagCount[b] - tagCount[a]; });
    const tagHtml = tagKeys.length
      ? tagKeys.map(function(t){ return t + " " + tagCount[t]; }).join(" · ")
      : "暂无";
    const parts = [];
    parts.push('<p class="meta">本卷进度 ' + done + " / " + total + " 句 · 今日 " + todayDone +
      " 句 · 待校对 " + reviewN + " 句 · 笔记 " + noteN + " 条 · 循环回绕 " + loopTotal + " 次</p>");
    parts.push("<p><b>断点分布：</b>" + U.escapeHtml(tagHtml) + "</p>");
    parts.push("<table><thead><tr><th>Section / 题型</th><th>已完成</th><th>待校对</th><th>循环</th></tr></thead><tbody>");
    rows.forEach(function(r){
      parts.push("<tr><td>" + U.escapeHtml(r.sec) + " / " + U.escapeHtml(r.item) +
        '</td><td class="n">' + r.done + " / " + r.total +
        '</td><td class="n">' + r.review +
        '</td><td class="n">' + r.loops + "</td></tr>");
    });
    parts.push("</tbody></table>");
    body.innerHTML = parts.join("");
  }

  function toggleStats(){
    const panel = WB.dom.statsPanel;
    if(panel.classList.contains("hidden")){
      renderStats();
      panel.classList.remove("hidden");
    }else{
      panel.classList.add("hidden");
    }
  }

  function init(){
    if(bound) return;
    bound = true;

    const itemBtn = document.getElementById("aiAnalyzeItem");
    if(itemBtn) itemBtn.addEventListener("click", function(){ submitItem(false); });
    const paperBtn = document.getElementById("aiAnalyzePaper");
    if(paperBtn) paperBtn.addEventListener("click", function(){ analyzePaper(false); });

    const closeBtn = document.getElementById("closeAnalysis");
    if(closeBtn) closeBtn.addEventListener("click", function(){
      S().analysisHidden = true;
      hidePanel(true);
      if(WB.ask && WB.ask.showTab) WB.ask.showTab("chat");
    });

    WB.dom.analysisBody.addEventListener("click", function(e){
      const act = e.target.closest("button[data-analysis-act]");
      if(act){
        const kind = act.dataset.analysisAct;
        const id = Number(act.dataset.id || 0);
        const key = S().panelKey || currentKey();
        if(kind === "cancel") cancelAnalysis(id, key);
        else if(kind === "rerun-item") submitItem(true);
        else if(kind === "rerun-paper") analyzePaper(true);
        else if(kind === "retry"){
          if(isPaperKey(key)) analyzePaper(true);
          else submitItem(true);
        }else if(kind === "old"){
          S().analysisHidden = false;
          renderAnalysis(key);
        }
        return;
      }
      const b = e.target.closest("button[data-priority]");
      if(!b) return;
      WB.actions.jumpToSentence(Number(b.dataset.priority));
    });

    document.getElementById("statsBtn").addEventListener("click", toggleStats);
    document.getElementById("closeStats").addEventListener("click", function(){
      WB.dom.statsPanel.classList.add("hidden");
    });
  }

  function showCurrent(){
    const key = S().panelKey || currentKey();
    if(hasAnalysis(key)){
      renderAnalysis(key);
    }else{
      WB.dom.analysisPanel.classList.add("hidden");
      if(WB.dom.analysisEmpty) WB.dom.analysisEmpty.classList.remove("hidden");
    }
  }

  WB.insights = {
    init: init,
    collectRecord: collectRecord,
    renderAnalysis: renderAnalysis,
    restoreLatest: restoreLatest,
    showCurrent: showCurrent,
    submitItem: submitItem,
    analyzePaper: analyzePaper,
    renderStats: renderStats,
    toggleStats: toggleStats
  };
})(window.WB = window.WB || {});

</script>
<script>
// ---- 65-ask.js ----
// @requires: 00-core.js, 10-storage.js, 20-paper.js, 25-ranges.js, 55-api.js
// AI 助手：右下角常驻入口 + 右侧抽屉，任何滚动位置都能用。
// 「对话」是主入口（自由提问，自动带当前试卷/题型/当前句/划词/循环/笔记）；
// 「分析」是可选工具；「历史」从服务端 conversations 读取，可点回旧对话继续。
(function(WB){
  "use strict";

  const U = WB.util;
  let bound = false;
  let historyRows = [];
  let historyQuery = "";
  let historyLoading = false;
  let fabDrag = null;
  let suppressFabClick = false;

  function S(){ return WB.session; }

  function el(tag, className, text){
    const node = document.createElement(tag);
    if(className) node.className = className;
    if(text != null) node.textContent = text;
    return node;
  }

  // 轻量 Markdown：只处理粗体、行内代码、标题和换行；先转义，避免注入。
  function mdLite(text){
    let html = U.escapeHtml(text || "");
    html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/^#{1,4}\s+(.+)$/gm, "<b>$1</b>");
    return html.replace(/\n/g, "<br>");
  }

  function scrollBottom(){
    const body = WB.dom.askBody;
    if(body) body.scrollTop = body.scrollHeight;
  }

  function append(role, text, opts){
    opts = opts || {};
    const wrap = el("div", "ask-msg " + role);
    if(opts.meta){
      wrap.appendChild(el("div", "ask-meta", opts.meta));
    }
    if(opts.thinking){
      const det = el("details", "ask-thinking");
      det.appendChild(el("summary", "", "思考过程"));
      det.appendChild(el("div", "", ""));
      det.lastChild.innerHTML = mdLite(opts.thinking);
      wrap.appendChild(det);
    }
    const bubble = el("div", "ask-bubble");
    bubble.innerHTML = opts.html ? text : mdLite(text);
    wrap.appendChild(bubble);
    WB.dom.askBody.appendChild(wrap);
    scrollBottom();
    return {wrap: wrap, bubble: bubble};
  }

  function clearMessages(){
    if(WB.dom.askBody) WB.dom.askBody.innerHTML = "";
  }

  function welcome(){
    clearMessages();
    WB.dom.askBody.innerHTML =
      '<div class="ai-welcome">' +
        '<b>AI 助手</b>' +
        '<p>不用先勾断点，直接问。会自动带上当前试卷、题型、当前句和你的笔记。</p>' +
        '<p class="status">例如：这一句为什么听不出来 / 这段在讲什么 / 帮我总结本段的考点 / 这个词在句子里怎么理解。</p>' +
      "</div>";
    renderSuggest();
    scrollBottom();
  }

  const SUGGESTS = [
    "这一句为什么听不出来？",
    "这段在讲什么？",
    "帮我总结本段的考点"
  ];

  function renderSuggest(){
    const box = WB.dom.askSuggest;
    if(!box) return;
    box.innerHTML = SUGGESTS.map(function(text){
      return '<button type="button" data-suggest="' + U.escapeHtml(text) + '">' +
        U.escapeHtml(text) + "</button>";
    }).join("");
  }

  function setStreaming(on){
    S().askStreaming = !!on;
    if(WB.dom.askSend) WB.dom.askSend.classList.toggle("hidden", !!on);
    if(WB.dom.askStop) WB.dom.askStop.classList.toggle("hidden", !on);
  }

  function currentId(){
    const ai = WB.store.loadAi();
    if(ai.conversationId) return Number(ai.conversationId) || 0;
    // 兼容旧版本按试卷存的会话 id：第一次打开时并到全局。
    const legacy = Number(WB.state && WB.state.cet6ConversationId) || 0;
    if(legacy){
      WB.store.saveAi({conversationId: legacy});
      return legacy;
    }
    return 0;
  }

  function setConversationId(id){
    WB.store.saveAi({conversationId: Number(id) || 0});
  }

  function selectionInfo(){
    const saved = S().askSelection;
    if(saved && saved.text){
      return {
        text: String(saved.text || "").slice(0, 2000),
        sentence: saved.i != null && saved.i >= 0 ? WB.paper.findSentence(Number(saved.i)) : null,
        i: saved.i != null ? Number(saved.i) : -1
      };
    }
    const selObj = window.getSelection ? window.getSelection() : null;
    const sel = selObj ? String(selObj.toString() || "").trim() : "";
    if(!sel || !selObj.anchorNode) return {text: "", sentence: null, i: -1};
    const node = selObj.anchorNode;
    const nodeEl = node.nodeType === 1 ? node : node.parentElement;
    const card = nodeEl && nodeEl.closest ? nodeEl.closest(".card") : null;
    const sentence = card ? WB.paper.findSentence(Number(card.dataset.i)) : null;
    return {
      text: sel.slice(0, 2000),
      sentence: sentence,
      i: sentence ? sentence.i : -1
    };
  }

  function currentSentence(picked){
    picked = picked || selectionInfo();
    if(picked.sentence) return picked.sentence;
    if(S().activeSentence >= 0) return WB.paper.findSentence(S().activeSentence);
    if(S().followActive && S().followIndex >= 0) return WB.paper.findSentence(S().followIndex);
    return null;
  }

  function buildContext(){
    const sec = WB.paper.currentSection();
    const cur = WB.paper.currentItem();
    const id = WB.paper.currentItemId();
    const picked = selectionInfo();
    const sentence = currentSentence(picked);
    let before = "", after = "";
    if(sentence){
      const idx = cur.sentences.findIndex(function(s){ return s.i === sentence.i; });
      if(idx >= 0){
        before = idx > 0 ? cur.sentences[idx - 1].en : "";
        after = idx + 1 < cur.sentences.length ? cur.sentences[idx + 1].en : "";
      }
    }
    const itemText = cur.sentences.map(function(s){ return s.en; }).join(" ").slice(0, 2000);
    const questionText = cur.question_items.map(function(q){ return q.en; }).join(" ").slice(0, 1500);
    return WB.contextPayload({
      itemId: id,
      title: WB.session.paper.title + " / " + sec.name + " / " + cur.title,
      sentence: sentence ? sentence.i : -1,
      display: sentence ? (sentence.display != null ? sentence.display : sentence.i) : "",
      en: sentence ? sentence.en : "",
      before: before,
      after: after,
      section: sec.name,
      item: cur.title,
      itemText: itemText,
      questionText: questionText,
      selection: picked.text,
      errors: WB.state.errors[id],
      notes: WB.state.notes[id],
      loopStats: WB.state.loopStats[id],
      done: sentence ? !!WB.paper.doneMap()[sentence.i] : null,
      paperDone: WB.paper.totalDone(),
      paperTotal: WB.paper.totalSentences(),
      recentActions: WB.session.recentActions
    });
  }

  async function send(){
    if(S().askStreaming) return;
    if(!WB.api || !WB.api.ready){
      append("error", "AI 助手需要从学习工作台打开（HTTP /cet6/）。" +
        "file:// 打开时仍可以听音频、看原文。");
      return;
    }
    const input = WB.dom.askInput;
    const message = String(input.value || "").trim();
    if(!message) return;
    input.value = "";
    append("user", message);
    const reply = append("assistant", "");
    const meta = el("div", "ask-meta");
    reply.wrap.insertBefore(meta, reply.bubble);

    let answer = "";
    let thinking = "";
    let finalText = "";
    const trace = [];
    const controller = new AbortController();
    S().askAbort = controller;
    setStreaming(true);

    const render = function(){
      let html = "";
      if(thinking){
        html += '<details class="ask-thinking"><summary>思考过程</summary>' +
          mdLite(thinking) + "</details>";
      }
      if(trace.length){
        html += '<div class="ask-tools">' +
          trace.map(function(x){ return "<span>" + U.escapeHtml(x) + "</span>"; }).join("") +
          "</div>";
      }
      html += mdLite(answer || (S().askStreaming ? "正在思考…" : ""));
      reply.bubble.innerHTML = html;
      scrollBottom();
    };
    render();

    const onEvent = function(event){
      const kind = event.kind;
      if(kind === "start"){
        const data = event.data || {};
        if(data.conversation_id){
          setConversationId(data.conversation_id);
          if(WB.dom.askModel) WB.dom.askModel.textContent = data.model || "deepseek-flash";
        }
        meta.textContent = data.model ? "模型：" + data.model : "";
      }else if(kind === "text"){
        answer += String(event.text || "");
        render();
      }else if(kind === "thinking"){
        thinking += String(event.text || "");
        render();
      }else if(kind === "tool_start"){
        const name = (event.data && event.data.name) || "工具";
        trace.push("→ " + name);
        render();
      }else if(kind === "tool_end"){
        const preview = (event.data && event.data.preview) || "完成";
        trace[trace.length - 1] = "✓ " + preview;
        render();
      }else if(kind === "done"){
        finalText = String((event.data && event.data.text) || "");
        if(finalText) answer = finalText;
        render();
      }else if(kind === "error"){
        answer = "出错了：" + (event.text || "未知原因");
        render();
      }
    };

    try{
      await WB.api.stream("/api/agent/chat", {
        message: message,
        conversation_id: currentId() || null,
        module: "cet6",
        surface: "cet6",
        context_snapshot: buildContext()
      }, onEvent, controller.signal);
      if(!answer && !S().askStreaming) answer = "（没有返回内容）";
    }catch(err){
      if(err && err.name === "AbortError"){
        answer = (answer ? answer + "\n\n" : "") + "（已停止）";
      }else{
        answer = "提问失败：" + (WB.api ? WB.api.errorText(err) : String(err));
      }
      render();
    }finally{
      S().askAbort = null;
      S().askSelection = null;
      setStreaming(false);
      render();
      WB.noteAction("提问：" + message.slice(0, 60));
    }
  }

  async function stop(){
    const controller = S().askAbort;
    if(controller) controller.abort();
    if(WB.api && WB.api.ready){
      try{
        await WB.api.post("/api/agent/stop", {conversation_id: currentId() || null});
      }catch(e){}
    }
    setStreaming(false);
  }

  function newConversation(){
    if(S().askStreaming) stop();
    setConversationId(0);
    S().askLoaded = true;
    S().askSelection = null;
    welcome();
    showTab("chat");
    if(WB.dom.askInput) WB.dom.askInput.focus();
  }

  function storedText(content){
    if(content == null) return "";
    if(typeof content === "string") return content;
    return String(content.text || "");
  }

  function renderStored(message){
    const content = message.content || {};
    const role = message.role;
    if(role === "user"){
      const text = storedText(content);
      if(text) append("user", text);
      return;
    }
    if(role === "assistant"){
      const err = typeof content === "object" ? String(content.error || "") : "";
      if(err){
        append("error", "上次回答出错：" + err);
        return;
      }
      const text = storedText(content);
      const thinking = typeof content === "object" ? String(content.thinking || "") : "";
      if(text) append("assistant", text, {thinking: thinking});
    }
  }

  async function loadConversation(id){
    id = Number(id) || 0;
    if(S().askStreaming) await stop();
    if(!id){
      welcome();
      S().askLoaded = true;
      return;
    }
    if(!WB.api || !WB.api.ready){
      welcome();
      return;
    }
    clearMessages();
    append("assistant", "正在读取对话…");
    try{
      const data = await WB.api.get("/api/conversations/" + id);
      clearMessages();
      (data.messages || []).forEach(renderStored);
      if(!(data.messages || []).length) welcome();
      setConversationId(data.id || id);
      S().askLoaded = true;
      if(WB.dom.askModel) WB.dom.askModel.textContent = "deepseek-flash";
      scrollBottom();
    }catch(err){
      clearMessages();
      if(err && err.status === 404){
        setConversationId(0);
        welcome();
      }else{
        append("error", "读取对话失败：" + WB.api.errorText(err));
      }
    }
  }

  function historyLabel(row){
    const stamp = String(row.updated_at || "");
    const short = stamp.length >= 16 ? stamp.slice(5, 16).replace("T", " ") : stamp;
    return short;
  }

  function renderHistory(){
    const box = WB.dom.askHistoryList;
    if(!box) return;
    const q = historyQuery.trim().toLowerCase();
    const rows = historyRows.filter(function(row){
      return !q || String(row.title || "").toLowerCase().indexOf(q) >= 0;
    });
    if(!rows.length){
      box.innerHTML = '<p class="status">' +
        (historyRows.length ? "没有匹配的对话。" : "还没有对话。问一句就会出现在这里。") +
        "</p>";
      return;
    }
    const nowId = currentId();
    box.innerHTML = rows.map(function(row){
      const title = String(row.title || "新对话");
      return '<button type="button" class="ai-history-item' +
        (Number(row.id) === nowId ? " on" : "") + '" data-history="' + Number(row.id) + '">' +
        '<span class="t">' + U.escapeHtml(title) + "</span>" +
        '<span class="m">' + U.escapeHtml(historyLabel(row)) +
          " · " + Number(row.messages || 0) + " 条" +
          (Number(row.id) === nowId ? " · 当前" : "") + "</span>" +
        "</button>";
    }).join("");
  }

  async function loadHistory(){
    if(historyLoading) return;
    const box = WB.dom.askHistoryList;
    if(!box) return;
    if(!WB.api || !WB.api.ready){
      box.innerHTML = '<p class="status">对话历史需要从学习工作台打开（HTTP /cet6/）。</p>';
      return;
    }
    historyLoading = true;
    box.innerHTML = '<p class="status">正在翻历史…</p>';
    try{
      const data = await WB.api.get("/api/conversations?limit=50&module=cet6");
      historyRows = data.items || [];
      renderHistory();
    }catch(err){
      box.innerHTML = '<p class="status">历史读取失败：' + U.escapeHtml(WB.api.errorText(err)) + "</p>";
    }finally{
      historyLoading = false;
    }
  }

  function showTab(name){
    const tab = name || "chat";
    S().askTab = tab;
    document.querySelectorAll("[data-ask-tab]").forEach(function(btn){
      btn.classList.toggle("on", btn.dataset.askTab === tab);
    });
    if(WB.dom.askChatView) WB.dom.askChatView.classList.toggle("hidden", tab !== "chat");
    if(WB.dom.askAnalysisView) WB.dom.askAnalysisView.classList.toggle("hidden", tab !== "analysis");
    if(WB.dom.askHistoryView) WB.dom.askHistoryView.classList.toggle("hidden", tab !== "history");
    if(tab === "history") loadHistory();
    if(tab === "analysis" && WB.insights && WB.insights.showCurrent) WB.insights.showCurrent();
    if(tab === "chat"){
      scrollBottom();
      if(WB.dom.askInput) WB.dom.askInput.focus();
    }
  }

  function openPanel(tab){
    const panel = WB.dom.askPanel;
    if(!panel) return;
    panel.classList.remove("hidden");
    if(WB.dom.askBtn){
      WB.dom.askBtn.classList.add("on");
      WB.dom.askBtn.setAttribute("aria-expanded", "true");
    }
    showTab(tab || S().askTab || "chat");
    if(!S().askLoaded){
      S().askLoaded = true;
      loadConversation(currentId());
    }
  }

  function closePanel(){
    const panel = WB.dom.askPanel;
    if(!panel) return;
    panel.classList.add("hidden");
    if(WB.dom.askBtn){
      WB.dom.askBtn.classList.remove("on");
      WB.dom.askBtn.setAttribute("aria-expanded", "false");
    }
  }

  function togglePanel(){
    const panel = WB.dom.askPanel;
    if(!panel) return;
    if(panel.classList.contains("hidden")) openPanel("chat");
    else closePanel();
  }

  // 句子卡片 / 划词浮钮 / 快捷键都从这里进：保留现场，再打开抽屉。
  function openFor(opts){
    opts = opts || {};
    if(opts.text != null){
      S().askSelection = {
        text: String(opts.text || "").slice(0, 2000),
        i: opts.sentence != null ? Number(opts.sentence) : -1
      };
    }
    openPanel("chat");
    if(opts.prefill != null && WB.dom.askInput){
      WB.dom.askInput.value = String(opts.prefill);
      WB.dom.askInput.focus();
      WB.dom.askInput.setSelectionRange(WB.dom.askInput.value.length,
        WB.dom.askInput.value.length);
    }
  }

  function clampFabTop(top){
    const btn = WB.dom.askBtn;
    const h = btn ? btn.offsetHeight : 58;
    // 底部给固定播放条留位置，别让圆圈拖到播放条上面。
    return U.clamp(Number(top) || 0, 8, Math.max(8, window.innerHeight - h - 96));
  }

  function placeFab(top){
    const btn = WB.dom.askBtn;
    if(!btn) return;
    btn.style.top = clampFabTop(top) + "px";
    btn.style.bottom = "auto";
  }

  // AI 圆圈只上下移动：左右仍然贴右边，避免挡住正文中间。
  function initFabDrag(){
    const btn = WB.dom.askBtn;
    if(!btn) return;
    const saved = WB.store.loadAi();
    if(saved.fabTop != null) placeFab(saved.fabTop);

    btn.addEventListener("pointerdown", function(e){
      if(e.button != null && e.button !== 0) return;
      const rect = btn.getBoundingClientRect();
      fabDrag = {y:e.clientY, top:rect.top, moved:false, id:e.pointerId};
      try{ btn.setPointerCapture(e.pointerId); }catch(err){}
    });
    btn.addEventListener("pointermove", function(e){
      if(!fabDrag || e.pointerId !== fabDrag.id) return;
      const dy = e.clientY - fabDrag.y;
      if(Math.abs(dy) > 4) fabDrag.moved = true;
      if(!fabDrag.moved) return;
      placeFab(fabDrag.top + dy);
    });
    btn.addEventListener("pointerup", function(e){
      if(!fabDrag || e.pointerId !== fabDrag.id) return;
      const moved = fabDrag.moved;
      const top = btn.getBoundingClientRect().top;
      fabDrag = null;
      try{ btn.releasePointerCapture(e.pointerId); }catch(err){}
      if(moved){
        placeFab(top);
        WB.store.saveAi({fabTop:clampFabTop(top)});
        suppressFabClick = true;
        setTimeout(function(){ suppressFabClick = false; }, 0);
      }
    });
    btn.addEventListener("pointercancel", function(){ fabDrag = null; });
    btn.addEventListener("click", function(e){
      if(suppressFabClick){
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      togglePanel();
    });
    window.addEventListener("resize", function(){
      const ai = WB.store.loadAi();
      if(ai.fabTop != null && btn.style.bottom === "auto"){
        placeFab(ai.fabTop);
      }
    });
  }

  function init(){
    if(bound) return;
    bound = true;
    if(WB.dom.askModel) WB.dom.askModel.textContent = "deepseek-flash";

    initFabDrag();
    WB.dom.askClose.addEventListener("click", closePanel);
    WB.dom.askSend.addEventListener("click", send);
    WB.dom.askStop.addEventListener("click", stop);
    WB.dom.askNew.addEventListener("click", newConversation);
    WB.dom.askInput.addEventListener("keydown", function(e){
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        send();
      }
    });

    if(WB.dom.askTabs){
      WB.dom.askTabs.addEventListener("click", function(e){
        const btn = e.target.closest("button[data-ask-tab]");
        if(!btn) return;
        showTab(btn.dataset.askTab);
      });
    }
    if(WB.dom.askSuggest){
      WB.dom.askSuggest.addEventListener("click", function(e){
        const btn = e.target.closest("button[data-suggest]");
        if(!btn) return;
        WB.dom.askInput.value = btn.dataset.suggest || "";
        WB.dom.askInput.focus();
      });
    }
    if(WB.dom.askHistorySearch){
      WB.dom.askHistorySearch.addEventListener("input", function(){
        historyQuery = WB.dom.askHistorySearch.value || "";
        renderHistory();
      });
    }
    if(WB.dom.askHistoryList){
      WB.dom.askHistoryList.addEventListener("click", function(e){
        const btn = e.target.closest("button[data-history]");
        if(!btn) return;
        loadConversation(Number(btn.dataset.history)).then(function(){
          showTab("chat");
        });
      });
    }
  }

  WB.ask = {
    init: init,
    send: send,
    stop: stop,
    buildContext: buildContext,
    togglePanel: togglePanel,
    openPanel: openPanel,
    closePanel: closePanel,
    showTab: showTab,
    openFor: openFor,
    newConversation: newConversation
  };
})(window.WB = window.WB || {});

</script>
<script>
// ---- 68-translate.js ----
// @requires: 00-core.js, 10-storage.js, 20-paper.js, 40-render.js, 55-api.js
// 翻译层：划词查词（含音标/释义，可一键进生词本）+ 逐句译文开关。
// 译文按题型单元缓存在 state.translation，刷新后直接显示，不再请求模型。
(function(WB){
  "use strict";

  const U = WB.util;
  let bound = false;
  let lastSelection = "";
  let lastInfo = null;

  function currentSelection(){
    const selObj = window.getSelection ? window.getSelection() : null;
    const sel = selObj ? String(selObj.toString() || "").trim() : "";
    if(!sel || sel.length > 60 || !selObj.anchorNode) return null;
    const node = selObj.anchorNode;
    const el = node.nodeType === 1 ? node : node.parentElement;
    const en = el && el.closest ? el.closest(".en") : null;
    if(!en) return null;
    let rect = null;
    try{ rect = selObj.getRangeAt(0).getBoundingClientRect(); }catch(e){ return null; }
    const card = el.closest(".card");
    const i = card ? Number(card.dataset.i) : -1;
    const sentence = i >= 0 ? WB.paper.findSentence(i) : null;
    return {text: sel, rect: rect, sentence: sentence ? sentence.en : "",
            i: i, card: card};
  }

  function place(btn, left, top){
    if(!btn) return;
    btn.style.left = Math.max(8, Math.min(window.innerWidth - 108, left)) + "px";
    btn.style.top = Math.max(8, top) + "px";
  }

  function updateSelectionButton(){
    const info = currentSelection();
    const vocabBtn = WB.dom.selVocabBtn;
    const transBtn = WB.dom.selTranslateBtn;
    const askBtn = WB.dom.selAskBtn;
    if(!info || !info.text){
      if(vocabBtn) vocabBtn.classList.add("hidden");
      if(transBtn) transBtn.classList.add("hidden");
      if(askBtn) askBtn.classList.add("hidden");
      lastSelection = "";
      return;
    }
    lastSelection = info.text;
    lastInfo = info;
    const center = info.rect.left + info.rect.width / 2;
    const left = Math.max(8, Math.min(window.innerWidth - 190, center - 90));
    place(vocabBtn, left, info.rect.top - 36);
    place(transBtn, left + 64, info.rect.top - 36);
    place(askBtn, left + 116, info.rect.top - 36);
    if(vocabBtn) vocabBtn.classList.remove("hidden");
    if(transBtn) transBtn.classList.remove("hidden");
    if(askBtn) askBtn.classList.remove("hidden");
  }

  function showPopover(rect, html){
    const pop = WB.dom.translationPop;
    if(!pop) return;
    pop.innerHTML = html;
    pop.classList.remove("hidden");
    const width = 320;
    const left = Math.max(8, Math.min(window.innerWidth - width - 12,
      rect.left + rect.width / 2 - width / 2));
    let top = rect.bottom + 8;
    if(top + 190 > window.innerHeight) top = Math.max(8, rect.top - 198);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function hidePopover(){
    if(WB.dom.translationPop) WB.dom.translationPop.classList.add("hidden");
  }

  function kindOf(text){
    if(/[.!?。！？;；]$/.test(text) || text.length > 36) return "sentence";
    return "word";
  }

  async function translateSelection(){
    const info = currentSelection() || lastInfo || {
      text: lastSelection, rect: {left: window.innerWidth / 2, bottom: 80,
                                  top: 40, width: 0}, sentence: "", i: -1
    };
    if(!info.text) return;
    if(WB.dom.selVocabBtn) WB.dom.selVocabBtn.classList.add("hidden");
    if(WB.dom.selTranslateBtn) WB.dom.selTranslateBtn.classList.add("hidden");
    const sec = WB.paper.currentSection();
    const cur = WB.paper.currentItem();
    const infoPaper = WB.session.paperDir || WB.session.paper.title;
    showPopover(info.rect, '<p class="status">翻译中…</p>');
    if(!WB.api || !WB.api.ready){
      showPopover(info.rect,
        '<p class="status">划词翻译需要从学习工作台打开（HTTP /cet6/）。</p>' +
        '<div class="trans-actions"><button data-trans="close">关闭</button></div>');
      return;
    }
    try{
      const data = await WB.api.post("/api/cet6/translate", {
        text: info.text,
        kind: kindOf(info.text),
        context: {
          sentence: info.sentence,
          paper_id: infoPaper,
          section: sec.name,
          item: cur.title
        }
      });
      if(!data.translation && data.error){
        showPopover(info.rect,
          '<p class="status">' + U.escapeHtml(data.error) + "</p>" +
          '<div class="trans-actions"><button data-trans="close">关闭</button></div>');
        return;
      }
      const meaning = String(data.meaning || "");
      const phonetic = String(data.phonetic || "");
      const attr = function(value){
        return U.escapeHtml(String(value || "")).replace(/"/g, "&quot;");
      };
      const html = '<div class="trans-word">' + U.escapeHtml(info.text) + "</div>" +
        (phonetic ? '<div class="trans-phonetic">' + U.escapeHtml(phonetic) + "</div>" : "") +
        '<div class="trans-result">' + U.escapeHtml(data.translation || "") + "</div>" +
        (meaning && meaning !== data.translation
          ? '<p class="trans-meaning">' + U.escapeHtml(meaning) + "</p>" : "") +
        '<div class="trans-actions">' +
          '<button data-trans="vocab" data-word="' + attr(info.text) +
            '" data-meaning="' + attr(meaning || data.translation || "") +
            '" data-context="' + attr(info.sentence || "") + '">加入生词本</button>' +
          '<button data-trans="copy" data-text="' + attr(data.translation || "") + '">复制</button>' +
          '<button data-trans="close">关闭</button>' +
        "</div>";
      showPopover(info.rect, html);
      WB.noteAction("翻译：" + info.text);
    }catch(err){
      showPopover(info.rect,
        '<p class="status">翻译失败：' + U.escapeHtml(WB.api.errorText(err)) + "</p>" +
        '<div class="trans-actions"><button data-trans="close">关闭</button></div>');
    }
  }

  function currentTranslation(){
    const id = WB.paper.currentItemId();
    return WB.state.translation[id] || {};
  }

  function applyZh(){
    if(!WB.dom.sentences) return;
    const map = currentTranslation();
    WB.dom.sentences.querySelectorAll(".zh[data-zh]").forEach(function(node){
      const i = Number(node.dataset.zh);
      const item = map[String(i)] || map[i] || {};
      const text = String(item.translation || "");
      node.textContent = text;
      // 译文跟着原文走：原文藏起来时译文也藏着；原文一露，译文就在下面。
      const card = node.closest(".card");
      const enHidden = !!card && !!card.querySelector(".en.hidden");
      node.classList.toggle("hidden", !text || enHidden);
    });
  }

  // 自动补译文：换到某一段时在后台补缺失的句子，不再有「显示译文」按钮。
  // 失败 1 分钟后才重试，免得每次重渲染都打一次接口。
  const lastTry = {};
  let autoBusy = false;

  function missingRows(){
    const cur = WB.paper.currentItem();
    const map = currentTranslation();
    return cur ? cur.sentences.filter(function(s){
      const row = map[String(s.i)] || map[s.i];
      return !(row && row.translation);
    }) : [];
  }

  async function autoCurrent(){
    if(autoBusy) return;
    if(!WB.api || !WB.api.ready) return;      // file:// 离线：只显示已有缓存
    const cur = WB.paper.currentItem();
    const id = WB.paper.currentItemId();
    if(!cur || !id || !cur.sentences.length) return;
    if(!missingRows().length) return;
    if(lastTry[id] && Date.now() - lastTry[id] < 60000) return;
    lastTry[id] = Date.now();
    autoBusy = true;
    const sec = WB.paper.currentSection();
    WB.status("正在补本段译文…");
    try{
      const data = await WB.api.post("/api/cet6/translate-item", {
        paper_id: WB.session.paperDir || WB.session.paper.title,
        section: sec.name,
        item: cur.title,
        sentences: cur.sentences.map(function(s){ return {i:s.i, en:s.en}; })
      });
      const merged = Object.assign({}, WB.state.translation[id] || {});
      const items = (data && data.items) || {};
      Object.keys(items).forEach(function(k){
        if(items[k] && items[k].translation) merged[k] = items[k];
      });
      WB.state.translation[id] = merged;
      WB.store.saveState();
      if(WB.paper.currentItemId() === id) applyZh();
      const total = cur.sentences.length;
      const got = cur.sentences.filter(function(s){
        return merged[String(s.i)] && merged[String(s.i)].translation;
      }).length;
      WB.status(got >= total
        ? "本段译文已就位，点「显示原文」时一起看。"
        : "本段译文补了 " + got + " / " + total + " 句。");
    }catch(err){
      WB.status("译文没拉到：" + WB.api.errorText(err) + "（稍后会再试）");
    }finally{
      autoBusy = false;
    }
  }

  function init(){
    if(bound) return;
    bound = true;
    document.addEventListener("selectionchange", function(){
      setTimeout(updateSelectionButton, 0);
    });
    document.addEventListener("scroll", function(){
      if(WB.dom.selVocabBtn) WB.dom.selVocabBtn.classList.add("hidden");
      if(WB.dom.selTranslateBtn) WB.dom.selTranslateBtn.classList.add("hidden");
      if(WB.dom.selAskBtn) WB.dom.selAskBtn.classList.add("hidden");
    }, true);
    WB.dom.selTranslateBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
    WB.dom.selTranslateBtn.addEventListener("click", function(){
      translateSelection();
    });
    if(WB.dom.selAskBtn){
      WB.dom.selAskBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
      WB.dom.selAskBtn.addEventListener("click", function(){
        const info = currentSelection() || lastInfo;
        if(!info || !info.text) return;
        WB.dom.selAskBtn.classList.add("hidden");
        WB.dom.selVocabBtn.classList.add("hidden");
        WB.dom.selTranslateBtn.classList.add("hidden");
        if(WB.ask && WB.ask.openFor){
          WB.ask.openFor({
            text: info.text,
            sentence: info.i,
            prefill: "「" + info.text + "」在这里是什么意思？"
          });
        }
      });
    }
    WB.dom.translationPop.addEventListener("click", function(e){
      const btn = e.target.closest("button[data-trans]");
      if(!btn) return;
      const act = btn.dataset.trans;
      if(act === "close") hidePopover();
      else if(act === "vocab"){
        WB.vocab.addWord(btn.dataset.word, btn.dataset.meaning, btn.dataset.context);
        btn.textContent = "已加入";
        btn.disabled = true;
      }else if(act === "copy"){
        const text = btn.dataset.text || "";
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(function(){
            WB.status("译文已复制。");
          }).catch(function(){});
        }
      }
    });
    document.addEventListener("click", function(e){
      const pop = WB.dom.translationPop;
      if(!pop || pop.classList.contains("hidden")) return;
      if(pop.contains(e.target)) return;
      if(e.target === WB.dom.selTranslateBtn) return;
      hidePopover();
    });
  }

  WB.translate = {
    init: init,
    translateSelection: translateSelection,
    autoCurrent: autoCurrent,
    applyZh: applyZh
  };
})(window.WB = window.WB || {});

</script>
<script>
// ---- 70-vocab.js ----
// @requires: 00-core.js, 10-storage.js, 20-paper.js, 40-render.js, 55-api.js
// 功能层：生词本存储、面板、划词浮钮与 CSV 导出。
// HTTP 模式（学习工作台 /cet6/）以服务端 vocab_items 为唯一真源；
// file:// 模式仍用 localStorage，保持旧入口可用。
(function(WB){
  "use strict";

  const U = WB.util;
  const MIGRATED_KEY = "listening_workbench_vocab_migrated_v2";
  let bound = false;
  let remote = null;       // HTTP 模式下的服务端快照（null = 还没拉到）
  let remoteReady = false;
  let meaningTimer = null;

  function usingApi(){
    return !!(WB.api && WB.api.HTTP && WB.api.ready);
  }

  // 面板渲染始终同步：HTTP 用服务端快照，file:// 用 localStorage。
  function load(){
    return remote || WB.store.loadVocab();
  }

  function mapRemote(item){
    return {
      id: item.id,
      word: item.word,
      meaning: item.meaning || "",
      context: item.context || "",
      paper: item.paper_title || "",
      at: item.created_at || ""
    };
  }

  async function migrateOnce(){
    if(!usingApi()) return;
    let done = false;
    try{ done = localStorage.getItem(MIGRATED_KEY) === "1"; }catch(e){}
    if(done) return;
    const local = WB.store.loadVocab();
    if(local.length){
      try{
        const result = await WB.api.post("/api/vocab/import", {items: local});
        WB.status("生词已迁入学习工作台：新增 " + result.added + "，合并 " + result.merged);
      }catch(e){
        // 迁移失败不落标记，下次打开再试
        return;
      }
    }
    try{ localStorage.setItem(MIGRATED_KEY, "1"); }catch(e){}
  }

  async function refresh(){
    if(!usingApi()){ remote = null; remoteReady = false; return false; }
    await migrateOnce();
    try{
      const data = await WB.api.get("/api/vocab?limit=500");
      remote = (data.items || []).map(mapRemote);
      remoteReady = true;
      return true;
    }catch(e){
      WB.status("生词本读取失败：" + WB.api.errorText(e));
      return false;
    }
  }

  function syncFromServer(){
    return refresh().then(function(ok){
      if(ok && WB.dom.vocabPanel && !WB.dom.vocabPanel.classList.contains("hidden")){
        render();
      }
      return ok;
    });
  }

  function render(){
    const body = WB.dom.vocabBody;
    const arr = load();
    if(!arr.length){
      body.innerHTML = '<p class="status">还没有生词。先点“显示原文”，选中一个单词，再点“收藏生词”。</p>';
      return;
    }
    body.innerHTML = arr.map(function(v, k){
      return '<div class="vocab-row" data-k="' + k + '">' +
        '<span class="w">' + U.escapeHtml(v.word) + "</span>" +
        '<input data-meaning="' + k + '" placeholder="释义 / 备注" value="' +
          U.escapeHtml(v.meaning || "") + '">' +
        '<span class="ctx">' + U.escapeHtml(v.context || "") + "</span>" +
        '<button data-del="' + k + '">删除</button></div>';
    }).join("");
  }

  // 生词本唯一的写入入口：划词翻译和「＋生词」都走这里。
  // 已存在时只补/更新释义，不再重复插入。
  async function addWord(word, meaning, context){
    if(WB.cet6Mode && !WB.cet6Mode.ensureWritable("生词本")) return false;
    word = String(word || "").trim();
    if(!word || word.length > 60){
      alert("请选择一个单词或短语（不超过 60 字）。");
      return false;
    }

    if(usingApi()){
      const hit = load().find(function(v){
        return String(v.word || "").toLowerCase() === word.toLowerCase();
      });
      try{
        const data = await WB.api.post("/api/vocab", {
          word: word,
          meaning: String(meaning || ""),
          context: String(context || "").slice(0, 500),
          paper_id: WB.session.paperDir || (WB.session.paper && WB.session.paper.title) || "",
          paper_title: (WB.session.paper && WB.session.paper.title) || "",
          source: "cet6"
        });
        await refresh();
        render();
        if(data.created){
          WB.status("已加入生词本：" + word);
        }else if(meaning && hit && !hit.meaning){
          WB.status("生词本里已有「" + word + "」，已补上释义。");
        }else{
          WB.status("生词本里已经有「" + word + "」了。");
        }
        return !!data.created;
      }catch(e){
        WB.status("生词本写入失败：" + WB.api.errorText(e));
        return false;
      }
    }

    const arr = WB.store.loadVocab();
    const hit = arr.find(function(v){
      return String(v.word || "").toLowerCase() === word.toLowerCase();
    });
    if(hit){
      if(meaning && !hit.meaning){
        hit.meaning = String(meaning);
        WB.store.saveVocab(arr);
        WB.status("生词本里已有「" + word + "」，已补上释义。");
      }else{
        WB.status("生词本里已经有「" + word + "」了。");
      }
      return false;
    }
    arr.unshift({
      word: word, meaning: String(meaning || ""), context: String(context || "").slice(0, 500),
      paper: WB.session.paper.title, at: new Date().toISOString()
    });
    WB.store.saveVocab(arr);
    WB.status("已加入生词本：" + word);
    return true;
  }

  function addSelection(){
    const selObj = window.getSelection ? window.getSelection() : null;
    const sel = selObj ? String(selObj.toString() || "").trim() : "";
    if(!sel || sel.length > 60){
      alert("先在已显示的原文里选中一个单词或短语（不超过 60 字）。");
      return;
    }
    let context = "";
    const node = selObj.anchorNode;
    const el = node && (node.nodeType === 1 ? node : node.parentElement);
    const card = el && el.closest ? el.closest(".card") : null;
    if(card){
      const s = WB.paper.findSentence(Number(card.dataset.i));
      if(s) context = s.en;
    }
    addWord(sel, "", context);
  }

  function togglePanel(){
    const panel = WB.dom.vocabPanel;
    if(panel.classList.contains("hidden")){
      panel.classList.remove("hidden");
      if(usingApi() && !remoteReady){
        refresh().then(render);
      }else{
        render();
      }
    }else{
      panel.classList.add("hidden");
    }
  }

  function exportCsv(){
    if(usingApi()){
      WB.api.download("/api/vocab/export.csv", "生词本.csv").catch(function(e){
        WB.status("导出失败：" + WB.api.errorText(e));
      });
      return;
    }
    const arr = WB.store.loadVocab();
    if(!arr.length){ alert("生词本是空的。"); return; }
    const q = function(x){ return '"' + String(x || "").replace(/"/g, '""') + '"'; };
    const lines = ["单词,释义,上下文,试卷,添加时间"];
    arr.forEach(function(v){
      lines.push([v.word, v.meaning, v.context, v.paper, v.at].map(q).join(","));
    });
    const blob = new Blob(["﻿" + lines.join("\n")], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "生词本.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function init(){
    if(bound) return;
    bound = true;

    document.getElementById("vocabAddBtn").addEventListener("click", addSelection);
    WB.dom.selVocabBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
    WB.dom.selVocabBtn.addEventListener("click", function(){
      addSelection();
      WB.dom.selVocabBtn.classList.add("hidden");
    });

    document.getElementById("vocabBtn").addEventListener("click", togglePanel);
    document.getElementById("closeVocab").addEventListener("click", function(){
      WB.dom.vocabPanel.classList.add("hidden");
    });

    WB.dom.vocabBody.addEventListener("input", function(e){
      const inp = e.target.closest("input[data-meaning]");
      if(!inp) return;
      const k = Number(inp.dataset.meaning);
      const arr = load();
      const item = arr[k];
      if(!item) return;
      if(WB.cet6Mode && !WB.cet6Mode.ensureWritable("生词释义")) return;
      item.meaning = inp.value;
      if(item.id && usingApi()){
        clearTimeout(meaningTimer);
        meaningTimer = setTimeout(function(){
          WB.api.patch("/api/vocab/" + item.id, {meaning: item.meaning}).catch(function(err){
            WB.status("释义保存失败：" + WB.api.errorText(err));
          });
        }, 500);
        return;
      }
      const local = WB.store.loadVocab();
      if(local[k]){
        local[k].meaning = inp.value;
        WB.store.saveVocab(local);
      }
    });

    WB.dom.vocabBody.addEventListener("click", async function(e){
      const b = e.target.closest("button[data-del]");
      if(!b) return;
      const k = Number(b.dataset.del);
      if(WB.cet6Mode && !WB.cet6Mode.ensureWritable("生词本")) return;
      const item = load()[k];
      if(item && item.id && usingApi()){
        try{
          await WB.api.del("/api/vocab/" + item.id);
        }catch(err){
          WB.status("删除失败：" + WB.api.errorText(err));
          return;
        }
        await refresh();
      }else{
        const local = WB.store.loadVocab();
        local.splice(k, 1);
        WB.store.saveVocab(local);
      }
      render();
    });

    document.getElementById("exportVocab").addEventListener("click", exportCsv);
  }

  WB.vocab = {
    init: init,
    render: render,
    addWord: addWord,
    addSelection: addSelection,
    exportCsv: exportCsv,
    syncFromServer: syncFromServer
  };
})(window.WB = window.WB || {});

</script>
<script>
// ---- 75-search.js ----
// @requires: 00-core.js, 20-paper.js, 30-audio.js, 40-render.js, 50-actions.js
// 功能层：本卷句子搜索与跳转。
(function(WB){
  "use strict";

  const U = WB.util;
  let hits = [];
  let bound = false;

  function clear(){
    WB.dom.searchResults.classList.add("hidden");
    WB.dom.searchResults.innerHTML = "";
    hits = [];
  }

  function run(){
    const q = WB.dom.sentenceSearch.value.trim().toLowerCase();
    if(q.length < 2){ clear(); return; }
    hits = [];
    WB.session.paper.sections.forEach(function(sec, si){
      sec.items.forEach(function(cur, ii){
        cur.sentences.forEach(function(s){
          if((s.en || "").toLowerCase().indexOf(q) >= 0){
            hits.push({si:si, ii:ii, s:s, sec:sec.name, item:cur.title});
          }
        });
      });
    });
    WB.dom.searchResults.classList.remove("hidden");
    if(!hits.length){
      WB.dom.searchResults.innerHTML = '<p class="search-empty">没有匹配的句子</p>';
      return;
    }
    WB.dom.searchResults.innerHTML = hits.slice(0, 40).map(function(h, k){
      return '<button class="search-item" data-k="' + k + '">' +
        '<span class="m">' + U.escapeHtml(h.sec) + " / " + U.escapeHtml(h.item) +
          " · 第 " + h.s.i + " 句</span>" +
        '<span class="t">' + U.escapeHtml(h.s.en) + "</span></button>";
    }).join("") + (hits.length > 40
      ? '<p class="search-empty">仅显示前 40 条，共 ' + hits.length + " 条</p>" : "");
  }

  function init(){
    if(bound) return;
    bound = true;

    WB.dom.sentenceSearch.addEventListener("input", run);
    WB.dom.sentenceSearch.addEventListener("keydown", function(e){
      if(e.key === "Escape"){
        WB.dom.sentenceSearch.value = "";
        clear();
        WB.dom.sentenceSearch.blur();
      }
    });
    WB.dom.searchResults.addEventListener("click", function(e){
      const btn = e.target.closest("button[data-k]");
      if(!btn) return;
      const h = hits[Number(btn.dataset.k)];
      if(!h) return;
      WB.actions.selectItem(h.si, h.ii);
      clear();
      WB.dom.sentenceSearch.value = "";
      setTimeout(function(){
        const card = WB.dom.sentences.querySelector('.card[data-i="' + h.s.i + '"]');
        if(card){
          card.scrollIntoView({block:"center", behavior:"smooth"});
          card.classList.add("hit");
          setTimeout(function(){ card.classList.remove("hit"); }, 2200);
        }
        WB.audio.focusSentence(h.s.i);
      }, 60);
    });
  }

  WB.search = {init: init, clear: clear};
})(window.WB = window.WB || {});

</script>
<script>
// ---- 80-shortcuts.js ----
// @requires: 00-core.js, 30-audio.js, 50-actions.js
// 交互层：全局键盘快捷键。
(function(WB){
  "use strict";

  let bound = false;

  function init(){
    if(bound) return;
    bound = true;

    document.addEventListener("keydown", function(e){
      const t = e.target;
      if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" ||
               t.tagName === "SELECT" || t.isContentEditable)) return;
      if((e.ctrlKey || e.metaKey) && (e.key === "j" || e.key === "J")){
        e.preventDefault();
        if(WB.ask && WB.ask.togglePanel) WB.ask.togglePanel();
        return;
      }
      if(e.ctrlKey || e.metaKey || e.altKey) return;

      if(e.key === " "){
        e.preventDefault();
        if(WB.session.activeSentence >= 0) WB.audio.toggleSentence(WB.session.activeSentence);
        else if(WB.audio.isPaused()) WB.audio.safePlay();
        else WB.dom.audio.pause();
      }else if(e.key === "ArrowUp"){
        e.preventDefault();
        WB.audio.moveSentence(-1);
      }else if(e.key === "ArrowDown"){
        e.preventDefault();
        WB.audio.moveSentence(1);
      }else if(e.key === "ArrowLeft" || e.key === "ArrowRight"){
        // 原生播放器默认一次 5 秒，对精听太粗；这里改成 1 秒，Shift 才 5 秒。
        e.preventDefault();
        const step = e.shiftKey ? 5 : 1;
        WB.audio.seekBy(e.key === "ArrowRight" ? step : -step);
        WB.status("已" + (e.key === "ArrowRight" ? "前进" : "后退") +
          " " + step + " 秒。");
      }else if(e.key === "r" || e.key === "R"){
        e.preventDefault();
        WB.audio.replayActive();
      }else if(e.key === "l" || e.key === "L"){
        e.preventDefault();
        WB.actions.toggleLoopActive();
      }else if(e.key === "d" || e.key === "D"){
        e.preventDefault();
        WB.actions.toggleDoneActive();
      }else if(/^[1-5]$/.test(e.key)){
        e.preventDefault();
        WB.actions.toggleTagActive(Number(e.key) - 1);
      }else if(e.key === "/"){
        e.preventDefault();

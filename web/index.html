<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f5f9">
  <title>今日 · 学习工作台</title>
  <link rel="icon" href="/favicon.ico?v=2">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/web/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/web/css/tokens.css">
  <link rel="stylesheet" href="/web/vendor/highlight-dark.css">
  <link rel="stylesheet" href="/web/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/web/css/shell.css">
  <link rel="stylesheet" href="/web/css/modes.css">
  <link rel="stylesheet" href="/web/css/today.css">
  <link rel="stylesheet" href="/web/css/ask.css">
  <link rel="stylesheet" href="/web/css/settings.css">
  <link rel="stylesheet" href="/web/css/study.css">
  <link rel="stylesheet" href="/web/css/review.css">
  <link rel="stylesheet" href="/web/css/materials.css">
  <link rel="stylesheet" href="/web/css/vocab.css">
  <link rel="stylesheet" href="/web/css/knowledge.css">
  <link rel="stylesheet" href="/web/css/browser.css">
  <link rel="stylesheet" href="/web/css/recordings.css">
  <link rel="stylesheet" href="/web/css/agents.css">
  <link rel="stylesheet" href="/web/css/cet6.css">
</head>
<body data-mood="mist" data-density="comfortable" data-scene="study" data-view="card">
  <div class="wco-drag" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <div id="app" class="app">
    <aside class="sidebar">
      <a class="brand" href="#/today" aria-label="学习工作台 · 今日">
        <span class="brand-mark" aria-hidden="true">◒</span>
        <span class="brand-name">学习工作台</span>
        <span class="brand-version" id="version"></span>
      </a>
      <nav class="nav" id="nav" aria-label="模块"></nav>
      <div class="nav-tools">
        <button class="nav-tool" type="button" id="ui-quickbar" title="把快捷栏叫到屏幕上方">
          <span class="nav-icon" aria-hidden="true">⌁</span><span>快捷栏</span>
        </button>
        <button class="nav-tool" type="button" id="ui-pick" title="直接框选屏幕提问">
          <span class="nav-icon" aria-hidden="true">⛶</span><span>框选</span>
        </button>
        <button class="nav-tool" type="button" id="search-hint" title="搜索 / 提问（按 /）">
          <span class="nav-icon" aria-hidden="true">⌕</span><span>搜索 / 提问</span>
        </button>
        <button class="nav-tool" type="button" id="mode-btn" aria-expanded="false" aria-controls="mode-pop" title="界面模式">
          <span class="nav-icon" aria-hidden="true">◫</span><span>模式</span>
        </button>
      </div>
      <div class="side-foot">
        <span class="dot" id="backend-dot" aria-hidden="true"></span>
        <span id="backend-text">连接中…</span>
        <a class="side-link" href="/docs" target="_blank" rel="noreferrer">接口</a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <b id="page-title">今日</b>
          <span class="crumb-sep" aria-hidden="true">·</span>
          <span id="page-date"></span>
          <span class="crumb-sep" aria-hidden="true">·</span>
          <span id="page-clock"></span>
          <p id="page-sub"></p>
        </div>
        <div class="topbar-actions">
          <div id="page-actions"></div>
        </div>

        <div class="mode-pop" id="mode-pop" hidden>
          <div class="mode-row">
            <span class="mode-label">气质</span>
            <div class="moods" role="group" aria-label="界面气质">
              <button class="mood is-on" type="button" data-mood-btn="mist" title="浅色、通透">晨雾</button>
              <button class="mood" type="button" data-mood-btn="ink" title="深色、安静">墨夜</button>
              <button class="mood" type="button" data-mood-btn="paper" title="暖白、书卷气">纸感</button>
            </div>
          </div>
          <div class="mode-row">
            <span class="mode-label">页面</span>
            <div class="seg" role="group" aria-label="页面模式">
              <button type="button" data-group="focus" data-value="off" class="is-on">标准</button>
              <button type="button" data-group="focus" data-value="on">专注</button>
            </div>
          </div>
          <div class="mode-row">
            <span class="mode-label">场景</span>
            <div class="seg" role="group" aria-label="场景">
              <button type="button" data-group="scene" data-value="study" class="is-on">学习</button>
              <button type="button" data-group="scene" data-value="work">工作</button>
            </div>
          </div>
          <div class="mode-row">
            <span class="mode-label">视图</span>
            <div class="seg" role="group" aria-label="视图">
              <button type="button" data-group="view" data-value="card" class="is-on">卡片</button>
              <button type="button" data-group="view" data-value="list">列表</button>
            </div>
          </div>
          <div class="mode-row">
            <span class="mode-label">密度</span>
            <div class="seg" role="group" aria-label="密度">
              <button type="button" data-group="density" data-value="comfortable" class="is-on">舒适</button>
              <button type="button" data-group="density" data-value="compact">紧凑</button>
            </div>
          </div>
          <div class="mode-foot">
            <span>Esc 退出专注</span>
            <button type="button" id="mode-reset">恢复默认</button>
          </div>
        </div>
      </header>

      <section class="view" id="view" aria-live="polite"></section>
    </main>
  </div>

  <button class="focus-exit" id="focus-exit" type="button">退出专注 <kbd>Esc</kbd></button>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="tip" id="tip" role="tooltip"></div>

  <script src="/web/vendor/marked.min.js"></script>
  <script src="/web/vendor/purify.min.js"></script>
  <script src="/web/vendor/highlight.min.js"></script>
  <script src="/web/vendor/katex/katex.min.js"></script>
  <script src="/web/vendor/katex/auto-render.min.js"></script>
  <script type="module" src="/web/js/shell.js"></script>
</body>
</html>

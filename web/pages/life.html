<div class="life-page">
  <section class="stage-hero life-hero">
    <div>
      <p class="stage-eyebrow">生活 · 事务与订阅</p>
      <h2>待办收在一处，卡片每天一张。</h2>
      <p class="stage-sub">事务箱记待办、作息与备注，到期进每日提醒；订阅新闻只筛选当天简报，
        每日一词和自定义订阅各调用一次模型。所有数据只存在本地库里。</p>
      <div class="review-stats" id="life-stats">
        <div class="review-chip"><span>待办</span><strong>—</strong></div>
        <div class="review-chip"><span>今日卡片</span><strong>—</strong></div>
        <div class="review-chip"><span>未读</span><strong>—</strong></div>
      </div>
    </div>
    <div class="life-hero-actions">
      <button class="btn btn-primary" type="button" id="life-item-new">新建事务</button>
      <button class="btn btn-quiet" type="button" id="life-new">新建订阅</button>
    </div>
  </section>

  <section class="panel life-panel">
    <div class="panel-body">
      <div class="life-section-head">
        <h3>事务箱</h3>
        <span class="life-hint" id="life-item-stats">待办 — · 逾期 —</span>
      </div>
      <form class="life-form" id="life-item-form" hidden>
        <h3 id="life-item-form-title">新建事务</h3>
        <div class="life-form-grid">
          <label class="life-field">
            <span>标题</span>
            <input id="li-title" maxlength="120" placeholder="交房租 / 07:10 起床" required>
          </label>
          <label class="life-field">
            <span>类型</span>
            <select id="li-kind">
              <option value="todo">待办</option>
              <option value="habit">作息记录</option>
              <option value="note">备注</option>
            </select>
          </label>
          <label class="life-field">
            <span>到期日（可空）</span>
            <input id="li-due" type="date">
          </label>
        </div>
        <label class="life-field" id="li-value-field" hidden>
          <span>一行记录</span>
          <input id="li-value" maxlength="120" placeholder="07:10 起床 / 精力 3/5">
        </label>
        <label class="life-field">
          <span>备注</span>
          <textarea id="li-note" rows="2" maxlength="2000"
                    placeholder="可选；只写给自己的话"></textarea>
        </label>
        <div class="life-form-actions">
          <button class="btn btn-primary" type="submit">保存</button>
          <button class="btn btn-quiet" type="button" id="li-cancel">取消</button>
        </div>
      </form>
      <div class="life-filters" id="life-item-filters">
        <button class="life-filter is-active" type="button" data-status="open">未完成</button>
        <button class="life-filter" type="button" data-status="done">已完成</button>
        <button class="life-filter" type="button" data-status="archived">已归档</button>
      </div>
      <div class="life-item-list" id="life-item-list">
        <div class="empty">正在读事务…</div>
      </div>
    </div>
  </section>

  <section class="panel life-panel">
    <div class="panel-body">
      <form class="life-form" id="life-form" hidden>
        <h3 id="life-form-title">新建订阅</h3>
        <div class="life-form-grid">
          <label class="life-field">
            <span>主题</span>
            <input id="lf-topic" maxlength="60" placeholder="AI 前沿 / 每日一词" required>
          </label>
          <label class="life-field">
            <span>类型</span>
            <select id="lf-kind">
              <option value="news">新闻（筛选当天简报）</option>
              <option value="word">每日一词</option>
              <option value="custom">自定义</option>
              <option value="price">价格（暂不支持）</option>
              <option value="stock">行情（暂不支持）</option>
            </select>
          </label>
          <label class="life-field">
            <span>频率</span>
            <select id="lf-cadence">
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
            </select>
          </label>
          <label class="life-field">
            <span>时间</span>
            <input id="lf-time" type="time" value="07:30" required>
          </label>
        </div>
        <label class="life-field" id="lf-sources-field">
          <span>来源（可选，逗号分隔；填来源名或类目，如 量子位, ai）</span>
          <input id="lf-sources" maxlength="300" placeholder="量子位, IT之家">
        </label>
        <label class="life-check">
          <input id="lf-enabled" type="checkbox" checked>
          <span>启用</span>
        </label>
        <div class="life-form-actions">
          <button class="btn btn-primary" type="submit">保存</button>
          <button class="btn btn-quiet" type="button" id="lf-cancel">取消</button>
        </div>
      </form>

      <div class="life-cards" id="life-cards">
        <div class="empty">正在读今日卡片…</div>
      </div>
    </div>
  </section>

  <section class="panel life-panel">
    <div class="panel-body">
      <div class="life-section-head">
        <h3>订阅</h3>
        <span class="life-hint">新闻订阅依赖每日简报；简报没生成前不会落卡。</span>
      </div>
      <div class="life-subs" id="life-subs">
        <div class="empty">正在读订阅…</div>
      </div>
    </div>
  </section>
</div>

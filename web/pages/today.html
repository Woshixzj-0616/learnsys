<div class="today-page">
  <div class="stat-strip" id="today-stats" aria-label="今日概览"></div>

  <div class="today-body">
    <section>
      <h2 class="section-title">时间线 <span class="hint" id="timeline-count"></span></h2>
      <div id="today-timeline"></div>
    </section>

    <aside>
      <div class="panel">
        <div class="panel-head">专注</div>
        <div class="panel-body" id="focus-body"></div>
      </div>

      <div class="panel" id="cet6-panel" style="margin-top:16px" hidden>
        <div class="panel-head">六级精听断点</div>
        <div class="panel-body" id="cet6-body"></div>
      </div>

      <div class="shortcuts">
        <button class="shortcut" type="button" data-go="#/ask">
          <span>问一个问题</span><span>进入问一问</span>
        </button>
        <button class="shortcut" type="button" id="continue-last">
          <span>继续最近的会话</span><span>接着上次</span>
        </button>
        <button class="shortcut" type="button" data-go="#/settings">
          <span>检查模型与密钥</span><span>设置</span>
        </button>
      </div>
    </aside>
  </div>
</div>

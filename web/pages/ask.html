<div class="ask-layout">
  <aside class="conv-pane">
    <div class="conv-head">
      <button class="conv-new" type="button" id="new-conv">＋ 新对话</button>
    </div>
    <div class="conv-list" id="conv-list"></div>
  </aside>

  <section class="chat">
    <div class="thread" id="thread">
      <div class="thread-inner" id="thread-inner"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <div class="attach-row" id="attach-row" hidden></div>
        <textarea id="input" rows="1"
          placeholder="想问什么？Enter 发送，Shift+Enter 换行"></textarea>
        <div class="composer-row">
          <select class="select" id="mode" aria-label="回答模式">
            <option value="explain">讲解</option>
            <option value="guide">引导</option>
            <option value="quiz">测验</option>
            <option value="quick">速答</option>
          </select>
          <button type="button" class="btn btn-quiet" id="attach-image">图片</button>
          <button type="button" class="btn btn-quiet" id="attach-doc">文档</button>
          <button type="button" class="btn btn-quiet" id="attach-material">资料库</button>
          <span class="composer-status" id="composer-status"></span>
          <button type="button" class="btn btn-danger" id="stop" hidden>停止</button>
          <button type="submit" class="btn btn-primary" id="send">发送</button>
        </div>
        <input type="file" id="file-image" accept="image/*" aria-label="选择图片" hidden>
        <input type="file" id="file-doc" accept=".pdf,.docx,.pptx,.txt,.md" aria-label="选择文档" hidden>
      </form>
    </div>
  </section>
</div>

<div class="material-picker" id="material-picker" hidden>
  <div class="material-picker-card" role="dialog" aria-modal="true" aria-label="从资料库挂载">
    <div class="panel-head">
      <span>从资料库挂载</span>
      <button class="btn btn-quiet" type="button" id="material-close">关闭</button>
    </div>
    <div class="material-picker-body">
      <input class="material-picker-search" id="material-search" type="search"
             placeholder="搜标题、正文、标签…" autocomplete="off">
      <div class="material-picker-list" id="material-list">
        <div class="empty">正在读资料库…</div>
      </div>
    </div>
  </div>
</div>

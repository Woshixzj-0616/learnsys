<div class="english-review-page">
  <section class="stage-hero er-hero">
    <div>
      <p class="stage-eyebrow">英语复习 · FSRS</p>
      <h2>先自己答，再看答案。</h2>
      <p class="stage-sub">句子来自写作与翻译批改；单词短语来自精听、翻译和每日积累。
        每天每个 tab 最多 10 张新卡，做完这一轮再续。</p>
      <div class="er-tabs" role="tablist">
        <button class="er-tab active" type="button" role="tab" data-kind="sentence">
          句子 <b id="er-count-sentence">0</b>
        </button>
        <button class="er-tab" type="button" role="tab" data-kind="word">
          单词短语 <b id="er-count-word">0</b>
        </button>
      </div>
    </div>
  </section>

  <section class="panel er-panel">
    <div class="panel-head">
      <strong id="er-progress">准备中…</strong>
      <span class="hint" id="er-hint"></span>
    </div>
    <div class="panel-body" id="er-body">
      <div class="empty">正在读到期卡片…</div>
    </div>
  </section>
</div>

<style>
  .at-page{display:flex;flex-direction:column;gap:18px}
  .at-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .at-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin:0 0 6px}
  .at-head h2{margin:0;font-size:24px;letter-spacing:-.01em}
  .at-sub{margin:6px 0 0;color:var(--text-dim);font-size:13px;max-width:720px}
  .at-actions{display:flex;gap:8px;align-items:center}
  .at-compose{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
  .at-compose-row{display:flex;gap:9px;align-items:flex-end}
  .at-compose textarea{flex:1;min-height:46px;max-height:160px;resize:vertical}
  .at-compose-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--text-dim)}
  .at-compose-meta label{display:flex;align-items:center;gap:6px}
  .at-compose-meta input{width:190px}
  .at-login{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:2px}
  .at-login input{width:160px}
  .at-live{border-top:1px solid var(--line);padding-top:9px}
  .at-live-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-dim)}
  .at-live-body{margin-top:7px;max-height:180px;overflow:auto;white-space:pre-wrap;font-size:13px;line-height:1.55;color:var(--text)}
  .at-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
  .at-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 230px);overflow:auto;padding-right:4px}
  .at-row{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;color:var(--text);font:inherit;transition:border-color .15s,background .15s}
  .at-row:hover{border-color:var(--accent-line);background:var(--surface-2)}
  .at-row.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-line) inset}
  .at-row .at-r1{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums}
  .at-row .at-q{font-size:13px;line-height:1.4;margin:5px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .at-row .at-r2{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim)}
  .at-tag{padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--bg-sunken)}
  .at-tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
  .at-tag.bad{color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,transparent)}
  .at-detail{min-width:0;display:flex;flex-direction:column;gap:14px}
  .at-empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:14px;padding:40px;text-align:center;color:var(--text-dim)}
  .at-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .at-stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .at-stat .k{font-size:11.5px;color:var(--text-faint)}
  .at-stat .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .at-stat .u{font-size:11px;color:var(--text-dim);font-weight:400;margin-left:2px}
  .at-path{display:flex;align-items:stretch;flex-wrap:wrap;row-gap:10px;padding:4px 0 8px;gap:0}
  .at-node{min-width:100px;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
  .at-node .n{font-size:11px;color:var(--text-faint)}
  .at-node .t{font-size:12.5px;font-weight:600;margin-top:2px;white-space:nowrap}
  .at-node.gates{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .at-node.llm{border-color:color-mix(in srgb,#a78bfa 45%,var(--line))}
  .at-node.tool{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
  .at-node.answer{border-color:var(--line-strong)}
  .at-arrow{display:flex;align-items:center;color:var(--text-faint);padding:0 5px;font-size:15px}
  .at-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .at-toolbar h3{font-size:14px;margin:0}
  .at-check{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:12px;user-select:none}
  .at-timeline{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
  .at-timeline:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .at-ev{position:relative;margin:0 0 10px}
  .at-ev:before{content:"";position:absolute;left:-22px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--text-faint);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
  .at-ev.gates:before{background:var(--accent)} .at-ev.llm:before{background:#a78bfa}
  .at-ev.direct:before{background:#a78bfa}
  .at-ev.tool:before{background:var(--ok)} .at-ev.nudge:before{background:var(--err)}
  .at-ev.audit:before{background:var(--warn)} .at-ev.answer:before{background:var(--text)}
  .at-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .at-card .at-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .at-card .at-time{font-family:var(--mono,monospace);font-size:11.5px;color:var(--text-faint);min-width:48px}
  .at-card .at-name{font-weight:700;font-size:13.5px}
  .at-card .at-desc{font-size:12.5px;color:var(--text-dim)}
  .at-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .at-chip{font-size:11.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--text-dim);background:var(--bg-sunken)}
  .at-chip.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
  .at-args{margin-top:8px;font-family:var(--mono,monospace);font-size:11.5px;color:var(--text-dim);background:var(--bg-sunken);border:1px solid var(--line);border-radius:9px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
  .at-answer{margin-top:8px;padding:10px 12px;border-radius:9px;background:var(--bg-sunken);border:1px solid var(--line);font-size:13px;white-space:pre-wrap}
  .at-bars{display:grid;gap:7px;margin-top:9px}
  .at-bar-row{display:grid;grid-template-columns:70px 1fr 58px;align-items:center;gap:8px;font-size:11.5px;color:var(--text-dim)}
  .at-track{height:7px;background:var(--bg-sunken);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .at-fill{height:100%;background:linear-gradient(90deg,var(--accent),#a78bfa);border-radius:99px}
  .at-val{text-align:right;font-family:var(--mono,monospace);color:var(--text)}
  .at-page details{margin-top:8px;font-size:11.5px;color:var(--text-faint)}
  .at-page summary{cursor:pointer;color:var(--text-dim)}
  .at-raw{margin-top:8px}
  .at-raw-head{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px}
  .at-raw-table{width:100%;border-collapse:collapse;font-size:11.5px}
  .at-raw-table th{text-align:left;color:var(--text-faint);font-weight:500;border-bottom:1px solid var(--line);padding:4px 6px}
  .at-raw-table td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top;color:var(--text-dim)}
  .at-raw-table td:first-child{font-family:var(--mono,monospace);white-space:nowrap;color:var(--text)}
  .at-raw-table td:nth-child(2){word-break:break-word;max-width:300px}
  .at-raw-full{font-size:10.5px;color:var(--text-faint);margin-top:1px}
  .at-bool.on{color:var(--ok)} .at-bool.off{color:var(--text-faint)}
  .at-raw-json{margin-top:6px}
  .at-page pre{margin:7px 0 0;font-family:var(--mono,monospace);font-size:11px;line-height:1.5;background:var(--bg-sunken);border:1px solid var(--line);border-radius:9px;padding:9px;overflow:auto;max-height:260px;color:var(--text-dim)}
  .at-hint{margin:0 2px;font-size:11.5px;color:var(--text-faint);line-height:1.5}
  .at-legend{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--text-dim)}
  .at-legend summary{cursor:pointer;color:var(--text);font-weight:600}
  .at-legend-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-top:10px}
  .at-legend-grid b{color:var(--text)}
  .at-legend-grid code{font-family:var(--mono,monospace);font-size:11.5px;background:var(--bg-sunken);border:1px solid var(--line);border-radius:5px;padding:0 4px}
  .at-legend-note{margin:10px 0 0;font-size:11.5px;color:var(--text-faint);line-height:1.5}
  @media (max-width:900px){.at-grid{grid-template-columns:1fr}.at-list{max-height:280px}.at-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.at-legend-grid{grid-template-columns:1fr}}
</style>

<div class="at-page">
  <section class="at-head">
    <div>
      <p class="at-eyebrow">智能旅行 · Agent Trace</p>
      <h2>一条消息的调用路径</h2>
      <p class="at-sub">只读查看旅行后端 <code>/api/chat</code> 的 trace_log：开轮判断、模型调用、工具入参 / 回执、打回、审核与耗时。</p>
    </div>
    <div class="at-actions">
      <button class="btn" type="button" id="at-refresh">刷新</button>
    </div>
  </section>

  <section class="at-compose">
    <div class="at-compose-row">
      <textarea class="input" id="at-input" rows="2"
                placeholder="输入一句话，直接发给智能旅行 agent，比如：下周三去北京，帮我查下天气和从北京南站到故宫怎么走"></textarea>
      <button class="btn btn-primary" type="button" id="at-send">发送</button>
    </div>
    <div class="at-compose-meta">
      <span id="at-status">未登录智能旅行</span>
      <button class="btn" type="button" id="at-login-toggle">登录</button>
      <button class="btn" type="button" id="at-new">新对话</button>
      <label>后端 <input class="input" id="at-base" value="http://127.0.0.1:8000" spellcheck="false"></label>
    </div>
    <div class="at-login" id="at-login" hidden>
      <input class="input" id="at-user" placeholder="智能旅行用户名" autocomplete="username">
      <input class="input" id="at-pass" type="password" placeholder="密码" autocomplete="current-password">
      <button class="btn btn-primary" type="button" id="at-login-btn">登录</button>
      <span class="at-compose-meta" id="at-login-status"></span>
    </div>
    <div class="at-live" id="at-live" hidden>
      <div class="at-live-head">
        <span id="at-live-status">连接中…</span>
        <button class="btn" type="button" id="at-live-clear">清空</button>
      </div>
      <div class="at-live-body" id="at-live-body"></div>
    </div>
  </section>

  <div class="at-grid">
    <aside class="at-list" id="at-list">
      <div class="at-empty">正在读 trace…</div>
    </aside>
    <main class="at-detail" id="at-detail">
      <div class="at-empty">左边选一条请求，看它的调用路径。</div>
    </main>
  </div>

  <p class="at-hint">点开任意卡片的「原始事件 + 字段解释」：每个字段都有中文说明，原始 JSON 收在最后一层。字段名会被观测层截到 16 字，值截到 200 / 600 字。</p>
</div>
